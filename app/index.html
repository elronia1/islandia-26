ear el D13)."],["●","Sun Voyager / Harpa","Costanera de RVK, a pie desde el centro — mejor guardarlo para el D2."]],"2":[["●","Hallgrímskirkja (torre)","Vista 360° de los tejados de colores + la bahía. Entrada a la torre paga [VERIFICAR tarifa]."],["●","Skólavörðustígur (calle arcoíris) y Laugavegur","Bajada desde la iglesia: tiendas de lana, cafés."],["●","Harpa + puerto viejo","Paneles de vidrio de Ólafur Elíasson; puerto con los barcos de ballenas y el Grandi Mathöll."],["●","Sun Voyager","Escultura en la costanera Sæbraut, con la Esja de fondo."],["○","Perlan (cúpula)","Mirador 360° + exposición de glaciares/auroras. Es el Plan B de lluvia del día."],["○","Mt. Esja (Steinn)","Solo con energía sobrante real: el plan dice CONSIDERAR SALTARLO por el Fimm."]],"3":[["●","Paso de Hellisheiði","Rte 1: planta geotérmica y el páramo de lava; con sol se ve el mar al sur. Mirador señalizado antes de la bajada."],["●","Cañón Svartagljúfur (zipline)","Es el cañón que sobrevuelan boca abajo. Desde el trailhead de Reykjadalur ya se ve la entrada del valle humeante."],["●","Reykjadalur — valle humeante","Fumarolas a ambos lados del sendero, ollas de barro y el río caliente en la parte alta."],["○","Kerið (cráter con lago)","Rte 35, 15 min de desvío desde Selfoss. Entrada paga [VERIFICAR ~600 ISK]. Solo si el zipline se cancela y sobra tiempo."],["○","Urriðafoss","La cascada más caudalosa del país (no la más alta), 5 min de desvío de la Rte 1 pasando Selfoss. Parada de 15 min sin caminar."],["●","Hekla y Eyjafjallajökull desde la Rte 1","A la izquierda entre Hella y Hvolsvöllur: el volcán de 2010 con su casquete. Pull-outs señalizados."],["●","Seljalandsfoss + Gljúfrabúi","Detrás de la cascada (empaparse) y la escondida en la grieta, 600 m a la izquierda. HOY, no mañana."],["●","Skógafoss (desde el camping)","60 m de caída y arcoíris casi garantizado a la tarde. Mañana la miran desde arriba."]],"4":[["●","Waterfall Way (km 0–8)","26 cascadas del Skógá una tras otra. Es también el Plan B si hay NO-GO."],["●","Puente del Skógá (km 8)","Punto de control 09:30. Desde ahí se acaba el verde y empieza el páramo."],["●","Baldvinsskáli (km 13) y el paso","Refugio; tope 13:00. Vista a Eyjafjallajökull y Mýrdalsjökull a ambos lados."],["●","Magni y Móði","Los dos cráteres nuevos de 2010, todavía tibios. Lava roja/negra bajo los pies."],["●","Heljarkambur y Kattarhryggir","La cornisa y la 'cresta del gato': tres puntos de apoyo, sin fotos caminando."],["●","Bajada a Þórsmörk (Básar)","El bosque de abedules, el Krossá trenzado y las paredes verdes: la vista que justifica el día."]],"5":[["●","Skógafoss desde la base","10 min; ayer la vieron desde arriba."],["○","Kvernufoss","Cascada escondida detrás del museo de Skógar, 20 min a pie i/v, se pasa por detrás. Solo si el cuerpo responde."],["○","Sólheimasandur (avión DC-3)","4 km i/v llanos por arena negra desde la Rte 1. Parking pago [VERIFICAR]. Hoy es recovery: probablemente NO."],["●","Dyrhólaey (arco y faro)","Mirador bajo (arco) y alto (faro). El alto cierra en temporada de aves [VERIFICAR cartel]. Viento en el filo."],["●","Reynisfjara + Reynisdrangar","Columnas de basalto (Hálsanefshellir) y los tres pináculos en el mar. 30 M DE LA ESPUMA."],["●","Vík desde la iglesia","La iglesia roja sobre la colina: vista al pueblo, la playa y los Reynisdrangar. 5 min en motorhome."]],"6":[["●","Kötlujökull (tour Katla)","Lengua glaciar negra de ceniza con la cueva de hielo. Solo con guía."],["●","Mýrdalssandur","Arenal negro del jökulhlaup de Katla: pull-outs sobre la Rte 1."],["●","Eldhraun (mirador)","Lavafield de 1783 tapado de musgo, señalizado. No pisar."],["●","Fjaðrárgljúfur","Cañón de 100 m con pasarelas y miradores (2 km i/v). Rte 206."],["○","Kirkjugólf (Klaustur)","'Piso de iglesia' de columnas de basalto, 5 min del pueblo. Parada de 15 min."],["○","Foss á Síðu / Dverghamrar","Cascada visible desde la Rte 1 (sin bajarse) y basaltos de enanos enfrente: pull-out de 10 min."],["●","Skeiðarársandur + re o si sobra tiempo antes de Vatnshellir."],["●","Vatnshellir","Tubo de lava de 8.000 años (14:00, VHE-T129532012)."],["●","Djúpalónssandur","Playa negra, las 'piedras de fuerza' y restos del pesquero Epine (1948). 30 m de la orilla."],["●","Lóndrangar (mirador)","Dos pináculos de basalto de 75 m sobre el mar, entre Vatnshellir y Hellnar. Pull-out de 10 min."],["●","Arnarstapi: Gatklettur y Bárður","Arco de roca y la estatua de piedra del guardián de Snæfellsnes."]],"14":[["●","Arnarstapi › Hellnar (costero)","Acantilados, arcos (Gatklettur), colonias de aves, Fjöruhúsið en Hellnar."],["○","Búðakirkja (iglesia negra)","Rte 54, 15 min de desvío. La iglesia negra sobre la lava de Búðahraun. 15 min de parada."],["○","Ytri Tunga (focas)","Playa amarilla con colonia de focas, Rte 54. 20 min. Ambos opcionales según el itinerario."],["●","Túnel de Hvalfjörður","5,7 km bajo el fiordo, gratuito."],["●","Reikiavik: Handknitting Association","Skólavörðustígur: la lana auténtica (lopapeysa)."],["●","Sky Lagoon","Laguna infinita sobre el Atlántico + ritual de 7 pasos. Sunset 19:28 en el agua."]],"15":[["●","Keflavík: Vatnsnes / muelle","Si sobra un minuto (no va a sobrar), la costa frente al hotel."],["●","KEF duty free","Skyr, Omnom, Brennivín, sal de Saltverk: lo único 'razonable' del país."]]},"no_track":["t13"],"protocolo_auroras":"<b>Regla acordada: se sale a mirar SIEMPRE. Lo único reglado es la duración.<\/b> <b>Sin tope:<\/b> 16/9 Fáskrúðsfjörður · 20/9 Eldborg (campo de lava, el mejor spot del viaje) · 21/9 Arnarstapi. <b>Tope 30–40 min<\/b> (alba al día siguiente): 11/9 Skógar (Fimm) · 14/9 Skaftafell · 15/9 Höfn · 17/9 Egilsstaðir · 18/9 Vogar (05:00 para Hverfjall + ballenas). <b>Procedimiento:<\/b> a las 21:00, en.vedur.is/aurora — mapa de NUBES primero, KP después; con huecos de cielo y KP ≥3, alarmas 23:00 y 01:00. <b>Cámara en manual:<\/b> ISO 1600 · f/2.8 · 8–15 s · enfoque a infinito hecho de día · batería de repuesto en el bolsillo (el frío las mata). <b>A favor:<\/b> el 20–23/9 cae sobre el equinoccio — estadísticamente el mejor momento del año.","rutina":[["vedur","vedur.is + road.is + safetravel.is chequeados (viento, alertas, cierres)"],["grises","Aguas grises: vaciar si el tanque va >2/3"],["quimico","Casete químico: vaciar solo en puntos designados; recargar químico"],["agua","Agua potable rellenada"],["gas","Gas: nivel ok; llave de paso según briefing de TC [VERIFICAR]"],["interior","Interior: todo suelto guardado y trabado (alacenas, heladera, mesa)"],["exterior","Exterior: escalón retraído, claraboyas cerradas, cable de hookup guardado"]],"check_devolucion":[["full","Tanque de combustible LLENO (full-to-full [VERIFICAR contrato]) — N1/Orkan Njarðvík"],["vaciado","Aguas grises y químico vaciados (último: camping Arnarstapi D14)"],["limpio","Basura fuera, interior barrido, heladera vacía y abierta"],["garrafa","Garrafa llena (recargada) o asumir 104 €"],["video","Video/fotos del estado final + video del pickup del D1 a mano"],["extras","Linen y químico ya pagados como extras: no aceptar cobro duplicado"]],"links":[["Gestor de reservas (Firebase)","https://elronia1.github.io/islandia-26/gestor_reservas_islandia.html","La base viva: cargar gastos y reservas en ruta, sincroniza entre los dos. Necesita señal y login de Google."],["Clima — vedur.is","https://en.vedur.is","Viento, precipitación, alertas por zona"],["Auroras — pronóstico oficial","https://en.vedur.is/weather/forecasts/aurora","KP + mapa de nubosidad (lo que importa es el cielo)"],["Rutas — road.is","https://www.road.is","Estado de carreteras y cierres en tiempo real"],["SafeTravel — condiciones","https://safetravel.is/conditions","Alertas de senderos, avisos ICE-SAR"],["Alertas protección civil — almannavarnir.is","https://www.almannavarnir.is","Riesgo volcánico Reykjanes: junto al IMO, la fuente que decide"],["SafeTravel — dejar plan de viaje","https://safetravel.is/travel-plan","Registrar el Fimm la noche del 11/9"],["Campings — tjalda.is","https://tjalda.is","Reservas y disponibilidad"],["Estacionamientos — Parka","https://parka.is","Reykjadalur, Seljalandsfoss, etc."],["Tipo de cambio — Landsbankinn","https://www.landsbankinn.is/markadir/gjaldmidlar","Referencia \"Kaup\" ISK/USD"],["Siniestros Heymondo (IMA)","https://siniestros.imaiberica.es","Portal de reclamos"]]};
const TRIP_START = new Date(2026, 8, 9); // 9 sept 2026 (local)
const N_DAYS = DATA.dias.length;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('is26:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('is26:' + k, JSON.stringify(v)); } catch (e) {} }
};
const WEEKD = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ---------- fecha ----------
function todayIndex() {
  const now = new Date();
  const d0 = new Date(TRIP_START.getFullYear(), TRIP_START.getMonth(), TRIP_START.getDate());
  const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d1 - d0) / 86400000); // 0..14 durante el viaje
}
function dayDate(i) { return new Date(TRIP_START.getFullYear(), TRIP_START.getMonth(), TRIP_START.getDate() + i); }

// ---------- tema ----------
const THEMES = ['sol', 'noche', 'aurora'];
const THEME_LABEL = { sol: 'Modo sol', noche: 'Modo noche', aurora: 'Modo aurora' }; // muestra el modo actual; tocar = siguiente
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').textContent = THEME_LABEL[t];
  $('meta[name=theme-color]').setAttribute('content', t === 'sol' ? '#E9EEF1' : t === 'noche' ? '#0B1721' : '#070000');
  store.set('theme', t);
}
const FSIZES = [18, 20, 22];
let fsi = store.get('fsize', 0);
function applyFs() { document.documentElement.style.fontSize = FSIZES[fsi] + 'px'; $('#fsBtn').textContent = ['A', 'A⁺', 'A⁺⁺'][fsi]; store.set('fsize', fsi); }
applyFs();
$('#fsBtn').onclick = () => { fsi = (fsi + 1) % FSIZES.length; applyFs(); };
let theme = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'sol');
applyTheme(theme);
$('#themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); };

// ---------- navegación ----------
let cur = store.get('day', null);
const ti = todayIndex();
if (cur === null || ti >= 0 && ti < N_DAYS) cur = (ti >= 0 && ti < N_DAYS) ? ti : 0;
const VIEWS = ['hoy', 'reservas', 'sos', 'recorte', 'check'];
let curView = 'hoy';
function showView(v) {
  if (!VIEWS.includes(v)) v = 'hoy';
  curView = v;
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#strip').style.display = v === 'hoy' ? 'flex' : 'none';
  window.scrollTo(0, 0);
  store.set('view', v);
  setHash();
}
function setHash() {
  const want = curView === 'hoy' ? '#d' + DATA.dias[cur].n : '#' + curView;
  if (location.hash !== want) location.hash = want; // entra al historial: el gesto de volver funciona
}
function applyHash() {
  const m = /^#d(\d{1,2})$/.exec(location.hash);
  if (m) { const i = Math.min(Math.max(+m[1], 1), N_DAYS) - 1; if (i !== cur) { cur = i; store.set('day', i); renderStrip(); renderDay(); } if (curView !== 'hoy') showView('hoy'); return true; }
  const v = location.hash.slice(1);
  if (VIEWS.includes(v)) { if (v !== curView) showView(v); return true; }
  return false;
}
addEventListener('hashchange', applyHash);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { showView(b.dataset.v); if (b.dataset.v === 'hoy') renderDay(); });

// ---------- tira de días ----------
function renderStrip() {
  const s = $('#strip'); s.innerHTML = '';
  DATA.dias.forEach((d, i) => {
    const dt = dayDate(i);
    const b = document.createElement('button');
    b.className = 'dchip' + (i === cur ? ' sel' : '') + (i === ti ? ' hoy' : '') + (d.aurora ? ' au' : '');
    b.setAttribute('role', 'tab');
    b.innerHTML = `D${d.n}<small>${WEEKD[dt.getDay()]} ${dt.getDate()}</small>`;
    b.onclick = () => { cur = i; store.set('day', i); renderStrip(); renderDay(); setHash(); };
    s.appendChild(b);
  });
  const sel = s.querySelector('.sel'); if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ---------- ficha del día ----------
function parseHM(s) { const m = /^(\d{1,2}):(\d{2})/.exec(s.replace('~', '').trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function luzParts(luz) { // "06:33 / 20:15 (nota)"
  const m = /(\d{1,2}:\d{2})\s*\/\s*(\d{1,2}:\d{2})/.exec(luz);
  return m ? [m[1], m[2]] : [null, null];
}
function renderDay() {
  if (document.activeElement && document.activeElement.id === 'nota') return; // no pisar notas mientras escriben
  const d = DATA.dias[cur], v = $('#v-hoy'), isToday = cur === ti;
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  let banner = '';
  if (ti >= 0 && ti < N_DAYS && !isToday) banner = `<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:8px">Estás mirando el D${d.n}.<button class="btn sm" id="goHoy">Volver a HOY (D${DATA.dias[ti].n})</button></div>`;
  if (ti < 0) banner = `<div class="banner">Faltan ${-ti} días para Islandia. Mostrando el D${d.n}.</div>`;
  else if (ti >= N_DAYS) banner = `<div class="banner">El viaje terminó hace ${ti - N_DAYS + 1} día(s). Takk fyrir.</div>`;
  const [sr, ss] = luzParts(d.luz);
  let sunHtml = '';
  if (sr && ss) {
    const a = parseHM(sr), b = parseHM(ss), pct = m => (m / 1440 * 100).toFixed(1) + '%';
    let rest = '';
    if (isToday) rest = nowM < a ? `Amanece en ${fmtDur(a - nowM)}` : nowM < b ? `Quedan ${fmtDur(b - nowM)} de luz` : `Sin luz hasta ${sr} — hora de auroras`;
    sunHtml = `<div class="sun${isToday ? ' today' : ''}" style="--r:${pct(a)};--s:${pct(b)};--n:${pct(nowM)}">
      <div class="lbl"><span>Amanece ${sr}</span><span>${fmtDur(b - a)} de luz</span><span>Anochece ${ss}</span></div>
      <div class="bar"><div class="now"></div></div><div class="rest">${rest}${d.luz.includes('(') ? ' · ' + esc(d.luz.slice(d.luz.indexOf('(') + 1).replace(/\)$/, '')) : ''}</div></div>`;
  }
  const aur = d.aurora ? `<span class="chip au">Auroras: ${esc(d.aurora === true ? 'sí' : d.aurora)}</span>` : '';
  const ext = /EXTREM/i.test(d.intensidad);
  // crono: marcar pasado / ahora si es hoy
  let nowIdx = -1;
  if (isToday) d.crono.forEach((c, i) => { const m = parseHM(c[0]); if (m !== null && m <= nowM) nowIdx = i; });
  const crono = d.crono.map((c, i) => `<li class="${c[2] ? 'fix' : ''}${isToday && i < nowIdx ? ' past' : ''}${i === nowIdx ? ' now' : ''}"><div class="t">${esc(c[0])}</div><div class="x">${esc(c[1])}</div></li>`).join('');
  const treks = d.treks.length ? d.treks.map(t => {
    const u = DATA.trek_urls[t.qr] || [];
    const extra = t.qr === 'z1' ? `<a class="btn" href="https://megazipline.is" target="_blank" rel="noopener">megazipline.is</a><a class="btn o" href="tel:+3547823000">Llamar</a>` : '';
    return `<div class="trek"><div class="n">${esc(t.nombre)}</div><div class="d">${esc(t.datos)}</div><p class="small">${esc(t.parking)}</p>
      <div class="btns">${u[0] ? `<a class="btn" href="${u[0]}" target="_blank" rel="noopener">Wikiloc</a>` : ''}${u[1] ? `<a class="btn o" href="${u[1]}" target="_blank" rel="noopener">AllTrails</a>` : ''}${extra}${!u[0] && !u[1] && !extra ? (DATA.no_track.includes(t.qr) ? '<span class="chip">Sin track — no hace falta</span>' : '<span class="chip">[VERIFICAR] sin track</span>') : ''}</div></div>`;
  }).join('') : '<p class="mu">Sin trekking propio hoy (paseos cortos o tour guiado).</p>';
  // héroe: próximo horario fijo (solo datos del crono; sin inventar salidas)
  const fixedOf = dd => dd.crono.map(c => ({ m: parseHM(c[0]), t: c[0].replace('~', '').trim().slice(0, 5), x: c[1], f: c[2] })).filter(c => c.f && c.m !== null);
  const shortLbl = x => { let s = x.split(' — ')[0].split(' (')[0].split(':')[0].trim(); if (s.length > 46) s = s.slice(0, 44) + '…'; return s; };
  let hero = '';
  if (isToday) {
    const nx = fixedOf(d).find(f => f.m >= nowM);
    if (nx) hero = { t: nx.t, w: shortLbl(nx.x), cd: `Faltan <b>${fmtDur(nx.m - nowM)}</b>` };
    else if (cur + 1 < N_DAYS) { const tm = fixedOf(DATA.dias[cur + 1])[0]; if (tm) hero = { t: tm.t, w: 'Mañana · ' + shortLbl(tm.x), cd: `Faltan <b>${fmtDur(1440 - nowM + tm.m)}</b>` }; }
  } else { const fx = fixedOf(d)[0]; if (fx) hero = { t: fx.t, w: shortLbl(fx.x), cd: 'Primer horario fijo del día' }; }
  const heroHtml = hero ? `<div class="hero"><div class="lbl">${isToday ? 'Próximo horario fijo' : 'Primer horario fijo'}</div><div class="big"><span class="hh">${esc(hero.t)}</span><span class="what">${esc(hero.w)}</span></div><div class="cd">${hero.cd}</div></div>` : '';
  // accesos rápidos + progreso (columnas basálticas: 15 días)
  const qrowHtml = `<div class="qrow">
    <a class="q sos" href="tel:112"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>112</a>
    <a class="q" href="https://en.vedur.is" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>vedur<small>señal</small></a>
    <a class="q" href="https://www.road.is" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 19 8 5M16 5l4 14M12 6v2M12 11v2M12 16v2"/></svg>road.is<small>señal</small></a>
    <button class="q" id="qcamp"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20l7-14 7 14M9 20l3-6 3 6"/></svg>Camping<small>de hoy</small></button>
  </div>`;
  const kmOf = dd => { const m = /(\d+)/.exec((dd.km || '').replace('.', '')); return m ? +m[1] : 0; };
  const kmCum = DATA.dias.slice(0, cur + 1).reduce((a, dd) => a + kmOf(dd), 0);
  const progHtml = `<div class="prog"><div class="lbl"><span>Día ${d.n} de ${N_DAYS}</span><span>${fmtKm(kmCum)} de ${fmtKm(DATA.meta.km_total)} km</span></div><div class="seg">${DATA.dias.map((_, i) => `<i class="${i < cur ? 'on' : i === cur ? 'today' : ''}"></i>`).join('')}</div></div>`;
  const reservasHoy = DATA.reservas.filter(r => r.dia === d.n);
  const resHtml = reservasHoy.length ? `<div class="card fix"><b>Con reserva hoy</b>${reservasHoy.map(r => `<div style="margin-top:6px"><b>${esc(r.cuando.split('·').slice(-1)[0].trim())}</b> — ${esc(r.que)} <span class="mu">(${esc(r.ref)})</span></div>`).join('')}</div>` : '';
  const dt = dayDate(cur);
  v.innerHTML = `${banner}
    <p class="mu" style="margin:0">Día ${d.n} · ${esc(d.fecha)}${isToday ? ' · <b>HOY</b>' : ''}</p>
    <h1>${esc(d.titulo)}</h1>
    <div class="meta"><span class="chip">${esc(d.zona)}</span></div>
    <div class="meta"><span class="chip">${esc(d.km)}</span><span class="chip">${esc(d.cond)}</span><span class="chip${ext ? ' ext' : ''}">Intensidad: ${esc(d.intensidad)}</span>${aur}</div>
    ${heroHtml}
    ${sunHtml}
    ${qrowHtml}
    ${progHtml}
    ${resHtml}
    <details open><summary>Cronograma</summary><div class="body"><ul class="crono">${crono}</ul><p class="small mu" style="margin-top:8px">Rojo = horario fijo (reserva o luz). ${isToday ? 'Se atenúa lo ya pasado según la hora del teléfono.' : ''}</p></div></details>
    <details><summary>Ruta</summary><div class="body">${d.ruta}</div></details>
    <details><summary>Pueblos y servicios</summary><div class="body">${d.pueblos}</div></details>
    <details><summary>Camping</summary><div class="body">${d.camping}</div></details>
    <details><summary>Miradores y puntos en ruta</summary><div class="body">${(DATA.pois[String(d.n)] || []).map(p => `<div class="trek"><div class="n">${p[0] === '●' ? '<span style="color:var(--ac)">●</span>' : '<span class="mu">○</span>'} ${esc(p[1])}</div><p class="small" style="margin:2px 0 0">${esc(p[2])}</p></div>`).join('') || '<p class="mu">—</p>'}<p class="small mu" style="margin-top:8px">● está en el plan · ○ extra solo si sobra tiempo (no mueve el cronograma).</p></div></details>
    <details ${d.treks.length ? 'open' : ''}><summary>Treks y tracks GPS</summary><div class="body">${treks}<p class="small mu">Los links abren la web (o la app si está instalada). Los GPX ya deben estar cargados en el Garmin y en el teléfono antes de salir.</p></div></details>
    <details class="saf" open><summary>Seguridad del día</summary><div class="body">${d.seguridad}</div></details>
    <details class="pb" open><summary>Plan B</summary><div class="body">${d.planb}</div></details>
    ${d.aurora ? `<details class="pb"><summary>Protocolo de auroras</summary><div class="body">${DATA.protocolo_auroras}</div></details>` : ''}
    <details><summary>Más links (necesitan señal)</summary><div class="body">${DATA.links.map(l => `<a class="lk" href="${l[1]}" target="_blank" rel="noopener"><b>${esc(l[0])}</b><small>${esc(l[2])}</small></a>`).join('')}<p class="small mu" style="margin-top:10px">Datos: ${esc(DATA.meta.version_fuente)} · App v${DATA.meta.app_version}.</p></div></details>
    <h2>Notas del día</h2>
    <textarea id="nota" placeholder="Lo que quieras recordar de hoy: gastos, cambios, dónde cargaron combustible…">${esc(store.get('nota' + d.n, ''))}</textarea>
    <div class="btns" style="margin-top:8px">${cur > 0 ? `<button class="btn o" id="prev">← D${cur}</button>` : ''}${cur < N_DAYS - 1 ? `<button class="btn o right" id="next">D${cur + 2} →</button>` : ''}</div>`;
  const gh = $('#goHoy');
  if (gh) gh.onclick = () => { cur = ti; store.set('day', cur); renderStrip(); renderDay(); setHash(); };
  const qc = $('#qcamp');
  if (qc) qc.onclick = () => { const det = [...v.querySelectorAll('details')].find(x => x.querySelector('summary').textContent === 'Camping'); if (det) { det.open = true; det.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); } };
  $('#nota').oninput = e => store.set('nota' + d.n, e.target.value);
  const p = $('#prev'), n = $('#next');
  if (p) p.onclick = () => { cur--; store.set('day', cur); renderStrip(); renderDay(); };
  if (n) n.onclick = () => { cur++; store.set('day', cur); renderStrip(); renderDay(); };
}
function fmtDur(m) { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} h ${String(mm).padStart(2, '0')}` : `${mm} min`; }
const fmtKm = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ---------- reservas ----------
const ST_LABEL = { pagado: 'Pagado', alla: 'Se paga allá', pendiente: 'Pendiente', verificar: '[VERIFICAR]' };
let rfilter = 'todas';
function renderReservas() {
  const v = $('#v-reservas');
  const list = DATA.reservas.filter(r => rfilter === 'todas' || r.estado === rfilter);
  v.innerHTML = `<h1>Reservas</h1><p class="mu small">Tabla maestra según contexto v15 (4/9). Tocar la referencia para copiarla.</p>
    <div class="filters">${['todas', 'pagado', 'alla', 'pendiente', 'verificar'].map(f => `<button class="chip${rfilter === f ? ' sel' : ''}" data-f="${f}">${f === 'todas' ? 'Todas' : ST_LABEL[f]}</button>`).join('')}</div>
    ${list.map(r => `<div class="card rv">
      <div class="top-l"><div><div class="q">${esc(r.que)}</div><div class="w">${esc(r.cuando)}${r.dia ? ' · D' + r.dia : ''}</div></div><span class="st ${r.estado}">${ST_LABEL[r.estado]}</span></div>
      <div class="ref" data-copy="${esc(r.ref)}"><span>${esc(r.ref)}</span><span class="small mu">${esc(r.monto)}</span></div>
      <p class="small">${esc(r.nota)}</p>
      <div class="btns">${r.url ? `<a class="btn sm" href="${r.url}" target="_blank" rel="noopener">${esc(r.prov)}</a>` : `<span class="chip">${esc(r.prov)}</span>`}${r.tel ? `<a class="btn sm o" href="tel:${r.tel.replace(/\s/g, '')}">Llamar</a>` : ''}${r.mail ? `<a class="btn sm o" href="mailto:${r.mail}">Mail</a>` : ''}</div>
    </div>`).join('')}
    ${rfilter === 'todas' ? `<div class="card ac"><b>${esc(DATA.cuentas.titulo)}</b><div style="font-size:1.15rem;font-weight:700;margin:6px 0">${esc(DATA.cuentas.saldo)}</div><p class="small">${esc(DATA.cuentas.detalle)}</p><p class="small"><b>Afuera del número:</b> ${DATA.cuentas.fuera.map(esc).join(' ')}</p><p class="small mu">${esc(DATA.cuentas.nota)}</p></div>` : ''}`;
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { rfilter = b.dataset.f; renderReservas(); });
  v.querySelectorAll('[data-copy]').forEach(el => el.onclick = () => {
    const t = el.dataset.copy; if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { el.firstElementChild.textContent = 'Copiado ✓'; setTimeout(() => el.firstElementChild.textContent = t, 1200); });
  });
}

// ---------- emergencia ----------
function renderSOS() {
  const E = DATA.emergencia, v = $('#v-sos');
  const tel = (num, who, sub) => `<div class="tel"><div class="who">${esc(who)}<small>${esc(sub)}</small></div>${/^\+?\d/.test(num) ? `<a class="btn sm" href="tel:${num.replace(/\s/g, '')}">${esc(num)}</a>` : `<span class="chip">${esc(num)}</span>`}</div>`;
  v.innerHTML = `<h1>Emergencia</h1>
    <a class="btn big fix" href="tel:112">112 — Emergencias Islandia</a>
    <p class="small mu">${esc(E.icesar)}</p>
    <div class="card fix"><b>${esc(E.regla)}</b></div>
    <div class="card ac"><h3 style="margin-top:0">${esc(E.heymondo.nombre)}</h3><p>${esc(E.heymondo.uso)}</p>
      <div class="ref"><span>Póliza ${esc(E.heymondo.poliza)}</span></div>
      ${tel(E.heymondo.asist, 'Asistencia 24 h', 'Llamar ANTES de cualquier gasto')}
      ${tel(E.heymondo.reemb, 'Reembolsos', 'Consultas de reintegro')}
      <div class="btns" style="margin-top:8px"><a class="btn sm o" href="${E.heymondo.portal}" target="_blank" rel="noopener">Portal de siniestros</a></div>
      <p class="small">${esc(E.heymondo.cob)}</p></div>
    <div class="card"><h3 style="margin-top:0">${esc(E.mawdy.nombre)}</h3><p>${esc(E.mawdy.uso)}</p>
      ${tel(E.mawdy.tel, 'Central MAWDY', 'Uruguay')}
      <div class="btns" style="margin-top:8px"><a class="btn sm o" href="${E.mawdy.wa}" target="_blank" rel="noopener">WhatsApp +598 92 888 900</a></div>
      <p class="small">${esc(E.mawdy.cob)}</p></div>
    <div class="card saf"><h3 style="margin-top:0">Riesgo volcánico Reykjanes (D1 y D15)</h3><p>${esc(E.volcan)}</p></div>
    <div class="card saf"><h3 style="margin-top:0">Letra chica del equipaje</h3><p>${esc(E.equipaje)}</p></div>
    <h2>Otros teléfonos</h2><div class="card">${E.otros.map(o => tel(o[1], o[0], o[2])).join('')}</div>
    <p class="small mu">Pasaportes y certificados: en la carpeta de Drive y en fotos del teléfono, no en esta app (queda publicada en la web).</p>`;
}

// ---------- matriz ----------
function renderRecorte() {
  const M = DATA.matriz, v = $('#v-recorte');
  v.innerHTML = `<h1>Matriz de recorte</h1><p class="mu">Si el día se cae, se corta en este orden. Sin culpa y sin debate en ruta.</p>
    <div class="card fix"><b>Intocables (plata + horario)</b><ul style="margin:6px 0 0;padding-left:20px">${M.intocables.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    <h2>Recortables, en orden de sacrificio</h2><div class="card mr">${M.recortables.map((r, i) => `<div class="it"><div class="k">${i + 1}</div><div><b>${esc(r[0])}</b>${r[1] ? `<div class="why">${esc(r[1])}</div>` : ''}</div></div>`).join('')}</div>
    <h2>Reglas de disciplina y colapsos</h2><div class="card pb"><ul style="margin:0;padding-left:20px">${M.colapso.map(x => `<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul></div>`;
}

// ---------- checklists ----------
function ckGroup(title, key, items, opts = {}) {
  const st = store.get(key, {});
  const done = items.filter(i => st[i[0]]).length;
  return `<h2>${title}${opts.reset ? `<button class="btn sm o right" data-reset="${key}" style="float:right">Reiniciar</button>` : ''}</h2>
    <div class="prog">${done}/${items.length}${opts.sub ? ' · ' + opts.sub : ''}</div>
    <div class="card">${items.map(i => `<label class="ck${st[i[0]] ? ' done' : ''}"><input type="checkbox" data-g="${key}" data-k="${i[0]}" ${st[i[0]] ? 'checked' : ''}><span>${esc(i[1])}</span></label>`).join('')}</div>`;
}
function renderCheck() {
  const v = $('#v-check');
  const hoy = new Date(), dk = 'rut:' + hoy.getFullYear() + '-' + (hoy.getMonth() + 1) + '-' + hoy.getDate();
  v.innerHTML = `<h1>Checklist</h1>
    ${ckGroup('Rutina matinal (10 min)', dk, DATA.rutina, { sub: 'se reinicia sola cada día', reset: true })}
    ${ckGroup('Semana previa', 'pre', DATA.check_previaje, { reset: true })}
    ${ckGroup('Devolución D15', 'dev', DATA.check_devolucion, { reset: true })}`;
  v.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    const st = store.get(c.dataset.g, {}); st[c.dataset.k] = c.checked; store.set(c.dataset.g, st); renderCheck();
  });
  v.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { if (confirm('¿Desmarcar toda esta lista?')) { store.set(b.dataset.reset, {}); renderCheck(); } });
}

// ---------- arranque ----------
renderStrip(); renderDay(); renderReservas(); renderSOS(); renderRecorte(); renderCheck();
if (!applyHash()) showView(VIEWS.includes(store.get('view', 'hoy')) ? store.get('view', 'hoy') : 'hoy');
function setOnline() { document.body.classList.toggle('offline', !navigator.onLine); }
addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderDay(); renderCheck(); } });
setInterval(() => { if ($('#v-hoy').classList.contains('on')) renderDay(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
