<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Islandia 2026</title>
<meta name="description" content="Guía offline del viaje a Islandia, 9–23 septiembre 2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Islandia">
<meta name="theme-color" content="#0B1721">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#E9EEF1; --sur:#FFFFFF; --sur2:#F3F6F8; --tx:#12202B; --mu:#4B5D6B; --ln:#CBD5DC;
  --ac:#0A6C9E; --ac-bg:#DCEBF4;
  --fix:#B3261E; --fix-bg:#FBE3E0;
  --saf:#8A5200; --saf-bg:#FFF0D2;
  --pb:#1E6B45; --pb-bg:#DFF1E6;
  --au:#127A57; --au-bg:#D4F0E4;
  --now:#0A6C9E;
  --sun:#F2B23A; --night:#2E4A5E;
}
[data-theme="noche"]{
  --bg:#0B1721; --sur:#14232E; --sur2:#1B2C39; --tx:#E7EEF3; --mu:#9DB0BE; --ln:#2A3C4A;
  --ac:#63B8EA; --ac-bg:#12303F;
  --fix:#FF7A6C; --fix-bg:#3A1B18;
  --saf:#F0B44C; --saf-bg:#3A2C10;
  --pb:#6ED0A0; --pb-bg:#12352A;
  --au:#3FD69B; --au-bg:#0F3628;
  --now:#63B8EA; --sun:#F2B23A; --night:#0B1721;
}
[data-theme="aurora"]{
  --bg:#070000; --sur:#150303; --sur2:#1E0505; --tx:#FF5A45; --mu:#D4543E; --ln:#3A0F0C;
  --ac:#FF5A45; --ac-bg:#2A0806;
  --fix:#FF7A6C; --fix-bg:#3A0F0C;
  --saf:#FF9A80; --saf-bg:#2A0806;
  --pb:#FF7A6C; --pb-bg:#2A0806;
  --au:#FF5A45; --au-bg:#2A0806;
  --now:#FF5A45; --sun:#FF5A45; --night:#150303;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Avenir Next",-apple-system,"Helvetica Neue",system-ui,sans-serif;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
a{color:var(--ac)}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--ln)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:1rem;letter-spacing:.01em}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:.8rem}
.tbtn{background:var(--sur);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;font-size:.9rem;font-weight:600;min-height:44px}
.tbtn:active{background:var(--sur2)}
.pill-off{display:none;font-size:.78rem;color:var(--mu);background:var(--sur2);border-radius:999px;padding:4px 10px}
body.offline .pill-off{display:inline-block}
/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;min-height:56px;border-radius:14px;border:1px solid var(--ln);background:var(--sur);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;line-height:1.05}
.dchip small{font-weight:500;font-size:.72rem;color:var(--mu);margin-top:3px}
.dchip.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.dchip.sel small{color:#fff;opacity:.85}
.dchip.hoy{box-shadow:inset 0 0 0 2px var(--au)}
.dchip.au{border-bottom:3px solid var(--au)}
/* layout */
main{padding:12px 14px;max-width:680px;margin:0 auto}
.view{display:none}.view.on{display:block}
h1{font-size:1.55rem;line-height:1.15;margin:.2rem 0 .3rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem;font-weight:700}
h3{font-size:1rem;margin:.6rem 0 .3rem;font-weight:700}
p{margin:.35rem 0}
.mu{color:var(--mu)}
.card{background:var(--sur);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.card.fix{border-left:5px solid var(--fix);background:var(--fix-bg)}
.card.saf{border-left:5px solid var(--saf);background:var(--saf-bg)}
.card.pb{border-left:5px solid var(--pb);background:var(--pb-bg)}
.card.ac{border-left:5px solid var(--ac);background:var(--ac-bg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--sur2);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip.au{background:var(--au-bg);border-color:var(--au);color:var(--au)}
.chip.ext{background:var(--fix-bg);border-color:var(--fix);color:var(--fix)}
/* sun bar (firma) */
.sun{margin:12px 0 4px}
.sun .lbl{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600}
.sun .bar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--night) 0 var(--r),var(--sun) var(--r) var(--s),var(--night) var(--s) 100%);margin:6px 0}
.sun .now{position:absolute;top:-5px;width:3px;height:24px;background:var(--now);border-radius:2px;left:var(--n);display:none}
.sun.today .now{display:block}
.sun .rest{font-size:.85rem;color:var(--mu)}
/* crono */
.crono{list-style:none;margin:0;padding:0}
/* dashboard */
.hero{background:var(--sur);border:1px solid var(--ln);border-left:6px solid var(--fix);border-radius:16px;padding:12px 14px;margin:10px 0}
.hero .lbl{font-size:.85rem;font-weight:600;color:var(--mu)}
.hero .big{display:flex;align-items:baseline;gap:12px;margin:2px 0;flex-wrap:wrap}
.hero .hh{font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:var(--fix)}
.hero .what{font-size:1.1rem;font-weight:700;line-height:1.25;max-width:64%}
.hero .cd{font-size:.95rem;color:var(--mu)}
.hero .cd b{color:var(--tx)}
.qrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.q{background:var(--sur);border:1px solid var(--ln);border-radius:12px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;font-weight:700;text-align:center;text-decoration:none;color:var(--tx);padding:6px 2px}
.q svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.q.sos{background:var(--fix);border-color:var(--fix);color:#fff}
[data-theme="aurora"] .q.sos{color:#150303}
.q small{font-weight:500;color:var(--mu);font-size:.66rem}
.q.sos small{color:#fff;opacity:.85}
[data-theme="aurora"] .q.sos small{color:#150303}
.prog{margin:12px 0 4px}
.prog .lbl{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--mu);margin-bottom:5px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:10px;border-radius:2px;background:var(--ln)}
.seg i.on{background:var(--ac)}
.seg i.today{background:var(--au)}
.crono li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);position:relative}
.crono li .t{font-weight:700;font-size:1rem;color:var(--mu);line-height:1.3}
.crono li.fix .t{color:var(--fix)}
.crono li.fix::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:5px;border-radius:3px;background:var(--fix)}
.crono li.past{opacity:.5}
.crono li.now{background:var(--ac-bg);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.crono li .x{font-size:.98rem}
/* details */
details{border:1px solid var(--ln);border-radius:16px;background:var(--sur);margin:10px 0;overflow:hidden}
details summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:1.08rem;display:flex;justify-content:space-between;align-items:center;min-height:52px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:1.4rem;color:var(--mu);font-weight:500}
details[open] summary::after{content:"–"}
details .body{padding:0 14px 14px;font-size:.98rem}
details.saf{border-left:5px solid var(--saf)} details.saf summary{color:var(--saf)}
details.pb{border-left:5px solid var(--pb)} details.pb summary{color:var(--pb)}
/* treks */
.trek{padding:12px 0;border-top:1px solid var(--ln)}
.trek:first-child{border-top:0}
.trek .n{font-weight:700;font-size:1.02rem}
.trek .d{color:var(--mu);font-size:.9rem;margin:2px 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:700;text-decoration:none;font-size:.95rem}
.btn.o{background:transparent;color:var(--ac)}
.btn.big{width:100%;font-size:1.3rem;min-height:64px}
.btn.fix{background:var(--fix);border-color:var(--fix)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.85rem}
[data-theme="aurora"] .btn{color:#150303}
[data-theme="aurora"] .btn.o{color:var(--ac)}
textarea{width:100%;min-height:90px;border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;font-size:1rem;background:var(--sur2);color:var(--tx);resize:vertical}
/* reservas */
.rv .top-l{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rv .q{font-weight:700;font-size:1.05rem}
.rv .w{color:var(--mu);font-size:.9rem}
.st{font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.pagado{background:var(--pb-bg);color:var(--pb)} .st.alla{background:var(--saf-bg);color:var(--saf)}
.st.pendiente{background:var(--fix-bg);color:var(--fix)} .st.verificar{background:var(--sur2);color:var(--mu);border:1px solid var(--ln)}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:1rem;background:var(--sur2);border-radius:8px;padding:6px 10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;word-break:break-all}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}.filters .chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
/* checks */
.ck{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.ck input{width:28px;height:28px;flex:0 0 28px;accent-color:var(--ac);margin:1px 0 0}
.ck.done span{text-decoration:line-through;color:var(--mu)}
.ck span{font-size:1rem}
.prog{font-size:.85rem;color:var(--mu);margin:-4px 0 6px}
/* matriz */
.mr{counter-reset:m}
.mr .it{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.mr .it .k{font-weight:700;font-size:1.3rem;color:var(--fix);line-height:1}
.mr .it .why{color:var(--mu);font-size:.9rem}
/* emergencia */
.tel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.tel .who{font-weight:600}.tel .who small{display:block;color:var(--mu);font-weight:500;font-size:.85rem}
/* links */
.lk{display:block;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--sur);margin:8px 0;text-decoration:none;color:var(--tx)}
.lk b{color:var(--ac)}.lk small{display:block;color:var(--mu)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--mu);min-height:56px;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);background:var(--ac-bg)}
.banner{background:var(--au-bg);border:1px solid var(--au);color:var(--au);border-radius:12px;padding:10px 12px;font-weight:600;margin:0 0 10px}
.small{font-size:.85rem}
.right{margin-left:auto}
@media (prefers-reduced-motion:no-preference){details .body{animation:fd .15s ease-out}}
@keyframes fd{from{opacity:0}to{opacity:1}}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">Islandia 2026<small id="subt">Giancarlo &amp; María Noel · motorhome · 9–23 sept</small></div>

<script>
const DATA = {"meta":{"viaje":"Islandia 9-23 sept 2026","version_fuente":"itinerario v16 + contexto v17 (5/9). Cambios v17: Stuðlagil pasa del D9 al D10; Hvítserkur reemplazado por Kolugljúfur (D12); Rauðfeldsgjá + parada técnica (D14); Esja confirmada (D2); Fimm sale 05:45; TABLA DE LUZ RECALCULADA (la v16 estaba interpolada desde Reikiavik y sobrestimaba hasta 27 min de luz en el este); riesgo volcánico Reykjanes; taxi 23/9 reservado; tirolina cerrada (riesgo asumido).","version_guia":"v17 — 5 de septiembre de 2026","pax":["Giancarlo","María Noel"],"km_total":2430,"presupuesto_usd":"10.800-12.090","actividades_usd":2318,"fx":{"isk_usd":124,"isk_eur":142,"nota":"FX de trabajo v11-v14. Verificar Landsbankinn 'Kaup' días antes de viajar."},"version":"v17","app_version":"1.4 (5/9/2026) — fuentes v17 completas"},"dias":[{"n":1,"fecha":"Miércoles 9 de septiembre","titulo":"Llegada · Blue Lagoon · Reikiavik","zona":"Keflavík › Grindavík › Reikiavik","km":"80 km","cond":"~1 h 30 total (3 tramos cortos)","luz":"06:32 / 20:16 (civil 05:42–21:07, Reikiavik)","intensidad":"Media (jet lag)","aurora":false,"crono":[["07:00","Aterrizaje KEF (UA138 desde EWR). Migraciones + valijas.",0],["07:00–08:00","Transfer de Touring Cars desde el aeropuerto (incluido con la llegada). Base: Klettatröð 6, Ásbrú (ex base militar, 5 min).",0],["08:00","PICKUP MOTORHOME Touring Cars — papeleo, video-inspección del vehículo (filmar TODO: techo, bajos, parabrisas), demo de sistemas. Pedir que muestren: Truma, heladera, válvulas de agua, casete químico, garrafas.",1],["09:30–10:30","Manejo de práctica suave hacia Grindavík/Blue Lagoon por Rte 43. Primer contacto con el ancho del vehículo.",0],["11:00","BLUE LAGOON — slot reservado (BL00524862). Incluye almuerzo en Lava Restaurant. Ducha desnudo ANTES (etiqueta islandesa, sin excepción).",1],["15:00–16:00","Salida hacia Reikiavik por Rte 43 + Rte 41 (50 min).",0],["16:30","Bónus — despensa grande de arranque (lista en apéndice F; Bónus cierra ~18:30).",0],["18:00","Check-in Reykjavik Campsite (Laugardalur). Hookup 230 V, primera rutina completa del motorhome con luz de día.",0],["21:00","A dormir temprano: el D3 arranca 08:00 y el jet lag pega.",0]],"ruta":"<b>KEF › Klettatröð 6 (5 min):<\/b> el transfer lo hace TC. <b>Ásbrú › Blue Lagoon (~20 min):<\/b> Rte 41 hacia el este y desvío a Rte 43 sur (dirección Grindavík). Carretera ancha y asfaltada, ideal como primer tramo. <b>Ojo zona volcánica:<\/b> la península de Reykjanes viene con actividad volcánica intermitente desde 2021; el acceso a Blue Lagoon puede cambiar de ruta según el día. Chequear road.is y safetravel.is esa misma mañana. <b>Blue Lagoon › Reikiavik (~50 min):<\/b> Rte 43 norte + Rte 41 este. Tráfico real al entrar a la capital después de las 16:00.","pueblos":"<b>Reikiavik (base D1–D2):<\/b> súper — Bónus (el más barato, cierra ~18:30) y Krónan (horario más amplio); para olvidos nocturnos hay Hagkaup 24 h (caro) y 10-11 (muy caro, evitar). Piscina: Laugardalslaug está pegada al camping (la más grande del país). Farmacias (Lyfja/Lyf og heilsa) en el centro y en malls [VERIFICAR horarios]. Comer barato: Bæjarins Beztu (hot dogs, clásico) y food halls; trampa turística: restoranes de Laugavegur con menú en 6 idiomas y foto de ballena.","camping":"<b>Reykjavik Campsite (Laugardalur)<\/b> — abierto todo el año, al lado de Laugardalslaug. Servicios completos: electricidad, duchas, cocina común, lavandería, vaciado de químico/grises. ~2.000–3.000 ISK/pax + extra por electricidad [VERIFICAR en tjalda.is / web del camping]. No suele llenarse en septiembre, pero la reserva online da tranquilidad. <b>Alternativa:<\/b> camping Grindavík si el vuelo llega muy tarde o hay lío en la 41.","treks":[],"seguridad":"Primer día al volante de un vehículo grande, con jet lag: tramos cortos, sin apuro. Viento lateral en la Rte 41: dos manos al volante y OJO AL ABRIR PUERTAS (el viento las arranca — no lo cubre ningún seguro básico). Filmar el motorhome entero en el pickup: es tu evidencia ante Touring Cars al devolver.","planb":"<b>Si el vuelo se retrasa >3 h:<\/b> mover Blue Lagoon al día 14 (política de cambios de BL [VERIFICAR con la reserva]) y convertir D1 en: pickup › Bónus › camping y descanso. El itinerario ya prevé esta jugada."},{"n":2,"fecha":"Jueves 10 de septiembre","titulo":"Esja (Þverfellshorn) + Reikiavik a fondo","zona":"Reikiavik capital","km":"120 km","cond":"0–1 h 30","luz":"06:34 / 20:12 (civil 05:44–21:02, Reikiavik/Esja)","intensidad":"Media","aurora":false,"crono":[["07:30","Desayuno. Chequeo de mails: total final de Touring Cars (Elsa). El taxi del 23/9 YA ESTÁ RESERVADO — no hace falta reclamarlo.",0],["08:00","Salida al trailhead de ESJA: Rte 1 norte pasando Mosfellsbær hasta el parking de Mógilsá (~25 min, café Esjustofa en la base).",0],["08:30","ESJA. Subir por el sendero del ESTE (cruza el puente sobre el Mógilsá a los 225 m: es el menos empinado) hasta STEINN (597 m, 3,3 km). Bajar por el oeste haciendo circuito.",1],["10:00","CIMA ÞVERFELLSHORN (780 m) si la roca está SECA: tramo corto de cadenas sobre pedregal. Con lluvia, hielo o viento fuerte, Steinn es la vuelta correcta — la decisión la toma la roca, no las piernas.",1],["11:45","Bajada completa. Vuelta a Reikiavik.",0],["13:00","ALMUERZO: SKÁL! en Hlemmur Mathöll — sin reserva (food hall, se pide en barra). Alternativas a 5 min: Reykjavik Roasters, Brauð & Co, Sandholt.",0],["14:30","COMPRA CLAVE: 2 LINTERNAS FRONTALES (Fjallakofinn o Útilíf, Kringlan — ~4.000–8.000 ISK las dos). NO son opcionales: el bus del D4 para en Básar 'solo si te ven'. Pilas de repuesto.",1],["15:30","BÓNUS grande del Fimm: snacks energéticos, frutos secos, geles, isotónicos, pasta, avena. Monedas de 100 ISK para las duchas de Skógar (400 por 5 min).",1],["16:30","Centro: Hallgrímskirkja (torre, vista 360°), Skólavörðustígur (calle arcoíris), Harpa y puerto viejo.",0],["19:00","CENA: Matur og Drykkur (reserva #9260773) — platos islandeses históricos reinterpretados.",1],["21:30","Vuelta al camping. Preparar mochilas del D3 (Reykjadalur: traje de baño + toalla) y del D4.",0]],"ruta":"<b>Camping Laugardalur › Mógilsá (Esja), ~25 min:<\/b> Rte 1 al norte pasando Mosfellsbær; parking grande y gratuito con café en la base. <b>Sendero:<\/b> muy marcado y señalizado a intervalos; a los 225 m se bifurca — el del ESTE (por el puente) es menos empinado, lo habitual es subir por ahí y bajar por el oeste. Hasta Steinn son ~6,6 km i/v y 1–3 h según ritmo. <b>Tarde a pie:<\/b> del camping al centro hay 30–40 min caminando o bus Strætó (app Klappið). El motorhome NO entra al centro: calles angostas y estacionamiento tarifado por zonas. Kringlan tiene estacionamiento propio y las dos tiendas de montaña.","pueblos":"Ver ficha D1 para súper/piscina/farmacia. Datos de hoy: los food halls (Hlemmur, Grandi Mathöll) son la mejor relación calidad-precio del centro; café bueno: Reykjavik Roasters. Souvenirs: dejarlos para el D14 (hay tiempo asignado).","camping":"<b>Reykjavik Campsite (Laugardalur)<\/b> — segunda noche, misma logística. Aprovechar lavandería si hace falta: la próxima ciudad con lavandería cómoda es Höfn (D7) o Akureyri (D11).","treks":[{"nombre":"Esja: Steinn › Þverfellshorn","parking":"Parking de Mógilsá (Rte 1 norte, ~25 min de Reikiavik). Gratuito.","datos":"6,6 km i/v hasta Steinn (597 m) · ~600 m de desnivel · 2–4 h · cima Þverfellshorn 780 m con cadenas","qr":"t12"}],"seguridad":"El único tramo con riesgo real de todo el día son las CADENAS entre Steinn y Þverfellshorn: con roca mojada o hielo temprano cambian de carácter. Chequear vedur.is esa mañana; si llueve o hay viento fuerte, Steinn es la vuelta y no se discute. Llevar capas, guantes y bastones: a 780 m el clima cambia rápido aunque abajo haya sol. Propinas: no se dejan. En las piscinas, ducha desnudo antes de entrar, sin traje: es regla, no sugerencia.","planb":"<b>Si llueve fuerte todo el día:<\/b> Esja hasta Steinn o directamente cancelada, y plan museos — Perlan (glaciares y aurora simulada) o Museo Marítimo, + hot pots largos en Laugardalslaug. <b>La compra de frontales y la de Bónus NO se saltean con ningún clima.<\/b> La cena de las 19:00 no se mueve."},{"n":3,"fecha":"Viernes 11 de septiembre","titulo":"Mega Zipline · Reykjadalur (río termal) · Costa Sur hasta Skógar","zona":"Reikiavik › Hveragerði › Seljalandsfoss › Skógar","km":"165 km","cond":"~2 h 45 en 3 tramos","luz":"06:30 / 19:58 (civil 05:41–20:47, Skógar)","intensidad":"Media-alta (víspera del Fimm)","aurora":false,"crono":[["08:15","SALIDA de Reikiavik (tanque lleno + agua llena). Rte 1 este por el paso Hellisheiði — niebla frecuente aunque en la ciudad haya sol. Media hora más tarde que el plan v12: se gana sueño y queda buffer.",1],["09:15","Llegada a la zona de Hveragerði. [VERIFICAR PUNTO DE ENCUENTRO] el ticket dice Árhólmar 1, 810 Hveragerði; la web ubica la recepción junto al Reykjadalur Café (“The Lodge”), en el trailhead del hike (~4 km al norte por Breiðamörk). LLAMAR AL +354 782 3000 ANTES DEL VIAJE y marcar los dos puntos offline.",1],["10:05","Check-in Mega Zipline (estar 10 min antes). Dejar TODO en el motorhome: prohibido mochilas, celulares, ropa suelta y sandalias. Buff ajustado bajo el casco (confirmar en recepción).",1],["10:15","MEGA ZIPLINE — Superman Ride “Fast as a Falcon”: 1 km boca abajo sobre el cañón Svartagljúfur, hasta ~120 km/h. Ref MEGAZIP-T144880936, PAGADO (22.933 ISK los 2). Duración total 50-55 min. Único registro posible: el video del operador (2.900 ISK/pax, se compra en recepción).",1],["11:30","Parking Reykjadalur (Rjúpnabrekkur). HIKE al río termal: 7 km i/v, ~1 h de subida. BAÑO EN EL RÍO ACOTADO A 45 MIN (regla del día: mañana es el Fimm). Traje puesto desde el motorhome, toalla y ojotas.",1],["14:05","Bajada terminada. Almuerzo en el motorhome o en Hveragerði (pueblo de invernaderos).",0],["15:00","Rte 1 este: Selfoss (último súper grande: Bónus/Krónan) › Hella › Hvolsvöllur.",0],["16:35","SELJALANDSFOSS — caminar DETRÁS de la cascada (empaparse es parte; impermeable total). + GLJÚFRABÚI, la cascada escondida en la grieta 600 m a la izquierda: verla HOY (mañana no hay tiempo).",1],["17:50","Rte 1 este hasta Skógar (35 min).",0],["18:25","Camping Skógar. Cena temprana y preparar TODO el equipo del Fimmvörðuháls (capas, frontales, agua, comida, bastones, Garmin cargado con el course).",1],["20:00","Registrar el plan de mañana en safetravel.is + chequear vedur.is (viento en cumbre) y road.is. Primer go/no-go del Fimm.",1],["21:00","DORMIR. La hora de dormir NO se mueve: mañana suena la alarma ~05:15.",1]],"ruta":"<b>Reikiavik › Hveragerði (40-45 min):<\/b> Rte 1 sube al páramo de Hellisheiði — niebla y viento frecuentes incluso con sol en la ciudad; bajada con curvas hacia Hveragerði. <b>Zipline y trailhead:<\/b> si la recepción es la del Reykjadalur Café, coincide exactamente con el parking Rjúpnabrekkur del hike — cero traslado entre una cosa y la otra. Si es Árhólmar 1 (centro de Hveragerði), sumar ~10 min de ida y vuelta. <b>Hveragerði › Selfoss (15 min):<\/b> llano. Completar despensa en Selfoss (después solo hay súper chicos hasta Vík). <b>Selfoss › Seljalandsfoss (55 min):<\/b> Rte 1 recta entre granjas, con Hekla y luego Eyjafjallajökull a la izquierda. Desvío por la Rte 249, a metros de la Ring Road (parking pago [VERIFICAR tarifa, ~800-1.000 ISK]). <b>Seljalandsfoss › Skógar (30 min):<\/b> Rte 1 pegada a los acantilados de la antigua costa.","pueblos":"<b>Hveragerði:<\/b> pueblo geotermal (invernaderos iluminados); panadería Almar Bakari [VERIFICAR]; piscina municipal buena. <b>Selfoss:<\/b> la \"capital\" del sur — Bónus y Krónan, farmacia, gasolineras N1/Orkan. Última parada de precios normales. <b>Skógar:<\/b> es un caserío: museo folk, un par de hoteles y el camping. Sin súper — llegar con todo comprado.","camping":"<b>Camping Skógar<\/b> — al pie de Skógafoss (dormís escuchando la cascada). Servicios básicos: baños, duchas [VERIFICAR si con ficha], sin cocina techada. ~1.500–2.500 ISK/pax [VERIFICAR]. No se reserva: se paga en el lugar. <b>Clave logística:<\/b> es la base perfecta para el Fimm — el trailhead está a 200 m de la carpa.","treks":[{"nombre":"Mega Zipline Superman (no es trek, pero es el hito fijo del día)","parking":"[VERIFICAR] Árhólmar 1, 810 Hveragerði (ticket) vs recepción junto al Reykjadalur Café / trailhead de Reykjadalur (web). Llamar +354 782 3000.","datos":"10:15 · 50-55 min check-in a check-out · peso 30-120 kg (con viento suben el mínimo, hasta ~60 kg) · mín. 9 años","qr":"z1"},{"nombre":"Reykjadalur — río termal","parking":"Parking Reykjadalur (Rjúpnabrekkur), final del camino desde Hveragerði. Pago por app Parka [VERIFICAR tarifa].","datos":"7 km i/v · +330 m aprox · 2h30-3h con baño (hoy: baño tope 45 min)","qr":"t1"}],"seguridad":"<b>Zipline:<\/b> con viento el operador sube el peso mínimo (visto hasta 60 kg) — hay riesgo real de que a alguien liviano lo dejen en tierra ese día; no discutir la decisión del operador. Ir de cabeza a 100+ km/h con 8-10 °C corta el aire: buff ajustado. Sin celular a bordo, no hay forma de filmarse. <b>Reykjadalur:<\/b> el sendero cruza zona geotermal activa — NO salirse de las pasarelas (quemaduras reales cada año). La temperatura del río varía por tramo: probar antes de meterse entero. <b>Seljalandsfoss:<\/b> piso resbaladizo detrás de la cascada, rocío constante — calzado con agarre. <b>Regla de disciplina del día:<\/b> si el día se atrasa se recorta el baño en el río, NUNCA la preparación del Fimm ni las horas de sueño.","planb":"<b>Si el operador cancela el zipline por viento:<\/b> reembolso total y el día vuelve al plan v12 (salida 08:00, hike con calma) — que en realidad es mejor para el descanso pre-Fimm. <b>Si dejan a alguien en tierra por peso/viento:<\/b> el otro vuela igual; no discutir, no reprogramar (mañana es el Fimm). <b>Si el clima está feo en Reykjadalur<\/b> (lluvia fuerte/viento): saltear el hike, piscina de Hveragerði o seguir directo y sumar Sólheimasandur o el museo de Skógar por la tarde. <b>Si el pronóstico del D4 pinta NO-GO:<\/b> hoy mismo replanificar con la matriz de Plan B (Waterfall Way como sustituto del Fimm). <b>Cancelación propia del zipline:<\/b> 100% de cargo con 1 día o menos — mover fecha SIEMPRE antes que cancelar."},{"n":4,"fecha":"Sábado 12 de septiembre","titulo":"FIMMVÖRÐUHÁLS self-guided (día reina)","zona":"Skógar › Fimmvörðuháls › Básar (Þórsmörk) › bus a Skógar","km":"40 km (25 a pie + bus de regreso)","cond":"0 propia — regreso en bus 20:30","luz":"06:32 / 19:55 (civil 05:44–20:43, Skógar/Þórsmörk) — el bus es a las 20:30, 35 min DESPUÉS de la puesta","intensidad":"EXTREMA","aurora":false,"crono":[["04:45","Despertar. Desayuno fuerte (hecho anoche). Chequeo final: vedur.is (viento en cumbre), safetravel.is/travel-conditions, road.is.",0],["05:15","GO / NO-GO: viento >50 km/h en altura, visibilidad mala o nieve fresca en el paso = NO SE SUBE. Sustituto: Waterfall Way (los primeros ~8 km hasta el puente, ida y vuelta).",1],["05:45","SALIDA desde Skógafoss (escalera este) CON FRONTALES. El crepúsculo civil empieza 05:44 y el sol sale 06:32: los primeros 45 min son con luz escasa, pero la escalera y la senda junto al río Skógá son anchas y sin exposición — es el tramo más seguro para hacer con poca luz. Se gana una hora entera al final del día, que es donde vale.",1],["08:45","Puente sobre el Skógá (km 8). CONTROL Nº 1: si van más tarde de 08:45, evaluar volver por donde subieron.",1],["12:15","TOPE en Baldvinsskáli (refugio, km 13, ~1.000 m). Si no llegaron 12:15, MEDIA VUELTA sin discusión: la bajada a Básar no se hace de noche.",1],["12:45–14:15","Paso entre glaciares + cráteres Magni y Móði (erupción 2010, terreno aún tibio en partes). Fotos rápidas, no demorarse.",0],["14:15–17:45","BAJADA a Þórsmörk: -800/900 m. Heljarkambur (cresta con cadena) y Kattarhryggir (filo expuesto): pasos cortos pero con caída — concentración total, de a uno.",1],["17:45–20:15","Llegada a Básar. Margen real de 2h30 antes del bus: cambiarse, comer caliente, celebrar. Termo y capa extra.",0],["20:15","PRESENTARSE al bus con FRONTALES PRENDIDOS (ref. 201027840000; cambios: +354 867 3535). El sol se pone 19:55: a las 20:15 ya es penumbra y el chofer solo para si los ve.",1],["20:30","Bus Básar › Skógar (cruza los vados del Krossá). Llegada ~22:00. Dormir sin armar nada.",1]],"ruta":"Hoy la \"ruta\" es el sendero (ver perfil arriba). El motorhome NO se mueve de Skógar. El bus de vuelta (Þórsmörk › Skógar) es la única pieza motorizada y está pagado; cruza los vados del Krossá que ningún vehículo alquilado puede cruzar legalmente. Track GPX del recorrido cargado en el Garmin Fenix 8 Pro (course + ClimbPro + inReach activado).","pueblos":"No hay pueblos hoy. Todo lo que se necesita sale de la despensa del motorhome: mínimo 2 L de agua por cabeza, almuerzo + snacks calóricos (frutos secos, chocolate), térmica de repuesto en bolsa estanca.","camping":"<b>Camping Skógar<\/b> — segunda noche, la carpa/motorhome quedó armada. Al volver 22:00: cena caliente rápida (dejar algo pre-cocinado hoy a la mañana) y a dormir.","treks":[{"nombre":"Fimmvörðuháls: Skógar › Básar","parking":"Parking Skógafoss (gratuito). El vehículo pasa el día ahí.","datos":"25–27 km punto a punto · +1.000 m / -800-900 m · 10–12 h (salida 05:45, luz útil 05:44–20:43)","qr":"t2"}],"seguridad":"LA regla del viaje: los horarios de control (08:45 puente / 12:15 Baldvinsskáli) NO se negocian. FRONTALES OBLIGATORIOS, uno por cabeza, con pilas de repuesto: se usan a la salida y son lo que hace que el bus pare en Básar. La linterna del reloj no sirve para eso y además gasta la batería del Fenix, que hoy corre course + ClimbPro + inReach 14 horas. Plan registrado en safetravel.is desde el D3; inReach encendido todo el día. Clima de montaña islandés: se puede pasar de sol a nieve horizontal en 30 min — capas + guantes + gorro SIEMPRE en la mochila. En Heljarkambur/Kattarhryggir: tres puntos de apoyo, sin fotos caminando. Alerta vigente (SafeTravel): agujero señalizado al sur de Fimmvörðuhálsskáli y nieve resbaladiza en Heljarkambur. Seguro: actividad de aventura › HEYMONDO (nivel Básico), +34 913 536 323 CON AVISO PREVIO.","planb":"<b>NO-GO a las 05:30:<\/b> Waterfall Way (ida y vuelta hasta el puente km 8, 16 km, espectacular igual) + tarde en Skógafoss/museo. El bus se pierde (asumido en el análisis de riesgo). <b>Si en el puente van tarde o el clima gira:<\/b> volver por donde subieron — es la salida natural y segura."},{"n":5,"fecha":"Domingo 13 de septiembre","titulo":"RECOVERY · Dyrhólaey · Reynisfjara · Vík","zona":"Skógar › Dyrhólaey › Reynisfjara › Vík","km":"70 km","cond":"~1 h 15","luz":"06:33 / 19:49 (civil 05:45–20:37, Vík)","intensidad":"Baja (a propósito)","aurora":false,"crono":[["09:00","Despertar SIN alarma. Desayuno largo. Estirar piernas en la base de Skógafoss (10 min, están ahí).",0],["11:00","Salida tranquila. Rte 1 este 20 min + Rte 218 al promontorio de Dyrhólaey.",0],["11:30","DYRHÓLAEY (1 h): arco de piedra gigante, vistas a la costa negra infinita y al faro. Con suerte, últimos frailecillos de la temporada (se van a mediados de sept — no prometido).",0],["13:00","Almuerzo en el motorhome.",0],["14:00","REYNISFJARA (45 min): playa negra, columnas de basalto, cuevas. REGLA: mínimo 30 m de la orilla, nunca de espaldas al mar.",1],["15:15","Vík por Rte 1 (10 min). Iglesia arriba del pueblo (mejor vista), Krónan para reponer.",0],["16:30","Camping Vík. Tarde libre: piscina de Vík, diario de viaje, siesta. Cargar todo (mañana Katla).",0]],"ruta":"<b>Skógar › desvío 218 (20 min):<\/b> Rte 1. <b>Rte 218 (10 min):<\/b> asfalto/ripio corto hasta los dos miradores de Dyrhólaey (el de arriba, con faro, cierra según temporada de aves [VERIFICAR cartel en el acceso]). <b>Vuelta a Rte 1 › Rte 215 (10 min):<\/b> a Reynisfjara, parking pago [VERIFICAR tarifa ~750-1.000 ISK]. <b>Rte 1 › Vík (10 min):<\/b> el pueblo aparece tras el túnel de montaña Reynisfjall... no hay túnel: tras rodear el Reynisfjall.","pueblos":"<b>Vík í Mýrdal (~750 hab):<\/b> súper Krónan (bien surtido, el último grande hasta Höfn); gasolinera N1; piscina municipal con vista [VERIFICAR horario dom]; farmacia chica [VERIFICAR días]. Comer: Sústa (fish & chips) o The Soup Company; trampa: los sitios con carteles gigantes de \"volcano show\" sobre la Rte 1. Panadería: en el Skool Beans/Icewear café hay pastelería [VERIFICAR].","camping":"<b>Camping Vík<\/b> — bajo el acantilado, con vista a los Reynisdrangar. Servicios completos: duchas, cocina, lavadero, electricidad. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. En septiembre hay lugar, pero llegar antes de las 18:00 asegura sitio con hookup.","treks":[],"seguridad":"REYNISFJARA ES EL PUNTO MÁS PELIGROSO DEL VIAJE para turistas confiados: las \"sneaker waves\" suben el doble que las anteriores sin aviso y han matado gente. 30 metros mínimo de la línea de espuma, más si el mar está bravo (hay semáforo de riesgo en el acceso — respetarlo). En Dyrhólaey, viento fuerte en el borde del acantilado: no acercarse al filo para la foto.","planb":"<b>Si el D4 dejó el cuerpo destruido:<\/b> cortar Dyrhólaey y hacer solo Reynisfjara + Vík con piscina. <b>Si llueve fuerte:<\/b> mismo plan (estas paradas funcionan con lluvia), más tiempo de piscina y café."},{"n":6,"fecha":"Lunes 14 de septiembre","titulo":"Katla Ice Cave · Fjaðrárgljúfur · Skaftafell","zona":"Vík › Kirkjubæjarklaustur › Skaftafell","km":"160 km","cond":"~2 h 30 propias (+ tour)","luz":"06:27 / 19:38 (civil 05:38–20:27, Skaftafell)","intensidad":"Media-alta","aurora":false,"crono":[["08:30","Desayuno. Preparar capas abrigadas + calzado de trekking (el tour presta crampones y casco).",0],["09:00","KATLA ICE CAVE TOUR (KTR-91396891) — punto de encuentro: Austurvegur 16, Vík. Súper-jeep al glaciar Kötlujökull, cueva de hielo negro. Dura ~3-4 h.",1],["13:00–14:00","Fin del tour. Almuerzo en Vík (o en el motorhome). Tanque lleno en N1 Vík.",0],["14:30","Rte 1 este: campos de lava de Eldhraun cubiertos de musgo (NO PISAR el musgo: tarda décadas en recuperarse).",0],["15:30","FJAÐRÁRGLJÚFUR (1 h): cañón de 100 m con miradores por el borde. Acceso por Rte 206, ripio corto.",0],["17:00","Kirkjubæjarklaustur: café + último súper chico (Kjarval [VERIFICAR]) antes del \"desierto\" de Skeiðarársandur.",0],["18:00","Rte 1 este cruzando los arenales glaciares — puentes de una mano, viento con arena si sopla del norte.",0],["19:00","Camping Skaftafell. Cena y a dormir 22:00 MÁXIMO: mañana es el día más cargado del viaje.",1]],"ruta":"<b>Vík › Klaustur (45 min):<\/b> Rte 1 por Mýrdalssandur y el lavafield de Eldhraun (mirador señalizado). <b>Desvío Fjaðrárgljúfur:<\/b> Rte 206 unos 3 km de ripio decente (OK sin 4x4 en seco) [VERIFICAR estado en road.is]. <b>Klaustur › Skaftafell (50 min):<\/b> Rte 1 por Skeiðarársandur — el arenal glaciar más grande del mundo, puentes angostos, y el Öræfajökull creciendo en el parabrisas. Con viento del N/NE fuerte hay tormentas de arena que dañan pintura: el seguro Sand & Ash de TC cubre esto [VERIFICAR que esté activo en el contrato].","pueblos":"<b>Kirkjubæjarklaustur (~120 hab):<\/b> súper chico tipo Kjarval/Krambúð [VERIFICAR], N1, piscina municipal, info del Parque Nacional Vatnajökull. Es LA parada de servicios entre Vík y Höfn: después no hay nada por 130 km. <b>Freysnes (frente a Skaftafell):<\/b> gasolinera + hotel [VERIFICAR], por si el tanque quedó justo.","camping":"<b>Camping Skaftafell<\/b> — dentro del Parque Nacional, enorme, al pie del glaciar. Duchas (con ficha [VERIFICAR]), electricidad limitada por sector, vaciado. ~2.000–3.000 ISK/pax + tarifa de parking del PN [VERIFICAR]. Abierto todo el año. Posicionarse cerca de la salida del sendero para mañana 07:00.","treks":[],"seguridad":"En la cueva de hielo: seguir al guía SIEMPRE (el hielo negro de Katla se mueve a diario). Musgo de Eldhraun: no pisar ni \"acostarse para la foto\" — multa y daño real. Skeiðarársandur con viento: bajar velocidad, no estacionar de cara al viento con puertas a sotavento sueltas. Seguro del tour: aventura › Heymondo (+34 913 536 323, aviso previo).","planb":"<b>Si cancelan Katla por clima<\/b> (pasa): pivotear a caminata corta guiada en Sólheimajökull si hay cupo del mismo operador [VERIFICAR disponibilidad al momento] o adelantar la tarde: Fjaðrárgljúfur con calma + llegar temprano a Skaftafell y hacer Svartifoss hoy (libera presión del D7)."},{"n":7,"fecha":"Martes 15 de septiembre","titulo":"MEGA-DÍA: Sjónarnípa · Glacier hike · Jökulsárlón","zona":"Skaftafell › Jökulsárlón › Höfn","km":"130 km","cond":"~2 h 15 propias","luz":"06:22 / 19:28 (civil 05:33–20:17, Höfn)","intensidad":"ALTA","aurora":false,"crono":[["06:30","Desayuno fuerte. Sándwiches hechos para TODO el día.",0],["07:00–11:00","LOOP SJÓNARNÍPA (~7-8 km, 4 h): Skaftafellsstofa › Austurbrekkur › mirador Sjónarnípa (el Skaftafellsjökull a tus pies) › Svartifoss (columnas de basalto) › Magnúsarfoss/Hundafoss › base.",1],["11:15","Almuerzo rápido + cambio de medias. Salida en motorhome.",0],["13:10","PRESENTACIÓN Blue Ice Base Camp — Rd 998 (IA-T130140787). Glacier hike guiado en Falljökull/Virkísjökull ~3 h con equipo incluido.",1],["16:45","Fin del tour. Rte 1 este directo a Jökulsárlón (45 min).",0],["17:45","JÖKULSÁRLÓN: icebergs azules + focas casi seguro. Cruzar a pie a DIAMOND BEACH (hielos varados en arena negra).",1],["19:30","ATARDECER en la laguna — la foto del viaje. Frontal a mano para el final.",1],["20:00","Rte 1 este a Höfn (55 min). Cena tardía: si hay energía, langostinos en Höfn; si no, pasta en el camping.",0]],"ruta":"<b>Skaftafell › Base Camp Rd 998 (10 min):<\/b> la Rd 998 sale de la Rte 1 apenas al este [VERIFICAR señalización \"Glacier Adventure/Base Camp\"]. <b> ›  Jökulsárlón (40 min):<\/b> Rte 1 con el Öræfajökull encima y lagunas glaciares a la izquierda (Fjallsárlón queda para otro viaje — hoy no da). <b>Jökulsárlón › Höfn (55 min):<\/b> Rte 1; el puente colgante de la laguna es angosto: paciencia. Diamond Beach: parking del lado del mar, cruzando el puente [VERIFICAR tarifa].","pueblos":"<b>Höfn í Hornafirði (~1.700 hab):<\/b> \"capital de la langosta\" (humarinn — en realidad cigala). Súper Nettó; N1 y Orkan; piscina Sundlaug Hafnar (linda, plan B oficial); lavandería en el camping. Comer: Pakkhús o Hafnarbúðin (roll de langosta más barato) — caro igual: la cigala en Islandia nunca es ganga; trampa: menús \"lobster\" genéricos a precio de oro con poca cigala.","camping":"<b>Camping Höfn<\/b> — junto a la entrada del pueblo, completo (duchas, cocina, lavadero, electricidad). ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Llegada tarde OK: se paga a la mañana si la recepción cerró [VERIFICAR].","treks":[{"nombre":"Sjónarnípa loop (Austurbrekkur–Svartifoss)","parking":"Parking Skaftafellsstofa (centro de visitantes) — tarifa de parking del PN [VERIFICAR, se paga en máquina/app].","datos":"~7-8 km circuito · +400 m aprox · ~4 h","qr":"t3"},{"nombre":"Múlagljúfur (SOLO SI CANCELAN BLUE ICE)","parking":"Desvío de ripio SIN CARTEL al norte de la Rte 1, entre Fjallsárlón y Jökulsárlón (coord. entrada ~63°59'N 16°24'W) — pozos en el ripio: despacio con el motorhome.","datos":"~6,2 km i/v · +315 m · 2-3 h · cañón + Hangandifoss (120 m) · con barro/lluvia NO","qr":"t11"}],"seguridad":"JAMÁS pisar un glaciar sin guía (hoy lo pisan CON guía, equipados — esa es la manera). En Diamond Beach aplican las mismas olas traicioneras que Reynisfjara: no darle la espalda al mar ni subirse a hielos varados. Manejo nocturno de vuelta a Höfn: renos NO (eso es el este), pero sí ovejas sueltas — luces altas y calma. Glacier hike = aventura › Heymondo con aviso previo.","planb":"<b>Mal clima en la cumbre del loop:<\/b> hacer solo Svartifoss (2 km i/v) + el glacier hike (los tours salen casi con todo clima). <b>Si cancelan el glacier hike:<\/b> el sustituto oficial es MÚLAGLJÚFUR (ver tabla de treks): el cañón escondido entre Fjallsárlón y Jökulsárlón, 2-3 h con la vista de Hangandifoss — solo con día seco (el sendero con barro es jabón) y cruce de arroyo con piedras. Alternativa suave: loop completo con calma + Jökulsárlón más temprano y opción Fjallsárlón. <b>Regla doble-cancelación:<\/b> si además el atardecer pinta tapado, Jökulsárlón se disfruta igual de día — no esperar al sunset."},{"n":8,"fecha":"Miércoles 16 de septiembre","titulo":"Stokksnes al amanecer · Fiordos del Este","zona":"Höfn › Stokksnes › Djúpivogur › Stöðvarfjörður › Fáskrúðsfjörður","km":"235 km","cond":"~3 h (costera con curvas)","luz":"06:24 / 19:24 (civil 05:35–20:13, Stokksnes/fiordos) — Stokksnes: amanecer local 06:24","intensidad":"Media","aurora":"PRIMERA VENTANA REAL","crono":[["06:00","Salida a oscuras. Rte 1 este 15 min + desvío al faro.",1],["06:25","AMANECER EN STOKKSNES: el Vestrahorn saliendo del mar con la playa negra de espejo. Acceso privado: 2.500 ISK/auto, se paga en el Viking Café (máquina/QR).",1],["08:30","Café + desayuno segundo en el Viking Café o el motorhome. Duna de pasto + restos del \"viking village\" de cine.",0],["09:30","Rte 1 este: empiezan los fiordos — Álftafjörður, Hamarsfjörður. Renos posibles al costado (primera zona del viaje).",0],["12:00","DJÚPIVOGUR: almuerzo. Pueblo pesquero tranquilo, los huevos gigantes de piedra (Eggin í Gleðivík).",0],["14:00","Rte 1 hacia el norte y Rte 96 costera vía Stöðvarfjörður hasta Fáskrúðsfjörður (~55 km más que el plan viejo). Tarde CORTA a propósito: recuperar sueño.",0],["16:00","CampEast Fáskrúðsfjörður (temporada verificada hasta el 20/9). Se paga en recepción o en el buzón. Caminata suave por el pueblo francés: las calles tienen nombre en islandés y en francés.",0],["21:30","PRIMERA GUARDIA DE AURORAS: chequear KP + nubes (en.vedur.is/weather/forecasts/aurora). El fiordo oscuro es un spot excelente.",1]],"ruta":"<b>Höfn › Stokksnes (15 min):<\/b> Rte 1 este + camino del faro (ripio corto, OK). <b> ›  Djúpivogur (1 h 30):<\/b> Rte 1 abraza la costa; el tramo Álftafjörður es de los más lindos del país. OJO: hay un sector de ripio en la Rte 1 cerca de Hvalnes/Þvottárskriður [VERIFICAR estado] — bajar velocidad, piedra suelta. <b>Djúpivogur › Breiðdalsvík (50 min):<\/b> Rte 1 dobla tierra adentro por Berufjörður; alternativa costera Rte 96 más larga. Túnel o paso según obras [VERIFICAR road.is].","pueblos":"<b>Djúpivogur (~470 hab):<\/b> súper chico tipo Kjörbúðin/Samkaup [VERIFICAR], gasolinera, café Langabúð (histórico, tortas). <b>Breiðdalsvík (~140 hab):<\/b> mini-mercado [VERIFICAR horario], gasolinera automática, hotel con restaurant. Si el camping está cerrado, Stöðvarfjörður (20 min más) tiene camping alternativo [VERIFICAR] y la famosa colección de piedras de Petra (cierra ~sept [VERIFICAR]).","camping":"<b>CampEast Fáskrúðsfjörður<\/b> (Óseyri) — <b>CAMBIO v16:<\/b> Breiðdalsvík está CERRADO (temporada 29/5 al 3/9, verificado en parka.is el 5/9) y Stöðvarfjörður, el plan B viejo, también. Fáskrúðsfjörður abre del 10/5 al 20/9: cubre esta noche con 4 días de margen. 2.500/adulto + 400 tasa + 1.500 electricidad = <b>6.900 los 2<\/b>. Duchas calientes, electricidad, vaciado de aguas de motorhome. <b>No toma reservas:<\/b> se llega, se elige lugar y se paga en recepción o dejando el efectivo en el buzón. Suma ~55 km por la Rte 96 vía Stöðvarfjörður y deja Egilsstaðir a ~50 km. <b>Plan B:<\/b> Djúpivogur (parka.is, abierto todo el año, sobre la ruta).","treks":[],"seguridad":"Salida nocturna 06:00: ovejas y (desde hoy) RENOS en la ruta — el mayor riesgo animal del este. Luces altas, 80 km/h reales. Stokksnes con viento: la arena vuela y pica — proteger lentes de cámara. Curvas de fiordo sin banquina: no frenar en la calzada para fotos; usar los pull-outs.","planb":"<b>Si Stokksnes amanece con niebla cerrada:<\/b> saltarlo (está en la matriz de recorte), dormir 1 h más y arrancar 08:00 directo a los fiordos. <b>Si el día está gris entero:<\/b> más tiempo en Djúpivogur/Petra y llegada temprana — hoy es día de transición, no de forzar. <b>Si CampEast Fáskrúðsfjörður cerró antes de tiempo:<\/b> Djúpivogur (abierto todo el año, sobre la ruta, 30 min atrás) o seguir a Egilsstaðir."},{"n":9,"fecha":"Jueves 17 de septiembre","titulo":"Seyðisfjörður · Hengifoss (día corto a propósito)","zona":"Fáskrúðsfjörður › Egilsstaðir › Seyðisfjörður › Hengifoss › Egilsstaðir","km":"175 km","cond":"~3 h","luz":"06:24 / 19:19 (civil 05:33–20:10, Egilsstaðir)","intensidad":"Media","aurora":"Ventana activa","crono":[["08:00","Salida (una hora más tarde que en la v16: hoy sobra tiempo). Rte 96/92 + Rte 1 a Egilsstaðir (45 min).",0],["08:45","Rte 93: subida al paso de Fjarðarheiði (601 m) y bajada de película a Seyðisfjörður.",0],["09:15","SEYÐISFJÖRÐUR (1h30, sin apuro): la calle arcoíris a la iglesia celeste, casas noruegas de madera, café.",0],["11:00","Vuelta por Rte 93 › Egilsstaðir › Rte 931/933 por el lago Lagarfljót.",0],["12:15","HENGIFOSS + LITLANESFOSS (5 km i/v, 2–2h30): primero las columnas de basalto de Litlanesfoss, arriba la pared a rayas rojas de Hengifoss (118 m).",1],["15:00","Almuerzo. Vuelta a Egilsstaðir sin prisa.",0],["16:00","Camp Egilsstaðir. NOCHE DE LAVANDERÍA: 9 lavarropas y 9 secarropas 24/7. Reponer en Bónus/Nettó/Krónan — mañana son 130 km sin nada.",1],["17:30","Comodín si el día rindió: VÖK BATHS (10.500 ISK/pp, NO presupuestado) o piscina municipal de Egilsstaðir (~1.200 ISK).",0],["21:30","Guardia de auroras nº 2. Egilsstaðir tiene poca luz urbana hacia el lago. TOPE 30–40 min: mañana se sale 07:00.",1]],"ruta":"<b>CAMBIO v17: Stuðlagil pasa a la mañana del D10.<\/b> Estaba a 70 km al oeste de Egilsstaðir, es decir SOBRE la ruta del D10 hacia Mývatn: hacerlo hoy obligaba a recorrer ese tramo dos veces (~140 km de ida y vuelta pura). Movido al D10 es un desvío de ~60 km. Se ahorran ~80 km y ~1h20, y el día más cargado del este se descomprime. <b>Fáskrúðsfjörður › Egilsstaðir (45 min):<\/b> Rte 96/92 con túnel. <b>Rte 93 (25 min por lado):<\/b> asfaltada y espectacular, pero es paso de montaña: niebla frecuente arriba y curvas de bajada con motorhome en 3ª. <b>Rte 931/933 a Hengifoss (30 min):<\/b> bordea el Lagarfljót; el parking está sobre la 933 pasando el puente, gratuito [VERIFICAR].","pueblos":"<b>Egilsstaðir (~2.600 hab):<\/b> el hub del este — Bónus, Nettó y Krónan, farmacias, N1/Orkan/Olís, piscina municipal. <b>Seyðisfjörður (~700 hab):<\/b> panadería/cafés lindos (El Grillo brewpub, Norð Austur sushi — caro pero famoso), súper chico. Comer barato en Egilsstaðir: Söluskálinn/grills de estación; trampa: nada grave en esta zona.","camping":"<b>Camp Egilsstaðir (Kaupvangur 17)<\/b> — <b>RESERVADO Y PAGADO<\/b> (factura RKN-2026-01-220075, 6.300 ISK con Visa: 2 adultos × 2.950 + tasa 400). <b>Se pagó SIN electricidad<\/b> — es la más cara del viaje (2.000) y se llega con la batería cargada de 275 km. Abierto todo el año, instalaciones 24/7. <b>Lavandería con 9 lavarropas y 9 secarropas abiertos 24/7<\/b> (tarjeta o efectivo): junto con Skaftafell, es LA noche del viaje para lavar todo. Duchas, cocina y Wi-Fi incluidos. En temporada baja se elige lugar libre en las zonas A/B/C/D/E/P. <b>Se reserva en reisa.is, no en parka.is.<\/b>","treks":[{"nombre":"Hengifoss + Litlanesfoss","parking":"Parking Hengifoss (Rte 933, tras el puente desde la 931) — gratuito [VERIFICAR].","datos":"5 km i/v · +320 m aprox · 2–2h30","qr":"t4"}],"seguridad":"Día deliberadamente corto: es el colchón entre el bloque físico del sur y los dos días largos del norte. Rte 93: niebla arriba del paso, chequear road.is antes de subir. Hengifoss con lluvia: los últimos metros son de barro resbaladizo, no acercarse al filo del mirador. Aprovechar para lavar TODO y dormir 8 horas.","planb":"<b>Lluvia fuerte:<\/b> cae Hengifoss (queda Seyðisfjörður + lavandería + Vök Baths como refugio termal). <b>Nieve temprana en Fjarðarheiði:<\/b> cae Seyðisfjörður, se hace Hengifoss con calma. Con el día corto de la v17 hay margen real para las dos cosas incluso si la mañana se pierde."},{"n":10,"fecha":"Viernes 18 de septiembre","titulo":"Stuðlagil · Dettifoss · Krafla/Leirhnjúkur · Earth Lagoon","zona":"Egilsstaðir › Stuðlagil › Dettifoss › Krafla › Mývatn","km":"300 km","cond":"~5 h","luz":"06:33 / 19:22 (civil 05:42–20:13, Jökuldalur/Mývatn) — Earth Lagoon 18:00: el sol se pone estando adentro","intensidad":"Alta","aurora":"Ventana activa — Mývatn es spot top","crono":[["07:00","SALIDA (una hora antes que en la v16 — es lo que paga a Stuðlagil). Sale con el amanecer (06:33). Rte 1 oeste por Jökuldalsheiði: tramo desolado, POCA COBERTURA, tanque lleno desde Egilsstaðir.",1],["07:45","Desvío por Rte 923 (Jökuldalsvegur) — sale de la Rte 1 unos 40 km al oeste de Egilsstaðir. Son ~30 km más, buena parte RIPIO: con el motorhome, ~35 min por lado.",0],["08:20","STUÐLAGIL, mirador OESTE (parking de Grjótgarðsháls): plataforma sobre el cañón de columnas de basalto. 30 min. NO da acceso al lecho del río — eso es el lado este, que en la v17 queda descartado por tiempo.",1],["09:00","Vuelta a la Rte 1 oeste. Costo total del desvío: ~1h40.",0],["10:40","Desvío Rte 862 (ASFALTADA, ~25 km) al norte: DETTIFOSS — la cascada más potente de Europa — + SELFOSS río arriba (1h30 total, pasarelas). Parking grande con baños.",1],["12:40","Vuelta a Rte 1 oeste. Almuerzo en ruta o en el parking de Krafla.",0],["13:45","LEIRHNJÚKUR loop (7 km, 2,5–3 h): campos de lava de los Fuegos de Krafla (1975-84), fumarolas, tierra multicolor. Senderos marcados, zona geotermal VIVA.",1],["16:45","HVERIR (30 min): el \"Marte islandés\" — ollas de barro hirviendo y fumarolas bajo el Námafjall.",0],["17:20","DIMMUBORGIR RECORTADO (v17): ida y vuelta directa al arco de KIRKJAN, ~35 min. NO el loop Kirkjuhringur completo — ese es el minuto que se le prestó a Stuðlagil.",0],["18:00","EARTH LAGOON (ex Mývatn Nature Baths / Jarðböðin) — PAGADO. Es entrada por franja, no un tour: llegar 20 min tarde cuesta tiempo de baño, no la reserva. El sol se pone 19:22 estando adentro.",1],["20:00","Vogar Travel Service (5 min de Reykjahlíð). Pagar con el QR de la entrada y pedir el código de North Sailing. Cena en la cocina interior climatizada.",0],["22:00","Guardia de auroras nº 3 — Mývatn con cielo limpio es de los mejores lugares del país. TOPE 30–40 min: mañana se despierta 05:00.",1]],"ruta":"<b>NOVEDAD v17: Stuðlagil se hace hoy, no ayer.<\/b> <b>Egilsstaðir › Rte 923 (45 min):<\/b> Rte 1 sube a ~600 m por el páramo de Jökuldalsheiði: viento y nevadas tempranas posibles [road.is antes de salir]. La 923 sale al sur de la Rte 1 y son ~30 km hasta el parking oeste, ripio mantenido en buena parte — apto sin 4x4 con calma; con lluvia fuerte se pone barrosa. <b>Rte 862 (20 min por lado):<\/b> ASFALTADA hasta el parking oeste de Dettifoss; sin servicio invernal solo de enero a principios de abril, así que en septiembre está holgadamente abierta. La 864 (lado este) es ripio y NO va con este plan. <b>Rte 1 › desvío Krafla (40 min):<\/b> asfaltado, pasa entre las tuberías de la planta geotérmica. <b>Krafla › Hverir (10 min) › Dimmuborgir (10 min) › Earth Lagoon (10 min) › Vogar (10 min).<\/b>","pueblos":"<b>Reykjahlíð (Mývatn, ~300 hab):<\/b> súper Samkaup Strax CHICO Y CARO — por eso se repone en Egilsstaðir; N1; panadería geotermal: el pan de centeno cocido bajo tierra (probar el rúgbrauð en Earth Lagoon o cafés locales). Comer: Daddi's Pizza o Gamli Bærinn; trampa: cualquier cosa \"geothermal experience\" con precio premium.","camping":"<b>Vogar Travel Service<\/b> (Vogum, 5 min de Reykjahlíð) — <b>CAMBIO v16:<\/b> Bjarg tiene temporada 15/6 al 1/9 según ferdalag.is, no permite vaciar químico ni aguas grises por la cercanía al lago y tiene pocos enchufes. Vogar abre <b>todo el año<\/b>: 2.450/adulto + 1.600 la unidad motorhome <b>con electricidad incluida<\/b> + 400 tasa = <b>6.900 los 2<\/b>. Cocina-comedor interior climatizada, duchas calientes incluidas, Wi-Fi, estación de aguas negras, tienda de honestidad 24/7. <b>El sendero al Hverfjall y a Grjótagjá arranca al lado<\/b> — es la primera actividad de mañana. <b>No toma reservas: se paga escaneando el QR de la entrada.<\/b> Beneficios para huéspedes: 15 % en Daddi's Pizza (al lado) y <b>10 % en North Sailing con su código promocional<\/b> — pedirlo al pagar. <b>Plan B:<\/b> Bjarg o Hlíð, en Reykjahlíð.","treks":[{"nombre":"Stuðlagil — mirador OESTE","parking":"Parking de Grjótgarðsháls, sobre la Rte 923 (~30 km desde la Rte 1). Gratuito.","datos":"Caminata mínima hasta la plataforma · 30 min · sin desnivel","qr":"t5"},{"nombre":"Leirhnjúkur / Krafla","parking":"Parking de Leirhnjúkur (desvío asfaltado de Krafla).","datos":"7 km circular · 2,5–3 h · terreno geotermal vivo","qr":"t6"},{"nombre":"Dimmuborgir — arco de Kirkjan (RECORTADO v17)","parking":"Parking de Dimmuborgir.","datos":"Ida y vuelta directa al arco · ~35 min · NO el loop Kirkjuhringur","qr":"t7"}],"seguridad":"Rte 923 de ripio con el motorhome: velocidad baja, sin frenadas bruscas, ojo con el polvo de los que vienen de frente. En el mirador oeste de Stuðlagil hay baranda: el basalto mojado es jabón, no salirse. Suelo geotermal en Leirhnjúkur y Hverir: pasarelas y marcas SIEMPRE, la costra fina esconde barro a 100 °C. Páramo de Jökuldalsheiði sin señal: mandar el plan del día antes de salir de Egilsstaðir. Hoy es el día con más volante del norte: parar cada 1h30.","planb":"<b>Si el día se atrasa, lo que se suelta es STUÐLAGIL, no Dimmuborgir<\/b> — el agua del Jökla en septiembre suele venir gris-marrón porque el embalse de Hálslón (Kárahnjúkar) desborda desde principios de agosto y arrastra sedimento: las columnas están siempre, el color de postal es lotería. <b>Rte 862 cerrada (muy improbable en septiembre):<\/b> saltar Dettifoss y darle más tiempo a Krafla y Mývatn — NO ir por la 864, que es ripio y está fuera del contrato. <b>Vogar lleno:<\/b> Camping Hlíð en Reykjahlíð (abierto todo el año) o Bjarg si sigue abierto."},{"n":11,"fecha":"Sábado 19 de septiembre","titulo":"Hverfjall al amanecer · Ballenas en Húsavík · Goðafoss · Akureyri","zona":"Mývatn › Húsavík › Goðafoss › Akureyri","km":"200 km","cond":"~3 h 15","luz":"06:40 / 19:22 (civil 05:48–20:13, Mývatn/Húsavík) — Hverfjall: amanecer 06:40","intensidad":"Alta (arranque 05:30)","aurora":"Ventana activa","crono":[["05:30","Despertar. Manejo corto a oscuras al parking norte de Hverfjall (acceso de ripio corto [VERIFICAR]).",0],["05:50–07:00","HVERFJALL: subida 15-20 min al borde del cráter de toba (1 km de diámetro) y AMANECER (06:42) con el lago Mývatn de fondo. Vuelta al motorhome.",1],["07:45","Salida a Húsavík por Rte 87 (50 min, paso suave).",1],["08:35","Llegada Húsavík. Desayuno con calma en el puerto.",0],["09:30","CHECK-IN North Sailing — Hafnarstétt 9, FRENTE A LA IGLESIA de madera. Reserva NOS-90813087 / ticket NOS-T129609121: figura \"awaiting payment\" y ES NORMAL — SE PAGA ALLÁ (27.980 ISK).",1],["10:00–13:00","AVISTAJE DE BALLENAS en velero de roble (jorobadas casi seguras a fin de temporada; overol térmico incluido).",1],["13:15","Almuerzo en el puerto: fish & chips o sopa de pescado.",0],["14:30","Rte 85/845 sur hacia la Ring Road (50 min).",0],["15:30","GOÐAFOSS (30 min): la \"cascada de los dioses\" — herradura perfecta, miradores por ambas márgenes.",1],["16:30","Rte 1 oeste a Akureyri (35 min). Bónus/Nettó para reponer.",0],["17:30","PISCINA SUNDLAUG AKUREYRI: hot pots + toboganes — el templo del norte (~1.900 ISK/pp aprox [VERIFICAR]).",0],["19:30","Camping Hamrar. Cena. Auroras: alejarse de las luces del camping hacia el bosque si hay KP.",0]],"ruta":"<b>Mývatn › Húsavík (50 min):<\/b> Rte 87, paso de montaña suave asfaltado [VERIFICAR estado matinal]. <b>Húsavík › Goðafoss (50 min):<\/b> Rte 85 sur + Rte 845 hasta empalmar la Rte 1 justo en Goðafoss (parking en ambas márgenes; el del este tiene café). <b>Goðafoss › Akureyri (35 min):<\/b> Rte 1 oeste bordeando el Eyjafjörður; entrada a la ciudad por el puente del fiordo. Akureyri: los semáforos tienen CORAZONES rojos — no es alucinación.","pueblos":"<b>Húsavík (~2.300 hab):<\/b> capital ballenera de Europa; súper Nettó/Krónan [VERIFICAR cuál opera], panadería Heimabakarí, Museo de la Ballena (plan B oficial), piscina con vista y GeoSea (baños de agua de mar, plan B). <b>Akureyri (~19.000 hab):<\/b> la \"capital del norte\" — Bónus, Nettó, Krónan, farmacias grandes, todo. Comer: Berlín (brunch), Bautinn; trampa: restoranes del muelle de cruceros con precios inflados.","camping":"<b>Camping Hamrar<\/b> — en el bosque de Kjarnaskógur, 5 min al sur del centro. Amplio, arbolado (raro en Islandia), servicios completos. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Abierto todo el año [VERIFICAR].","treks":[{"nombre":"Hverfjall — borde del cráter","parking":"Parking NORTE de Hverfjall (acceso ripio corto desde la zona del lago) — gratuito [VERIFICAR].","datos":"~3-4 km i/v con vuelta parcial al borde · +90 m · 1 h–1 h 15","qr":"t8"}],"seguridad":"Hverfjall a oscuras: frontales, sendero norte marcado — PROHIBIDO bajar por la ladera (erosión); mismo camino de vuelta. En el barco: overol que dan, gorro propio, pastilla de mareo 30 min antes si son sensibles (el swell de sept existe). Rte 87 al alba: hielo posible en el paso a fin de septiembre — puentes y sombras primero.","planb":"<b>Si cancelan la navegación por mar grueso<\/b> (deciden ellos): Museo de la Ballena + GeoSea (5.500 ISK/pp aprox) — plan B oficial; reintento imposible (el resto del viaje va al oeste). El pago allá significa que NO se pierde plata si cancelan ellos. <b>Si el amanecer está tapado:<\/b> Hverfjall se salta (matriz #9) y se duerme hasta 07:00 — el check-in 09:30 es lo intocable."},{"n":12,"fecha":"Domingo 20 de septiembre","titulo":"Travesía del noroeste (día de ~370 km) · Kolugljúfur · Noche clave de auroras","zona":"Akureyri › Blönduós › (Kolugljúfur) › Borgarnes › Eldborg (Rte 54)","km":"370 km","cond":"~5 h 30–6 h","luz":"06:54 / 19:28 (civil 06:04–20:17, Norte/Oeste)","intensidad":"Media (volante)","aurora":"NOCHE CLAVE — Eldborg / Snæfellsnes","crono":[["07:30","Desayuno. Chequeo OBLIGATORIO: vedur.is (viento en Öxnadalsheiði) + road.is. Con alerta amarilla de viento, replantear salida.",1],["08:00","Salida. Rte 1 oeste: paso de Öxnadalsheiði (540 m) — el tramo más alpino de la Ring Road del norte.",1],["09:30","Varmahlíð (parada técnica). Punto de decisión nº 1: si el clima está feo, acá se puede cortar el día (camping local).",0],["10:30","BLÖNDUÓS: café + estirar. Punto de gasolina N1.",0],["11:15","KOLUGLJÚFUR (CAMBIO v17: reemplaza a Hvítserkur). Desvío por Rte 715 \"Víðidalsvegur\" al SUR de la Rte 1, poco después de Laugarbakki: ~5-6 km de ripio apto 2WD hasta el estacionamiento junto al puente. Cañón de 1 km y 40-50 m de profundidad con las cascadas Kolufossar. 40-50 min puerta a puerta contra la hora que costaba Hvítserkur, y rinde mucho más.",1],["13:00","Almuerzo en ruta. Rte 1 sur por Hrútafjörður.",0],["13:45","STAÐARSKÁLI: la parada de ruta más famosa de Islandia (N1) — combustible + soft ice de rigor.",0],["14:45","OPCIONAL MUY RECOMENDADO — GRÁBRÓK: cráter con escalera de madera JUSTO sobre la Rte 1 (junto a Bifröst). 15-30 min de subida por escalones, vuelta completa al borde con vista 360° a los campos de lava. Parking gratis. Es EL estirar-piernas con premio del día largo (30-45 min total).",0],["15:45","Paso por BORGARNES (Bónus/Nettó, nafta, Geirabakarí) y 38 km más por la Rte 54 hasta Eldborg en Snorrastaðir. Check-in (sin reserva; +354 776 2216). Sala común 08:00–22:00 con 2 hornallas, microondas y Wi-Fi; duchas CON CARGO; no dan ollas ni vajilla.",0],["19:00","Cena. Preparar equipo de auroras: trípode, batería de repuesto EN EL BOLSILLO (el frío las mata), termo.",0],["21:30–01:00","NOCHE CLAVE DE AURORAS: Eldborg está en medio de un campo de lava con horizonte abierto y sin luces de pueblo (costanera oeste o el puente viejo).",1]],"ruta":"<b>Akureyri › Öxnadalsheiði › Varmahlíð › Blönduós (2 h, ~145 km):<\/b> Rte 1 por el paso de Öxnadalsheiði (540 m) — viento canalizado y primeras nieves posibles; alerta naranja en vedur = parar. <b>Desvío Rte 715 a Kolugljúfur (~12 km i/v):<\/b> TRAMPA DE GPS — la 715 es un loop que vuelve a la Rte 1, así que el navegador puede meterlos por el extremo equivocado y son 10 km en vez de 5. MARCAR EL PUNTO EXACTO OFFLINE antes de salir. Parking libre a ambos lados de un PUENTE DE UN SOLO CARRIL, 15-20 autos: estacionar del lado por el que se llega y cruzar caminando; no meter 7 m de motorhome en el puente. <b>Blönduós › Staðarskáli › Borgarnes › Eldborg (~225 km, 3 h 30):<\/b> Rte 1 sur por Hrútafjörður y Rte 54 los últimos 38 km. DÍA DE MÁS KM DEL VIAJE: parar cada 1 h 30.","pueblos":"<b>Blönduós (~950 hab):<\/b> súper Kjörbúðin/Samkaup [VERIFICAR], N1, panadería. <b>Borgarnes (~2.100 hab):<\/b> Bónus y Nettó, N1/Orkan, piscina municipal muy buena, Settlement Center (museo + restaurant sólido). Geirabakarí: panadería con la mejor vista de Islandia (salió en \"Walter Mitty\"). Trampa: ninguna seria; Borgarnes es pueblo de paso honesto.","camping":"<b>Eldborg Campsite at Snorrastaðir<\/b> (Rte 54, 38 km al oeste de Borgarnes) — <b>CAMBIO v16:<\/b> el camping de Borgarnes (Granastaðir) cierra a mediados de septiembre, así que el 20/9 queda afuera. Eldborg abre <b>todo el año<\/b>, está sobre la ruta natural hacia Snæfellsnes: 2.200/adulto + 400 tasa + 1.200 electricidad = <b>6.000 los 2<\/b>. Sala común con Wi-Fi, 2 hornallas, microondas, pava y tostadora (08:00–22:00); baños y piletas exteriores 24 h; <b>duchas con cargo<\/b>; no proveen ollas ni vajilla. <b>Campo de lava con horizonte abierto: mejor spot de auroras que un camping urbano.<\/b> El D12 suma 38 km pero el D13 baja a ~132. Sin reserva online: <b>+354 776 2216<\/b>. El sendero al cráter de Eldborg arranca cerca.","treks":[{"nombre":"Grábrók — borde del cráter (OPCIONAL)","parking":"Parking Grábrók, sobre la Rte 1 junto a Bifröst — gratuito, señalizado.","datos":"~1,4 km circuito · +55-90 m (escalera de madera) · 30-45 min con vuelta al borde","qr":"t10"}],"seguridad":"KOLUGLJÚFUR: hay DOS PLATAFORMAS DE OBSERVACIÓN y están puestas por algo — el sitio figura entre los diez lugares turísticos más peligrosos del país por los bordes resbaladizos sin baranda y la fuerza de la corriente, y ha habido accidentes. QUEDARSE SOBRE LAS PLATAFORMAS. Terreno con barro y suelo blando: calzado con agarre. El resto del día es manejo: Öxnadalsheiði con viento cruzado, no abrir las puertas del camper a favor del viento (arranca bisagras), y con >20 m/s no se maneja. Café en termo y snacks pre-comprados: los tramos entre pueblos son largos.","planb":"<b>Clima muy malo:<\/b> cortar en Varmahlíð (mitad de camino, camping y N1 grande) y ajustar el D13, que en la v16 bajó a 132 km y tiene aire. <b>NO contar con Camping Borgarnes: cierra a mediados de septiembre.<\/b> Si Eldborg fallara (abre todo el año, riesgo bajo), seguir a Snæfellsnes y dormir en Arnarstapi una noche antes, o Grundarfjörður. <b>Ripio de la 715 embarrado:<\/b> Kolugljúfur se suelta sin drama, es un extra."},{"n":13,"fecha":"Lunes 21 de septiembre","titulo":"Snæfellsnes: Kirkjufell · Vatnshellir · Djúpalónssandur · Arnarstapi","zona":"Eldborg › Grundarfjörður › punta de Snæfellsnes › Arnarstapi","km":"132 km","cond":"~3 h","luz":"07:13 / 19:40 (civil 06:23–20:29, Snæfellsnes)","intensidad":"Media-alta","aurora":"Ventana activa","crono":[["09:00","Salida DESDE ELDBORG (no Borgarnes: se durmió 38 km más al oeste). Rte 54 noroeste hacia la península (\"Islandia en miniatura\").",1],["11:00–11:45","KIRKJUFELL + Kirkjufellsfoss: LA montaña más fotografiada del país. Composición clásica: cascada en primer plano, montaña-flecha detrás. Parking pago [VERIFICAR].",1],["12:00","Rte 54 oeste + costa norte › cruce a la cara sur.",0],["12:45","ALMUERZO EN HELLNAR: Fjöruhúsið — la sopa de pescado con vista a la caleta que justifica el viaje (efectivo/tarjeta [VERIFICAR], cierra temporada fin de sept [VERIFICAR]).",1],["13:50","Llegar al parking de VATNSHELLIR (10 min desde Hellnar).",1],["14:00–15:00","TOUR VATNSHELLIR (VHE-T129532012, operador Gufuskálar): tubo de lava de 8.000 años, 35 m bajo tierra, escaleras caracol. Abrigo: adentro hay 3-5 °C fijos.",1],["15:15","DJÚPALÓNSSANDUR (30 min): playa negra de guijarros, restos del naufragio del Epine (NO llevarse ni un fierrito), las 4 piedras de fuerza de los pescadores.",0],["16:30","ARNARSTAPI: paseo corto por los acantilados (Gatklettur, el arco) + el monumento a Bárður. El hike completo a Hellnar es MAÑANA a la mañana.",0],["19:40","Atardecer desde los acantilados. Cena. Auroras: la punta de la península es oscuridad pura.",0]],"ruta":"<b>Borgarnes › Grundarfjörður (1 h 45):<\/b> Rte 54 — primero llanura de Mýrar, después la costa norte con el fiordo Breiðafjörður y sus mil islas. Tramos de la 54 en la costa norte tienen sectores de ripio en obras [VERIFICAR road.is]. <b>Grundarfjörður › cara sur (45 min):<\/b> seguir la 54 al oeste y luego Rte 574 rodeando el glaciar-volcán Snæfellsjökull (el de Verne). <b>Hellnar › Vatnshellir (10 min) › Djúpalónssandur (10 min) › Arnarstapi (20 min):<\/b> todo sobre la 574.","pueblos":"<b>Grundarfjörður (~900 hab):<\/b> súper Kjörbúðin [VERIFICAR], gasolinera, panadería/café Láki. <b>Ólafsvík:<\/b> súper y gasolinera — última recarga cómoda antes de la punta. <b>Arnarstapi (aldea):<\/b> restaurant Samkomuhúsið + food trucks en temporada [VERIFICAR si siguen], sin súper. Hellnar: solo el café Fjöruhúsið y el hotel. Llegar con la heladera cargada desde Borgarnes.","camping":"<b>Camping Arnarstapi<\/b> — al pie del Stapafell, dos casas de baños con duchas, lavado de vajilla, puesto de carga eléctrica y restaurante (Arnarbær) en el predio. 2.500/adulto + 400 tasa + 1.800 electricidad = <b>7.200 los 2<\/b>. <b>Electricidad SOLO en las zonas C y E.<\/b> <b>Temporada corregida v16: 20/5 al 10 de OCTUBRE<\/b> (el plan decía «cierra ~30/9»). Sin reserva online activada en Parka: <b>escribir a info@arnarstapicenter.is o llamar al +354 416 4466<\/b> — es el único camping del viaje que queda por gestionar. Expuesto al viento del mar. <b>Plan B:<\/b> Hellissandur u Ólafsvík (20–30 min). <b>v17:<\/b> temporada VERIFICADA 20/5 al 10/10 (parka.is), riesgo de cierre BAJO. Electricidad solo en las zonas C y E. Sin reserva online activada: escribir a info@arnarstapicenter.is o llamar al +354 416 4466.","treks":[],"seguridad":"Acantilados de Arnarstapi: el pasto llega hasta el borde y el borde es cornisa socavada — no acercarse al filo ni con viento calmo. Djúpalónssandur: mismas olas traicioneras del sur — 30 m de la orilla. Vatnshellir: escaleras metálicas mojadas, guantes recomendados (baranda helada). La 574 al oeste del glaciar es solitaria: tanque y teléfono cargados.","planb":"<b>Si llueve fuerte:<\/b> Kirkjufell funciona con drama gris; Vatnshellir es EL plan de lluvia (subterráneo); se recorta Djúpalónssandur (matriz #6). <b>Si el camping de Arnarstapi ya cerró:<\/b> Hellissandur/Ólafsvík y mañana se arranca desde allí (suma 25 min al D14 — recalcular salida a 07:45)."},{"n":14,"fecha":"Martes 22 de septiembre","titulo":"Arnarstapi–Hellnar · Sky Lagoon · cena de cierre","zona":"Arnarstapi › Reikiavik › Sky Lagoon › Keflavík (Hotel Berg)","km":"250 km","cond":"~4 h","luz":"07:16 / 19:37 (civil 06:27–20:26, Snæfellsnes/RVK)","intensidad":"Media","aurora":false,"crono":[["08:00–09:15","HIKE ARNARSTAPI–HELLNAR (5 km i/v por los acantilados): Gatklettur, colonias de aves, columnas de basalto, la costa masticada por el mar. Café en Hellnar si abre.",1],["09:20","Rutina de salida COMPLETA del motorhome en el camping: vaciar químico y grises, llenar agua, ordenar para la devolución de mañana.",1],["10:20","Salida por Rte 574 al este.",0],["10:30","RAUÐFELDSGJÁ (NUEVO v17): grieta estrecha en la pared de Botnsfjall, a 5 min de Arnarstapi sobre la propia Rte 574. Se entra caminando por el arroyo unos metros. 20-30 min, gratis, sin reserva. Calzado que se pueda mojar.",1],["11:05","Rte 574 este › Rte 54. OPCIONALES DE CERO COSTO si el reloj acompaña: BÚÐAKIRKJA (la iglesia negra, 5 min) y las columnas de GERÐUBERG — ambas a metros del asfalto.",0],["11:30","Salida real a Reikiavik: Rte 54 › Borgarnes › Rte 1 + túnel de Hvalfjörður (gratuito). 2 h 30.",0],["14:00","Reikiavik: almuerzo + SOUVENIRS (la ventana asignada del viaje): lana lopapeysa (Handknitting Association), sal de Saltverk, licorice, libros.",0],["15:45","PARADA TÉCNICA DE LA GARRAFA (NUEVO v17): canjear/recargar la garrafa de gas en un N1 u Olís ATENDIDO de Reikiavik o Kópavogur. NO se puede dejar para mañana: el D15 arranca 07:00 y las estaciones de Njarðvík son automáticas. Devolverla llena evita el cargo de 104 € de Touring Cars.",1],["16:30","Manejo a Kópavogur (15 min).",0],["17:00","SKY LAGOON (reserva 8052067): laguna infinita sobre el Atlántico + RITUAL de 7 pasos (hasta las 18:45). El sol se pone 19:37. Salida 20:00.",1],["20:30–22:15","CENA DE CIERRE: Grillmarkaðurinn (#9260784) — Lækjargata 2A, centro.",1],["22:15","Manejo final Rte 41 a Keflavík (45 min).",0],["23:00","HOTEL BERG (Bakkavegur 17, Keflavík — Booking 6554950906, $123 — PAGADO). CAMA DE VERDAD.",0]],"ruta":"<b>Arnarstapi › Borgarnes (1 h 30):<\/b> Rte 574 este + Rte 54. <b>Borgarnes › Reikiavik (1 h):<\/b> Rte 1 sur con el túnel submarino de Hvalfjörður (5,7 km — gratuito desde 2018). <b>Reikiavik › Sky Lagoon (15 min):<\/b> está en Kársnes, Kópavogur — seguir señalización \"Sky Lagoon\" [estacionamiento del predio]. <b>Sky Lagoon › centro (15 min) › Keflavík (45 min):<\/b> Rte 41. Con la cena terminando 22:15, se llega ~23:00 — manejo nocturno corto y conocido (es la ruta del D1 al revés).","pueblos":"<b>Reikiavik (cierre):<\/b> souvenirs con criterio — lana auténtica en Handknitting Association of Iceland (Skólavörðustígur); evitar las tiendas \"puffin shop\" de made-in-china. Bónus para snacks del vuelo. <b>Keflavík:<\/b> todo cerca del hotel; desayuno del D15 incluido en Hotel Berg [VERIFICAR horario de inicio — necesario 07:30].","camping":"<b>HOY NO HAY CAMPING: Hotel Berg<\/b> (Bakkavegur 17, Keflavík) — $123 PAGADO, Booking 6554950906. Ducha larga, cama, y a 5 min del drop-off de mañana. El motorhome duerme en el parking del hotel [VERIFICAR que haya sitio para su tamaño].","treks":[{"nombre":"Arnarstapi – Hellnar (costero)","parking":"Parking de Arnarstapi (junto al camping).","datos":"5 km i/v · llano · 1 h 15","qr":"t9"},{"nombre":"Rauðfeldsgjá (NUEVO v17)","parking":"Parking señalizado sobre la Rte 574, 5 min al este de Arnarstapi. Gratuito.","datos":"~600 m i/v desde el parking + entrada a la grieta · 20-30 min · se camina por el arroyo","qr":"t13"}],"seguridad":"RAUÐFELDSGJÁ: se entra por el lecho de un arroyo entre paredes verticales — piedras mojadas y resbaladizas, y con lluvia reciente el caudal sube; entrar solo hasta donde se pise firme, no hace falta llegar al fondo para que valga. PARADA TÉCNICA: la garrafa es el único ítem del D15 que no tiene plan B — si no se canjea hoy, son 104 € perdidos. VALORES: a partir de esta noche nada a la vista dentro del camper (el seguro cubre 500 € máx. adentro, y entre 22:00 y 06:00 solo en parking cerrado y vigilado). Último día largo de volante con cansancio acumulado: la cena termina 22:15 y quedan 45 min de Rte 41.","planb":"<b>Si hay cansancio real:<\/b> lo que cae es el hike Arnarstapi–Hellnar, NO Rauðfeldsgjá (20 min) ni la parada de la garrafa. Se llega antes a Reikiavik y sobra tarde. <b>Tormenta en Snæfellsnes:<\/b> salir directo a Reikiavik, más tiempo en Sky Lagoon y en el centro."},{"n":15,"fecha":"Miércoles 23 de septiembre","titulo":"Devolución y vuelo","zona":"Keflavík: Hotel Berg › Touring Cars › KEF","km":"5 km","cond":"~10 min","luz":"07:15 / 19:29 (civil 06:28–20:16, Keflavík)","intensidad":"Baja (pero con reloj)","aurora":false,"crono":[["07:00","Despertar. Desayuno del hotel 07:30 [VERIFICAR horario].",0],["08:00","Check-out + última revisada al motorhome: nada olvidado en gavetas/heladera/baño; basura fuera; fotos del estado final por dentro y por fuera. TANQUE LLENO en la automática de Njarðvík. La garrafa ya se canjeó ayer.",1],["08:30","DROP-OFF Touring Cars, Klettatröð 6 — HORARIO CONFIRMADO POR ESCRITO. Inspección conjunta 30–60 min: mostrar el video del D1 si discuten algo. Liquidar extras pendientes (garrafa de gas si no se recargó: 104 €/garrafa; química/linen ya contratados: 147 €).",1],["09:00–09:15","TRASLADO A LA TERMINAL — TAXI YA RESERVADO (v17). Klettatröð 6 › terminal KEF son ~3-5 km. Si TC ofrece su shuttle en el momento, se toma y se cancela el taxi. Check-in y equipaje.",1],["09:30–11:00","Seguridad + duty free (último skyr, chocolate Omnom, Brennivín si entra).",0],["11:30","DESPEGUE. Takk fyrir, Ísland.",1]],"ruta":"<b>Hotel Berg › Klettatröð 6 (5-8 min):<\/b> salir de Keflavík hacia Ásbrú. <b>ANTES del drop-off:<\/b> tanque LLENO — política full-to-full [VERIFICAR en contrato]; N1/Orkan de Njarðvík en el camino [VERIFICAR cuál abre antes de 08:30 — las automáticas con tarjeta funcionan 24 h]. <b>Gas:<\/b> si se pudo recargar la garrafa cerca de KEF (~8-10.000 ISK [VERIFICAR dónde]), entregarla llena; si no, se paga 104 €.","pueblos":"<b>Keflavík/Njarðvík:<\/b> gasolineras automáticas 24 h; panadería si sobra tiempo (no va a sobrar). En KEF: los precios del duty free de salida son de los pocos \"razonables\" del país para alcohol y dulces.","camping":"No aplica. La cadena de hoy: hotel (07:00) › tanque (08:10) › drop-off (08:30) › shuttle/taxi (09:15) › check-in (09:30) › vuelo (11:30). Cada eslabón tiene 15-30 min de colchón: no regalarlos.","treks":[],"seguridad":"El único riesgo de hoy es administrativo: la inspección. Armas: video del D1, fotos de hoy, y la carpeta de evidencia del seguro. Si aparece un cargo no esperado, pedir que lo detallen POR ESCRITO antes de firmar nada. Documentos a mano: pasaportes, reserva TC, vouchers, póliza Heymondo 2340350.","planb":"<b>Si la inspección se demora >60 min:<\/b> uno hace la inspección y el otro sale en taxi con las valijas al check-in. <b>Si el shuttle no aparece 09:15:<\/b> taxi sin dudar (son 3 km) — el vuelo no espera. <b>v17: el traslado a la terminal ya no es un riesgo abierto — el taxi está reservado.<\/b>"}],"trek_urls":{"t1":["https://es.wikiloc.com/rutas-senderismo/valle-geotermal-de-reykjadalur-15849754","https://www.alltrails.com/trail/iceland/southern/reykjadalur-hot-spring-thermal-river"],"t2":["https://www.wikiloc.com/hiking-trails/fimmvorduhals-skogar-to-thorsmork-basar-183159050","https://www.alltrails.com/trail/iceland/fimmvorduhals"],"t3":["https://es.wikiloc.com/rutas-senderismo/skaftafellsstofa-svartifoss-sjonarnipa-iceland-16713142","https://www.alltrails.com/trail/iceland/southern/sjonarnipa-svartifoss-magnusafoss-hundafoss-via-austurbrekkur"],"t4":["https://es.wikiloc.com/rutas-senderismo/cascadas-litlanesfoss-hengifoss-islandia-156549282","https://www.alltrails.com/trail/iceland/eastern/hengifoss-waterfall"],"t5":["https://es.wikiloc.com/rutas-senderismo/canon-de-studlagil-studlagil-canyon-185827199","https://www.alltrails.com/trail/iceland/eastern/studlagil-canyon--2"],"t6":["https://es.wikiloc.com/rutas-senderismo/leirhnjukur-volcan-krafla-reykjahlid-islandia-156527244","https://www.alltrails.com/trail/iceland/northeastern/leirhnjukur-lava-field"],"t7":["https://es.wikiloc.com/rutas-senderismo/dimmuborgir-islandia-156483795","https://www.alltrails.com/trail/iceland/northeastern/dimmuborgir-kirkjuhringur"],"t8":["https://es.wikiloc.com/rutas-senderismo/hverfjall-420-m-19659608","https://www.alltrails.com/trail/iceland/northeastern/hverfjall-volcano-crater"],"t9":["https://es.wikiloc.com/rutas-senderismo/islandia-arnastapi-a-hellnar-2018-26100153","https://www.alltrails.com/trail/iceland/western/arnarstapi-gatklettur-hellnar"],"t10":["https://www.wikiloc.com/hiking-trails/crater-grabrok-165826683","https://www.alltrails.com/trail/iceland/western/stora-grabrok-trail"],"t12":["","https://www.alltrails.com/trail/iceland/capital/mount-esja-steinn-thverfellshorn"]
