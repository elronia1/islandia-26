<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#E9EEF1; --sur:#FFFFFF; --sur2:#F3F6F8; --tx:#12202B; --mu:#4B5D6B; --ln:#CBD5DC;
  --ac:#0A6C9E; --ac-bg:#DCEBF4;
  --fix:#B3261E; --fix-bg:#FBE3E0;
  --saf:#8A5200; --saf-bg:#FFF0D2;
  --pb:#1E6B45; --pb-bg:#DFF1E6;
  --au:#127A57; --au-bg:#D4F0E4;
  --now:#0A6C9E;
  --sun:#F2B23A; --night:#2E4A5E;
}
[data-theme="noche"]{
  --bg:#0B1721; --sur:#14232E; --sur2:#1B2C39; --tx:#E7EEF3; --mu:#9DB0BE; --ln:#2A3C4A;
  --ac:#63B8EA; --ac-bg:#12303F;
  --fix:#FF7A6C; --fix-bg:#3A1B18;
  --saf:#F0B44C; --saf-bg:#3A2C10;
  --pb:#6ED0A0; --pb-bg:#12352A;
  --au:#3FD69B; --au-bg:#0F3628;
  --now:#63B8EA; --sun:#F2B23A; --night:#0B1721;
}
[data-theme="aurora"]{
  --bg:#070000; --sur:#150303; --sur2:#1E0505; --tx:#FF5A45; --mu:#B93E30; --ln:#3A0F0C;
  --ac:#FF5A45; --ac-bg:#2A0806;
  --fix:#FF7A6C; --fix-bg:#3A0F0C;
  --saf:#FF9A80; --saf-bg:#2A0806;
  --pb:#FF7A6C; --pb-bg:#2A0806;
  --au:#FF5A45; --au-bg:#2A0806;
  --now:#FF5A45; --sun:#FF5A45; --night:#150303;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Avenir Next",-apple-system,"Helvetica Neue",system-ui,sans-serif;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
a{color:var(--ac)}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--ln)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:1rem;letter-spacing:.01em}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:.8rem}
.tbtn{background:var(--sur);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;font-size:.9rem;font-weight:600;min-height:44px}
.tbtn:active{background:var(--sur2)}
.pill-off{display:none;font-size:.78rem;color:var(--mu);background:var(--sur2);border-radius:999px;padding:4px 10px}
body.offline .pill-off{display:inline-block}
/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;min-width:58px;min-height:56px;border-radius:14px;border:1px solid var(--ln);background:var(--sur);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;line-height:1.05}
.dchip small{font-weight:500;font-size:.72rem;color:var(--mu);margin-top:3px}
.dchip.sel{background:var(--ac);border-color:var(--ac);color:#fff}
.dchip.sel small{color:#fff;opacity:.85}
.dchip.hoy{box-shadow:inset 0 0 0 2px var(--au)}
.dchip.au{border-bottom:3px solid var(--au)}
/* layout */
main{padding:12px 14px;max-width:680px;margin:0 auto}
.view{display:none}.view.on{display:block}
h1{font-size:1.55rem;line-height:1.15;margin:.2rem 0 .3rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem;font-weight:700}
h3{font-size:1rem;margin:.6rem 0 .3rem;font-weight:700}
p{margin:.35rem 0}
.mu{color:var(--mu)}
.card{background:var(--sur);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.card.fix{border-left:5px solid var(--fix);background:var(--fix-bg)}
.card.saf{border-left:5px solid var(--saf);background:var(--saf-bg)}
.card.pb{border-left:5px solid var(--pb);background:var(--pb-bg)}
.card.ac{border-left:5px solid var(--ac);background:var(--ac-bg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--sur2);border:1px solid var(--ln);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600}
.chip.au{background:var(--au-bg);border-color:var(--au);color:var(--au)}
.chip.ext{background:var(--fix-bg);border-color:var(--fix);color:var(--fix)}
/* sun bar (firma) */
.sun{margin:12px 0 4px}
.sun .lbl{display:flex;justify-content:space-between;font-size:.85rem;font-weight:600}
.sun .bar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--night) 0 var(--r),var(--sun) var(--r) var(--s),var(--night) var(--s) 100%);margin:6px 0}
.sun .now{position:absolute;top:-5px;width:3px;height:24px;background:var(--now);border-radius:2px;left:var(--n);display:none}
.sun.today .now{display:block}
.sun .rest{font-size:.85rem;color:var(--mu)}
/* crono */
.crono{list-style:none;margin:0;padding:0}
.crono li{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);position:relative}
.crono li .t{font-weight:700;font-size:1rem;color:var(--mu);line-height:1.3}
.crono li.fix .t{color:var(--fix)}
.crono li.fix::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:5px;border-radius:3px;background:var(--fix)}
.crono li.past{opacity:.5}
.crono li.now{background:var(--ac-bg);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.crono li .x{font-size:.98rem}
/* details */
details{border:1px solid var(--ln);border-radius:16px;background:var(--sur);margin:10px 0;overflow:hidden}
details summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;font-size:1.08rem;display:flex;justify-content:space-between;align-items:center;min-height:52px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:1.4rem;color:var(--mu);font-weight:500}
details[open] summary::after{content:"–"}
details .body{padding:0 14px 14px;font-size:.98rem}
details.saf{border-left:5px solid var(--saf)} details.saf summary{color:var(--saf)}
details.pb{border-left:5px solid var(--pb)} details.pb summary{color:var(--pb)}
/* treks */
.trek{padding:12px 0;border-top:1px solid var(--ln)}
.trek:first-child{border-top:0}
.trek .n{font-weight:700;font-size:1.02rem}
.trek .d{color:var(--mu);font-size:.9rem;margin:2px 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:8px 16px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:700;text-decoration:none;font-size:.95rem}
.btn.o{background:transparent;color:var(--ac)}
.btn.big{width:100%;font-size:1.3rem;min-height:64px}
.btn.fix{background:var(--fix);border-color:var(--fix)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.85rem}
[data-theme="aurora"] .btn{color:#150303}
[data-theme="aurora"] .btn.o{color:var(--ac)}
textarea{width:100%;min-height:90px;border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;font-size:1rem;background:var(--sur2);color:var(--tx);resize:vertical}
/* reservas */
.rv .top-l{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rv .q{font-weight:700;font-size:1.05rem}
.rv .w{color:var(--mu);font-size:.9rem}
.st{font-size:.78rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.pagado{background:var(--pb-bg);color:var(--pb)} .st.alla{background:var(--saf-bg);color:var(--saf)}
.st.pendiente{background:var(--fix-bg);color:var(--fix)} .st.verificar{background:var(--sur2);color:var(--mu);border:1px solid var(--ln)}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:1rem;background:var(--sur2);border-radius:8px;padding:6px 10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;word-break:break-all}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:0 0 auto}.filters .chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
/* checks */
.ck{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.ck input{width:28px;height:28px;flex:0 0 28px;accent-color:var(--ac);margin:1px 0 0}
.ck.done span{text-decoration:line-through;color:var(--mu)}
.ck span{font-size:1rem}
.prog{font-size:.85rem;color:var(--mu);margin:-4px 0 6px}
/* matriz */
.mr{counter-reset:m}
.mr .it{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.mr .it .k{font-weight:700;font-size:1.3rem;color:var(--fix);line-height:1}
.mr .it .why{color:var(--mu);font-size:.9rem}
/* emergencia */
.tel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.tel .who{font-weight:600}.tel .who small{display:block;color:var(--mu);font-weight:500;font-size:.85rem}
/* links */
.lk{display:block;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--sur);margin:8px 0;text-decoration:none;color:var(--tx)}
.lk b{color:var(--ac)}.lk small{display:block;color:var(--mu)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--mu);min-height:56px;border-radius:12px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);background:var(--ac-bg)}
.banner{background:var(--au-bg);border:1px solid var(--au);color:var(--au);border-radius:12px;padding:10px 12px;font-weight:600;margin:0 0 10px}
.small{font-size:.85rem}
.right{margin-left:auto}
@media (prefers-reduced-motion:no-preference){details .body{animation:fd .15s ease-out}}
@keyframes fd{from{opacity:0}to{opacity:1}}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>

vío a Rte 43 sur (dirección Grindavík). Carretera ancha y asfaltada, ideal como primer tramo. <b>Ojo zona volcánica:<\/b> la península de Reykjanes viene con actividad volcánica intermitente desde 2021; el acceso a Blue Lagoon puede cambiar de ruta según el día. Chequear road.is y safetravel.is esa misma mañana. <b>Blue Lagoon › Reikiavik (~50 min):<\/b> Rte 43 norte + Rte 41 este. Tráfico real al entrar a la capital después de las 16:00.","pueblos":"<b>Reikiavik (base D1–D2):<\/b> súper — Bónus (el más barato, cierra ~18:30) y Krónan (horario más amplio); para olvidos nocturnos hay Hagkaup 24 h (caro) y 10-11 (muy caro, evitar). Piscina: Laugardalslaug está pegada al camping (la más grande del país). Farmacias (Lyfja/Lyf og heilsa) en el centro y en malls [VERIFICAR horarios]. Comer barato: Bæjarins Beztu (hot dogs, clásico) y food halls; trampa turística: restoranes de Laugavegur con menú en 6 idiomas y foto de ballena.","camping":"<b>Reykjavik Campsite (Laugardalur)<\/b> — abierto todo el año, al lado de Laugardalslaug. Servicios completos: electricidad, duchas, cocina común, lavandería, vaciado de químico/grises. ~2.000–3.000 ISK/pax + extra por electricidad [VERIFICAR en tjalda.is / web del camping]. No suele llenarse en septiembre, pero la reserva online da tranquilidad. <b>Alternativa:<\/b> camping Grindavík si el vuelo llega muy tarde o hay lío en la 41.","treks":[],"seguridad":"Primer día al volante de un vehículo grande, con jet lag: tramos cortos, sin apuro. Viento lateral en la Rte 41: dos manos al volante y OJO AL ABRIR PUERTAS (el viento las arranca — no lo cubre ningún seguro básico). Filmar el motorhome entero en el pickup: es tu evidencia ante Touring Cars al devolver.","planb":"<b>Si el vuelo se retrasa >3 h:<\/b> mover Blue Lagoon al día 14 (política de cambios de BL [VERIFICAR con la reserva]) y convertir D1 en: pickup › Bónus › camping y descanso. El itinerario ya prevé esta jugada."},{"n":2,"fecha":"Jueves 10 de septiembre","titulo":"Reikiavik a fondo (+ Esja muy opcional)","zona":"Reikiavik capital","km":"120 km (solo si se hace Esja; a pie si no)","cond":"0–1 h 30","luz":"~06:36 / 20:11 (aprox. interpolado)","intensidad":"Baja-media","aurora":false,"crono":[["08:30","Desayuno tranquilo. Chequeo de mails: total final Touring Cars (Elsa) y confirmación shuttle 23/9 — si no llegaron, reclamar hoy.",0],["09:30","Centro: Hallgrímskirkja (subir a la torre, vista 360°), bajar por Skólavörðustígur (la calle arcoíris), Laugavegur.",0],["12:30","ALMUERZO: SKÁL! en Hlemmur Mathöll — cocina islandesa moderna en food hall, buen valor. SIN RESERVA (no hace falta: es food hall, se pide en barra). Si está lleno o cerrado, alternativas a 5 min: Reykjavik Roasters (Kárastígur, café + tostadas), Brauð & Co (Frakkastígur, panadería — el cinnamon roll es el clásico), Sandholt (Laugavegur 36, panadería-café), o los otros puestos del propio Hlemmur.",0],["14:00","Harpa (entrar gratis, los paneles de vidrio valen la pena) + paseo por el puerto viejo. Opcional: Sun Voyager en la costanera.",0],["16:00","Piscina Laugardalslaug (hot pots) o Mt. Esja SOLO si sobra energía — el propio plan dice CONSIDERAR SALTARLO.",0],["19:00","CENA: Matur og Drykkur (reserva #9260773) — platos islandeses históricos reinterpretados.",1],["21:30","Vuelta al camping. Preparar mochilas del D3 (Reykjadalur: traje de baño + toalla).",0]],"ruta":"Día esencialmente A PIE: del camping al centro hay 30–40 min caminando o bus urbano Strætó (app Klappið) [VERIFICAR tarifa]. El motorhome queda estacionado en el camping — no meterlo al centro: calles angostas y estacionamiento tarifado por zonas. <b>Si se hace Esja:<\/b> Rte 1 norte ~25 min hasta el trailhead (Esjustofa). Sendero hasta la roca Steinn ~6-7 km i/v, empinado al final. Salió del plan por cansancio acumulado: solo con energía sobrante real.","pueblos":"Ver ficha D1 para súper/piscina/farmacia. Datos de hoy: los food halls (Hlemmur, Grandi Mathöll) son la mejor relación calidad-precio del centro; café bueno: Reykjavik Roasters. Souvenirs: dejarlos para el D14 (hay tiempo asignado).","camping":"<b>Reykjavik Campsite (Laugardalur)<\/b> — segunda noche, misma logística. Aprovechar lavandería si hace falta: la próxima ciudad con lavandería cómoda es Höfn (D7) o Akureyri (D11).","treks":[],"seguridad":"Día de riesgo bajo. Único punto: si se hace Esja, llevar capas y bastones — la parte alta es pedregosa y el clima cambia rápido incluso a 900 m. Propinas: no se dejan (ya incluidas). En las piscinas, ducha desnudo antes de entrar, sin traje: es regla, no sugerencia.","planb":"<b>Si llueve fuerte todo el día:<\/b> plan museos — Perlan (glaciares y aurora simulada) o Museo Marítimo, + tarde larga de hot pots en Laugardalslaug. La cena de las 19:00 no se mueve."},{"n":3,"fecha":"Viernes 11 de septiembre","titulo":"Mega Zipline · Reykjadalur (río termal) · Costa Sur hasta Skógar","zona":"Reikiavik › Hveragerði › Seljalandsfoss › Skógar","km":"165 km","cond":"~2 h 45 en 3 tramos","luz":"~06:39 / 20:08 (aprox. interpolado)","intensidad":"Media-alta (víspera del Fimm)","aurora":false,"crono":[["08:15","SALIDA de Reikiavik (tanque lleno + agua llena). Rte 1 este por el paso Hellisheiði — niebla frecuente aunque en la ciudad haya sol. Media hora más tarde que el plan v12: se gana sueño y queda buffer.",1],["09:15","Llegada a la zona de Hveragerði. [VERIFICAR PUNTO DE ENCUENTRO] el ticket dice Árhólmar 1, 810 Hveragerði; la web ubica la recepción junto al Reykjadalur Café (“The Lodge”), en el trailhead del hike (~4 km al norte por Breiðamörk). LLAMAR AL +354 782 3000 ANTES DEL VIAJE y marcar los dos puntos offline.",1],["10:05","Check-in Mega Zipline (estar 10 min antes). Dejar TODO en el motorhome: prohibido mochilas, celulares, ropa suelta y sandalias. Buff ajustado bajo el casco (confirmar en recepción).",1],["10:15","MEGA ZIPLINE — Superman Ride “Fast as a Falcon”: 1 km boca abajo sobre el cañón Svartagljúfur, hasta ~120 km/h. Ref MEGAZIP-T144880936, PAGADO (22.933 ISK los 2). Duración total 50-55 min. Único registro posible: el video del operador (2.900 ISK/pax, se compra en recepción).",1],["11:30","Parking Reykjadalur (Rjúpnabrekkur). HIKE al río termal: 7 km i/v, ~1 h de subida. BAÑO EN EL RÍO ACOTADO A 45 MIN (regla del día: mañana es el Fimm). Traje puesto desde el motorhome, toalla y ojotas.",1],["14:05","Bajada terminada. Almuerzo en el motorhome o en Hveragerði (pueblo de invernaderos).",0],["15:00","Rte 1 este: Selfoss (último súper grande: Bónus/Krónan) › Hella › Hvolsvöllur.",0],["16:35","SELJALANDSFOSS — caminar DETRÁS de la cascada (empaparse es parte; impermeable total). + GLJÚFRABÚI, la cascada escondida en la grieta 600 m a la izquierda: verla HOY (mañana no hay tiempo).",1],["17:50","Rte 1 este hasta Skógar (35 min).",0],["18:25","Camping Skógar. Cena temprana y preparar TODO el equipo del Fimmvörðuháls (capas, frontales, agua, comida, bastones, Garmin cargado con el course).",1],["20:00","Registrar el plan de mañana en safetravel.is + chequear vedur.is (viento en cumbre) y road.is. Primer go/no-go del Fimm.",1],["21:00","DORMIR. La hora de dormir NO se mueve: mañana suena la alarma ~05:15.",1]],"ruta":"<b>Reikiavik › Hveragerði (40-45 min):<\/b> Rte 1 sube al páramo de Hellisheiði — niebla y viento frecuentes incluso con sol en la ciudad; bajada con curvas hacia Hveragerði. <b>Zipline y trailhead:<\/b> si la recepción es la del Reykjadalur Café, coincide exactamente con el parking Rjúpnabrekkur del hike — cero traslado entre una cosa y la otra. Si es Árhólmar 1 (centro de Hveragerði), sumar ~10 min de ida y vuelta. <b>Hveragerði › Selfoss (15 min):<\/b> llano. Completar despensa en Selfoss (después solo hay súper chicos hasta Vík). <b>Selfoss › Seljalandsfoss (55 min):<\/b> Rte 1 recta entre granjas, con Hekla y luego Eyjafjallajökull a la izquierda. Desvío por la Rte 249, a metros de la Ring Road (parking pago [VERIFICAR tarifa, ~800-1.000 ISK]). <b>Seljalandsfoss › Skógar (30 min):<\/b> Rte 1 pegada a los acantilados de la antigua costa.","pueblos":"<b>Hveragerði:<\/b> pueblo geotermal (invernaderos iluminados); panadería Almar Bakari [VERIFICAR]; piscina municipal buena. <b>Selfoss:<\/b> la \"capital\" del sur — Bónus y Krónan, farmacia, gasolineras N1/Orkan. Última parada de precios normales. <b>Skógar:<\/b> es un caserío: museo folk, un par de hoteles y el camping. Sin súper — llegar con todo comprado.","camping":"<b>Camping Skógar<\/b> — al pie de Skógafoss (dormís escuchando la cascada). Servicios básicos: baños, duchas [VERIFICAR si con ficha], sin cocina techada. ~1.500–2.500 ISK/pax [VERIFICAR]. No se reserva: se paga en el lugar. <b>Clave logística:<\/b> es la base perfecta para el Fimm — el trailhead está a 200 m de la carpa.","treks":[{"nombre":"Mega Zipline Superman (no es trek, pero es el hito fijo del día)","parking":"[VERIFICAR] Árhólmar 1, 810 Hveragerði (ticket) vs recepción junto al Reykjadalur Café / trailhead de Reykjadalur (web). Llamar +354 782 3000.","datos":"10:15 · 50-55 min check-in a check-out · peso 30-120 kg (con viento suben el mínimo, hasta ~60 kg) · mín. 9 años","qr":"z1"},{"nombre":"Reykjadalur — río termal","parking":"Parking Reykjadalur (Rjúpnabrekkur), final del camino desde Hveragerði. Pago por app Parka [VERIFICAR tarifa].","datos":"7 km i/v · +330 m aprox · 2h30-3h con baño (hoy: baño tope 45 min)","qr":"t1"}],"seguridad":"<b>Zipline:<\/b> con viento el operador sube el peso mínimo (visto hasta 60 kg) — hay riesgo real de que a alguien liviano lo dejen en tierra ese día; no discutir la decisión del operador. Ir de cabeza a 100+ km/h con 8-10 °C corta el aire: buff ajustado. Sin celular a bordo, no hay forma de filmarse. <b>Reykjadalur:<\/b> el sendero cruza zona geotermal activa — NO salirse de las pasarelas (quemaduras reales cada año). La temperatura del río varía por tramo: probar antes de meterse entero. <b>Seljalandsfoss:<\/b> piso resbaladizo detrás de la cascada, rocío constante — calzado con agarre. <b>Regla de disciplina del día:<\/b> si el día se atrasa se recorta el baño en el río, NUNCA la preparación del Fimm ni las horas de sueño.","planb":"<b>Si el operador cancela el zipline por viento:<\/b> reembolso total y el día vuelve al plan v12 (salida 08:00, hike con calma) — que en realidad es mejor para el descanso pre-Fimm. <b>Si dejan a alguien en tierra por peso/viento:<\/b> el otro vuela igual; no discutir, no reprogramar (mañana es el Fimm). <b>Si el clima está feo en Reykjadalur<\/b> (lluvia fuerte/viento): saltear el hike, piscina de Hveragerði o seguir directo y sumar Sólheimasandur o el museo de Skógar por la tarde. <b>Si el pronóstico del D4 pinta NO-GO:<\/b> hoy mismo replanificar con la matriz de Plan B (Waterfall Way como sustituto del Fimm). <b>Cancelación propia del zipline:<\/b> 100% de cargo con 1 día o menos — mover fecha SIEMPRE antes que cancelar."},{"n":4,"fecha":"Sábado 12 de septiembre","titulo":"FIMMVÖRÐUHÁLS self-guided (día reina)","zona":"Skógar › Fimmvörðuháls › Básar (Þórsmörk) › bus a Skógar","km":"40 km (25 a pie + bus de regreso)","cond":"0 propia — regreso en bus 20:30","luz":"06:42 / 20:04 (Þórsmörk atardece ~19:53)","intensidad":"EXTREMA","aurora":false,"crono":[["05:15","Despertar. Desayuno fuerte. Chequeo final: vedur.is (viento en cumbre), road.is, webcams si hay señal.",0],["05:30","GO / NO-GO: viento >50 km/h en altura, visibilidad mala o nieve fresca en el paso = NO SE SUBE. Sustituto: Waterfall Way (los primeros ~8 km hasta el puente, ida y vuelta).",1],["06:30–07:00","SALIDA desde Skógafoss (escalera este). Tramo 1: la escalera de cascadas del río Skógá — 26 cascadas, subida sostenida.",1],["09:00–09:30","Puente sobre el Skógá (km 8). Control horario nº 1: si van MÁS TARDE de 09:30, evaluar volver.",1],["13:00","TOPE en Baldvinsskáli (refugio, km 13, ~1.000 m). Si no llegaron 13:00, MEDIA VUELTA sin discusión: la bajada a Básar no se hace de noche.",1],["13:30–15:00","Paso entre glaciares + cráteres Magni y Móði (erupción 2010, terreno aún tibio en partes). Fotos rápidas, no demorarse.",0],["15:00–18:30","BAJADA a Þórsmörk: -800/900 m. Heljarkambur (cresta con cadena) y Kattarhryggir (filo expuesto): pasos cortos pero con caída — concentración total, de a uno.",1],["18:30–20:00","Llegada a Básar. Margen de 2 h antes del bus: cambiarse, comer, celebrar.",0],["20:15","PRESENTARSE al bus con FRONTALES puestos (ref. 201027840000; cambios: +354 867 3535).",1],["20:30","Bus Básar › Skógar (cruza ríos — por eso no se va con el motorhome). Llegada ~22:00. Dormir sin armar nada.",1]],"ruta":"Hoy la \"ruta\" es el sendero (ver perfil arriba). El motorhome NO se mueve de Skógar. El bus de vuelta (Þórsmörk › Skógar) es la única pieza motorizada y está pagado; cruza los vados del Krossá que ningún vehículo alquilado puede cruzar legalmente. Track GPX del recorrido cargado en el Garmin Fenix 8 Pro (course + ClimbPro + inReach activado).","pueblos":"No hay pueblos hoy. Todo lo que se necesita sale de la despensa del motorhome: mínimo 2 L de agua por cabeza, almuerzo + snacks calóricos (frutos secos, chocolate), térmica de repuesto en bolsa estanca.","camping":"<b>Camping Skógar<\/b> — segunda noche, la carpa/motorhome quedó armada. Al volver 22:00: cena caliente rápida (dejar algo pre-cocinado hoy a la mañana) y a dormir.","treks":[{"nombre":"Fimmvörðuháls: Skógar › Básar","parking":"Parking Skógafoss (gratuito). El vehículo pasa el día ahí.","datos":"25 km punto a punto · +1.000 m / -800-900 m · 10–12 h","qr":"t2"}],"seguridad":"LA regla del viaje: los horarios de control (09:30 puente / 13:00 Baldvinsskáli) NO se negocian. Plan registrado en safetravel.is desde el D3; inReach del Garmin encendido todo el día. Clima de montaña islandés: se puede pasar de sol a nieve horizontal en 30 min — capas + guantes + gorro SIEMPRE en la mochila, aunque abajo haga 12°. En Heljarkambur/Kattarhryggir: tres puntos de apoyo, sin fotos caminando. Seguro: actividad de aventura › cubre HEYMONDO (nivel Básico): ante incidente llamar +34 913 536 323 CON AVISO PREVIO.","planb":"<b>NO-GO a las 05:30:<\/b> Waterfall Way (ida y vuelta hasta el puente km 8, 16 km, espectacular igual) + tarde en Skógafoss/museo. El bus se pierde (asumido en el análisis de riesgo). <b>Si en el puente van tarde o el clima gira:<\/b> volver por donde subieron — es la salida natural y segura."},{"n":5,"fecha":"Domingo 13 de septiembre","titulo":"RECOVERY · Dyrhólaey · Reynisfjara · Vík","zona":"Skógar › Dyrhólaey › Reynisfjara › Vík","km":"70 km","cond":"~1 h 15","luz":"~06:45 / 20:01 (aprox. interpolado)","intensidad":"Baja (a propósito)","aurora":false,"crono":[["09:00","Despertar SIN alarma. Desayuno largo. Estirar piernas en la base de Skógafoss (10 min, están ahí).",0],["11:00","Salida tranquila. Rte 1 este 20 min + Rte 218 al promontorio de Dyrhólaey.",0],["11:30","DYRHÓLAEY (1 h): arco de piedra gigante, vistas a la costa negra infinita y al faro. Con suerte, últimos frailecillos de la temporada (se van a mediados de sept — no prometido).",0],["13:00","Almuerzo en el motorhome.",0],["14:00","REYNISFJARA (45 min): playa negra, columnas de basalto, cuevas. REGLA: mínimo 30 m de la orilla, nunca de espaldas al mar.",1],["15:15","Vík por Rte 1 (10 min). Iglesia arriba del pueblo (mejor vista), Krónan para reponer.",0],["16:30","Camping Vík. Tarde libre: piscina de Vík, diario de viaje, siesta. Cargar todo (mañana Katla).",0]],"ruta":"<b>Skógar › desvío 218 (20 min):<\/b> Rte 1. <b>Rte 218 (10 min):<\/b> asfalto/ripio corto hasta los dos miradores de Dyrhólaey (el de arriba, con faro, cierra según temporada de aves [VERIFICAR cartel en el acceso]). <b>Vuelta a Rte 1 › Rte 215 (10 min):<\/b> a Reynisfjara, parking pago [VERIFICAR tarifa ~750-1.000 ISK]. <b>Rte 1 › Vík (10 min):<\/b> el pueblo aparece tras el túnel de montaña Reynisfjall... no hay túnel: tras rodear el Reynisfjall.","pueblos":"<b>Vík í Mýrdal (~750 hab):<\/b> súper Krónan (bien surtido, el último grande hasta Höfn); gasolinera N1; piscina municipal con vista [VERIFICAR horario dom]; farmacia chica [VERIFICAR días]. Comer: Sústa (fish & chips) o The Soup Company; trampa: los sitios con carteles gigantes de \"volcano show\" sobre la Rte 1. Panadería: en el Skool Beans/Icewear café hay pastelería [VERIFICAR].","camping":"<b>Camping Vík<\/b> — bajo el acantilado, con vista a los Reynisdrangar. Servicios completos: duchas, cocina, lavadero, electricidad. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. En septiembre hay lugar, pero llegar antes de las 18:00 asegura sitio con hookup.","treks":[],"seguridad":"REYNISFJARA ES EL PUNTO MÁS PELIGROSO DEL VIAJE para turistas confiados: las \"sneaker waves\" suben el doble que las anteriores sin aviso y han matado gente. 30 metros mínimo de la línea de espuma, más si el mar está bravo (hay semáforo de riesgo en el acceso — respetarlo). En Dyrhólaey, viento fuerte en el borde del acantilado: no acercarse al filo para la foto.","planb":"<b>Si el D4 dejó el cuerpo destruido:<\/b> cortar Dyrhólaey y hacer solo Reynisfjara + Vík con piscina. <b>Si llueve fuerte:<\/b> mismo plan (estas paradas funcionan con lluvia), más tiempo de piscina y café."},{"n":6,"fecha":"Lunes 14 de septiembre","titulo":"Katla Ice Cave · Fjaðrárgljúfur · Skaftafell","zona":"Vík › Kirkjubæjarklaustur › Skaftafell","km":"160 km","cond":"~2 h 30 propias (+ tour)","luz":"~06:48 / 19:57 (aprox. interpolado)","intensidad":"Media-alta","aurora":false,"crono":[["08:30","Desayuno. Preparar capas abrigadas + calzado de trekking (el tour presta crampones y casco).",0],["09:00","KATLA ICE CAVE TOUR (KTR-91396891) — punto de encuentro: Austurvegur 16, Vík. Súper-jeep al glaciar Kötlujökull, cueva de hielo negro. Dura ~3-4 h.",1],["13:00–14:00","Fin del tour. Almuerzo en Vík (o en el motorhome). Tanque lleno en N1 Vík.",0],["14:30","Rte 1 este: campos de lava de Eldhraun cubiertos de musgo (NO PISAR el musgo: tarda décadas en recuperarse).",0],["15:30","FJAÐRÁRGLJÚFUR (1 h): cañón de 100 m con miradores por el borde. Acceso por Rte 206, ripio corto.",0],["17:00","Kirkjubæjarklaustur: café + último súper chico (Kjarval [VERIFICAR]) antes del \"desierto\" de Skeiðarársandur.",0],["18:00","Rte 1 este cruzando los arenales glaciares — puentes de una mano, viento con arena si sopla del norte.",0],["19:00","Camping Skaftafell. Cena y a dormir 22:00 MÁXIMO: mañana es el día más cargado del viaje.",1]],"ruta":"<b>Vík › Klaustur (45 min):<\/b> Rte 1 por Mýrdalssandur y el lavafield de Eldhraun (mirador señalizado). <b>Desvío Fjaðrárgljúfur:<\/b> Rte 206 unos 3 km de ripio decente (OK sin 4x4 en seco) [VERIFICAR estado en road.is]. <b>Klaustur › Skaftafell (50 min):<\/b> Rte 1 por Skeiðarársandur — el arenal glaciar más grande del mundo, puentes angostos, y el Öræfajökull creciendo en el parabrisas. Con viento del N/NE fuerte hay tormentas de arena que dañan pintura: el seguro Sand & Ash de TC cubre esto [VERIFICAR que esté activo en el contrato].","pueblos":"<b>Kirkjubæjarklaustur (~120 hab):<\/b> súper chico tipo Kjarval/Krambúð [VERIFICAR], N1, piscina municipal, info del Parque Nacional Vatnajökull. Es LA parada de servicios entre Vík y Höfn: después no hay nada por 130 km. <b>Freysnes (frente a Skaftafell):<\/b> gasolinera + hotel [VERIFICAR], por si el tanque quedó justo.","camping":"<b>Camping Skaftafell<\/b> — dentro del Parque Nacional, enorme, al pie del glaciar. Duchas (con ficha [VERIFICAR]), electricidad limitada por sector, vaciado. ~2.000–3.000 ISK/pax + tarifa de parking del PN [VERIFICAR]. Abierto todo el año. Posicionarse cerca de la salida del sendero para mañana 07:00.","treks":[],"seguridad":"En la cueva de hielo: seguir al guía SIEMPRE (el hielo negro de Katla se mueve a diario). Musgo de Eldhraun: no pisar ni \"acostarse para la foto\" — multa y daño real. Skeiðarársandur con viento: bajar velocidad, no estacionar de cara al viento con puertas a sotavento sueltas. Seguro del tour: aventura › Heymondo (+34 913 536 323, aviso previo).","planb":"<b>Si cancelan Katla por clima<\/b> (pasa): pivotear a caminata corta guiada en Sólheimajökull si hay cupo del mismo operador [VERIFICAR disponibilidad al momento] o adelantar la tarde: Fjaðrárgljúfur con calma + llegar temprano a Skaftafell y hacer Svartifoss hoy (libera presión del D7)."},{"n":7,"fecha":"Martes 15 de septiembre","titulo":"MEGA-DÍA: Sjónarnípa · Glacier hike · Jökulsárlón","zona":"Skaftafell › Jökulsárlón › Höfn","km":"130 km","cond":"~2 h 15 propias","luz":"06:51 / 19:54 (Jökulsárlón: atardecer ~19:30)","intensidad":"ALTA","aurora":false,"crono":[["06:30","Desayuno fuerte. Sándwiches hechos para TODO el día.",0],["07:00–11:00","LOOP SJÓNARNÍPA (~7-8 km, 4 h): Skaftafellsstofa › Austurbrekkur › mirador Sjónarnípa (el Skaftafellsjökull a tus pies) › Svartifoss (columnas de basalto) › Magnúsarfoss/Hundafoss › base.",1],["11:15","Almuerzo rápido + cambio de medias. Salida en motorhome.",0],["13:10","PRESENTACIÓN Blue Ice Base Camp — Rd 998 (IA-T130140787). Glacier hike guiado en Falljökull/Virkísjökull ~3 h con equipo incluido.",1],["16:45","Fin del tour. Rte 1 este directo a Jökulsárlón (45 min).",0],["17:45","JÖKULSÁRLÓN: icebergs azules + focas casi seguro. Cruzar a pie a DIAMOND BEACH (hielos varados en arena negra).",1],["19:30","ATARDECER en la laguna — la foto del viaje. Frontal a mano para el final.",1],["20:00","Rte 1 este a Höfn (55 min). Cena tardía: si hay energía, langostinos en Höfn; si no, pasta en el camping.",0]],"ruta":"<b>Skaftafell › Base Camp Rd 998 (10 min):<\/b> la Rd 998 sale de la Rte 1 apenas al este [VERIFICAR señalización \"Glacier Adventure/Base Camp\"]. <b> ›  Jökulsárlón (40 min):<\/b> Rte 1 con el Öræfajökull encima y lagunas glaciares a la izquierda (Fjallsárlón queda para otro viaje — hoy no da). <b>Jökulsárlón › Höfn (55 min):<\/b> Rte 1; el puente colgante de la laguna es angosto: paciencia. Diamond Beach: parking del lado del mar, cruzando el puente [VERIFICAR tarifa].","pueblos":"<b>Höfn í Hornafirði (~1.700 hab):<\/b> \"capital de la langosta\" (humarinn — en realidad cigala). Súper Nettó; N1 y Orkan; piscina Sundlaug Hafnar (linda, plan B oficial); lavandería en el camping. Comer: Pakkhús o Hafnarbúðin (roll de langosta más barato) — caro igual: la cigala en Islandia nunca es ganga; trampa: menús \"lobster\" genéricos a precio de oro con poca cigala.","camping":"<b>Camping Höfn<\/b> — junto a la entrada del pueblo, completo (duchas, cocina, lavadero, electricidad). ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Llegada tarde OK: se paga a la mañana si la recepción cerró [VERIFICAR].","treks":[{"nombre":"Sjónarnípa loop (Austurbrekkur–Svartifoss)","parking":"Parking Skaftafellsstofa (centro de visitantes) — tarifa de parking del PN [VERIFICAR, se paga en máquina/app].","datos":"~7-8 km circuito · +400 m aprox · ~4 h","qr":"t3"},{"nombre":"Múlagljúfur (SOLO SI CANCELAN BLUE ICE)","parking":"Desvío de ripio SIN CARTEL al norte de la Rte 1, entre Fjallsárlón y Jökulsárlón (coord. entrada ~63°59'N 16°24'W) — pozos en el ripio: despacio con el motorhome.","datos":"~6,2 km i/v · +315 m · 2-3 h · cañón + Hangandifoss (120 m) · con barro/lluvia NO","qr":"t11"}],"seguridad":"JAMÁS pisar un glaciar sin guía (hoy lo pisan CON guía, equipados — esa es la manera). En Diamond Beach aplican las mismas olas traicioneras que Reynisfjara: no darle la espalda al mar ni subirse a hielos varados. Manejo nocturno de vuelta a Höfn: renos NO (eso es el este), pero sí ovejas sueltas — luces altas y calma. Glacier hike = aventura › Heymondo con aviso previo.","planb":"<b>Mal clima en la cumbre del loop:<\/b> hacer solo Svartifoss (2 km i/v) + el glacier hike (los tours salen casi con todo clima). <b>Si cancelan el glacier hike:<\/b> el sustituto oficial es MÚLAGLJÚFUR (ver tabla de treks): el cañón escondido entre Fjallsárlón y Jökulsárlón, 2-3 h con la vista de Hangandifoss — solo con día seco (el sendero con barro es jabón) y cruce de arroyo con piedras. Alternativa suave: loop completo con calma + Jökulsárlón más temprano y opción Fjallsárlón. <b>Regla doble-cancelación:<\/b> si además el atardecer pinta tapado, Jökulsárlón se disfruta igual de día — no esperar al sunset."},{"n":8,"fecha":"Miércoles 16 de septiembre","titulo":"Stokksnes al amanecer · Fiordos del Este","zona":"Höfn › Stokksnes › Djúpivogur › Breiðdalsvík","km":"180 km","cond":"~3 h (costera con curvas)","luz":"~06:54 / 19:50 (Stokksnes: amanecer local ~06:25)","intensidad":"Media","aurora":"PRIMERA VENTANA REAL","crono":[["06:00","Salida a oscuras. Rte 1 este 15 min + desvío al faro.",1],["06:25","AMANECER EN STOKKSNES: el Vestrahorn saliendo del mar con la playa negra de espejo. Acceso privado: 2.500 ISK/auto, se paga en el Viking Café (máquina/QR).",1],["08:30","Café + desayuno segundo en el Viking Café o el motorhome. Duna de pasto + restos del \"viking village\" de cine.",0],["09:30","Rte 1 este: empiezan los fiordos — Álftafjörður, Hamarsfjörður. Renos posibles al costado (primera zona del viaje).",0],["12:00","DJÚPIVOGUR: almuerzo. Pueblo pesquero tranquilo, los huevos gigantes de piedra (Eggin í Gleðivík).",0],["14:00","Rte 1 costera hacia el norte: Breiðdalsvík. Tarde CORTA a propósito: recuperar sueño.",0],["16:00","Camping Breiðdalsvík [VERIFICAR apertura en tjalda.is — riesgo de cierre estacional]. Caminata suave por el pueblo.",0],["21:30","PRIMERA GUARDIA DE AURORAS: chequear KP + nubes (en.vedur.is/weather/forecasts/aurora). El fiordo oscuro es un spot excelente.",1]],"ruta":"<b>Höfn › Stokksnes (15 min):<\/b> Rte 1 este + camino del faro (ripio corto, OK). <b> ›  Djúpivogur (1 h 30):<\/b> Rte 1 abraza la costa; el tramo Álftafjörður es de los más lindos del país. OJO: hay un sector de ripio en la Rte 1 cerca de Hvalnes/Þvottárskriður [VERIFICAR estado] — bajar velocidad, piedra suelta. <b>Djúpivogur › Breiðdalsvík (50 min):<\/b> Rte 1 dobla tierra adentro por Berufjörður; alternativa costera Rte 96 más larga. Túnel o paso según obras [VERIFICAR road.is].","pueblos":"<b>Djúpivogur (~470 hab):<\/b> súper chico tipo Kjörbúðin/Samkaup [VERIFICAR], gasolinera, café Langabúð (histórico, tortas). <b>Breiðdalsvík (~140 hab):<\/b> mini-mercado [VERIFICAR horario], gasolinera automática, hotel con restaurant. Si el camping está cerrado, Stöðvarfjörður (20 min más) tiene camping alternativo [VERIFICAR] y la famosa colección de piedras de Petra (cierra ~sept [VERIFICAR]).","camping":"<b>Camping Breiðdalsvík<\/b> — chico, junto al pueblo. Servicios básicos. ~1.500–2.500 ISK/pax. <b>[VERIFICAR HOY MISMO en tjalda.is]:<\/b> es EL camping con más riesgo de cierre estacional del viaje. <b>Plan B ya definido:<\/b> camping Stöðvarfjörður (Rte 1 + 96, 25 min).","treks":[],"seguridad":"Salida nocturna 06:00: ovejas y (desde hoy) RENOS en la ruta — el mayor riesgo animal del este. Luces altas, 80 km/h reales. Stokksnes con viento: la arena vuela y pica — proteger lentes de cámara. Curvas de fiordo sin banquina: no frenar en la calzada para fotos; usar los pull-outs.","planb":"<b>Si Stokksnes amanece con niebla cerrada:<\/b> saltarlo (está en la matriz de recorte), dormir 1 h más y arrancar 08:00 directo a los fiordos. <b>Si el día está gris entero:<\/b> más tiempo en Djúpivogur/Petra y llegada temprana — hoy es día de transición, no de forzar."},{"n":9,"fecha":"Jueves 17 de septiembre","titulo":"Seyðisfjörður · Hengifoss · Stuðlagil (día de 310 km)","zona":"Breiðdalsvík › Egilsstaðir › Seyðisfjörður › Hengifoss › Stuðlagil › Egilsstaðir","km":"310 km","cond":"~5 h repartidas","luz":"~06:57 / 19:46 (aprox. interpolado)","intensidad":"Alta (por km)","aurora":"Ventana activa","crono":[["07:30","SALIDA SIN FALTA — hoy el reloj manda. Rte 1 norte a Egilsstaðir (1 h 10).",1],["08:45","Rte 93: subida al paso (601 m) y bajada de película a Seyðisfjörður.",0],["09:15","SEYÐISFJÖRÐUR (1 h): la calle arcoíris a la iglesia celeste, casas noruegas de madera, café rápido.",0],["10:30","Vuelta por Rte 93 › Egilsstaðir › Rte 931/933 por el lago Lagarfljót (¿monstruo Lagarfljótsormur? atentos).",0],["11:45","HENGIFOSS + LITLANESFOSS (5 km i/v, 2–2h30): subida con dos regalos — primero las columnas de basalto de Litlanesfoss, arriba la pared a rayas rojas de Hengifoss (118 m).",1],["14:30","Almuerzo en el motorhome. Rte 1 norte + Rte 923 (ripio decente [VERIFICAR]) hacia Jökuldalur.",0],["15:45","STUÐLAGIL lado OESTE (parking Grund): escalera al mirador sobre el cañón de columnas de basalto y el río turquesa-glaciar. 20–30 min.",1],["16:30","OPCIONAL si el día vino holgado (raro): lado ESTE — 2º parking después del puente de Klaustursel (1.000 ISK), 5,3–5,7 km i/v a nivel del río. Si no, a la matriz de recorte.",0],["18:00","Camping Egilsstaðir. Bónus/Nettó para reponer. Vök Baths queda como comodín NO presupuestado (10.500 ISK/pp).",0],["21:30","Guardia de auroras nº 2: Egilsstaðir tiene poca luz urbana hacia el lago.",1]],"ruta":"<b>Breiðdalsvík › Egilsstaðir (1 h 10):<\/b> Rte 1 tierra adentro por Breiðdalur (paso con curvas; con nieve temprana chequear road.is). <b>Rte 93 (25 min por lado):<\/b> asfaltada y espectacular, pero es paso de montaña: niebla frecuente arriba. <b>Rte 931/933 a Hengifoss (30 min):<\/b> bordea el Lagarfljót; el parking de Hengifoss está sobre la 933 pasando el puente, gratuito [VERIFICAR]. <b>Rte 1 norte + Rte 923 a Stuðlagil (45 min):<\/b> la 923 es ripio mantenido hasta Grund [VERIFICAR estado]; NO confundir: el mirador oeste (Grund) es el rápido; el lado este es otro acceso y otra caminata.","pueblos":"<b>Egilsstaðir (~2.600 hab):<\/b> el hub del este — Bónus, Nettó y Krónan, farmacias, N1/Orkan/Olís, piscina municipal. <b>Seyðisfjörður (~700 hab):<\/b> panadería/cafés lindos (El Grillo brewpub, Norð Austur sushi — caro pero famoso), súper chico. Comer barato en Egilsstaðir: Söluskálinn/grills de estación; trampa: nada grave en esta zona.","camping":"<b>Camping Egilsstaðir (Kaupvangur)<\/b> — grande, céntrico, con lavandería y cocina techada. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Abierto hasta fin de septiembre [VERIFICAR].","treks":[{"nombre":"Hengifoss + Litlanesfoss","parking":"Parking Hengifoss (Rte 933, tras el puente desde la 931) — gratuito [VERIFICAR].","datos":"5 km i/v · +320 m aprox · 2–2h30","qr":"t4"},{"nombre":"Stuðlagil lado ESTE (opcional)","parking":"2º parking pasando el puente de Klaustursel — 1.000 ISK.","datos":"5,3–5,7 km i/v · llano · ~2 h","qr":"t5"}],"seguridad":"Día largo de volante: rotar conductores si aplica, parar cada 1 h 30. En el mirador oeste de Stuðlagil: barandas SÍ, filo NO — el basalto mojado es jabón. La Rte 923 con lluvia fuerte se pone barrosa: si está fea, el mirador oeste sigue siendo viable con calma; el este se descarta.","planb":"<b>Si el día colapsa (llegan 15:00 sin Hengifoss hecho):<\/b> aplicar matriz — cae Seyðisfjörður o Stuðlagil este, NUNCA Hengifoss (es el plato fuerte). <b>Opción oficial del itinerario:<\/b> pasar Stuðlagil (oeste) a mañana D10 a primera hora — el orden D10 lo permite. <b>Clima feo:<\/b> Vök Baths como refugio termal (no presupuestado, decisión en el momento)."},{"n":10,"fecha":"Viernes 18 de septiembre","titulo":"Dettifoss · Krafla/Leirhnjúkur · Mývatn · Earth Lagoon","zona":"Egilsstaðir › Dettifoss › Krafla › Mývatn","km":"240 km","cond":"~4 h","luz":"~07:00 / 19:43 (Earth Lagoon: sunset ~19:20 en el agua)","intensidad":"Alta","aurora":"Ventana activa — Mývatn es spot top","crono":[["08:00","Salida. Rte 1 oeste por el altiplano de Jökuldalsheiði — tramo desolado, POCA COBERTURA de señal, tanque lleno desde Egilsstaðir.",1],["10:00","Desvío Rte 862 (ASFALTADA) al norte: DETTIFOSS — la cascada más potente de Europa — + SELFOSS río arriba (1 h 30 total, pasarelas).",1],["12:00","Vuelta a Rte 1 oeste. Almuerzo en ruta o en el parking de Krafla.",0],["13:30","LEIRHNJÚKUR loop (7 km, 2,5–3 h): campos de lava de los Fuegos de Krafla (1975-84), fumarolas, tierra multicolor. Senderos marcados, zona geotermal VIVA.",1],["16:30","HVERIR (30 min): el \"Marte islandés\" — ollas de barro hirviendo y fumarolas bajo el Námafjall. Olor a azufre de regalo.",0],["17:15","Si el reloj acompaña: DIMMUBORGIR Kirkjuhringur (2,5–3 km, 1 h) — castillos de lava al atardecer. Si no: matriz de recorte.",0],["18:00","EARTH LAGOON (ex Mývatn Nature Baths / Jarðböðin) — PAGADO. Aguas lechosas con vista al lago; el sol se pone ~19:20 estando adentro.",1],["20:00","Camping Bjarg (Reykjahlíð, orilla del lago). Cena.",0],["22:00","Guardia de auroras nº 3 — Mývatn con cielo limpio es de los mejores lugares del país: reflejo en el lago.",1]],"ruta":"<b>Egilsstaðir › desvío 862 (1 h 45):<\/b> Rte 1 sube a ~600 m por el páramo: viento y nevadas tempranas posibles [road.is antes de salir]. <b>Rte 862 (20 min por lado):<\/b> asfaltada hasta el parking oeste de Dettifoss. La 864 (lado este) es ripio y NO va con este plan. <b>Rte 1 › desvío Krafla (40 min):<\/b> el desvío a Krafla/Leirhnjúkur está asfaltado, pasa entre tuberías de la planta geotérmica. <b>Krafla › Hverir (10 min) › Earth Lagoon (5 min) › Reykjahlíð (5 min):<\/b> todo pegado alrededor del paso Námaskarð.","pueblos":"<b>Reykjahlíð (Mývatn, ~300 hab):<\/b> súper Samkaup Strax CHICO Y CARO — por eso se repone en Egilsstaðir; N1; panadería geotermal: el pan de centeno cocido bajo tierra (probar el rúgbrauð en Earth Lagoon o cafés locales). Comer: Daddi's Pizza o Gamli Bærinn; trampa: cualquier cosa \"geothermal experience\" con precio premium.","camping":"<b>Camping Bjarg<\/b> — en Reykjahlíð, sobre la orilla del lago (spot de auroras sin moverse). Servicios completos. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is — apertura hasta fin de sept]. <b>Alternativa:<\/b> camping Hlíð, 500 m más arriba [VERIFICAR].","treks":[{"nombre":"Leirhnjúkur lava fields (Krafla)","parking":"Parking Leirhnjúkur (desvío Krafla, asfaltado) — gratuito.","datos":"7 km circuito · llano con subidas suaves · 2,5–3 h","qr":"t6"},{"nombre":"Dimmuborgir — Kirkjuhringur","parking":"Parking Dimmuborgir (Rte 848) — [VERIFICAR si cobran].","datos":"2,5–3 km circuito · llano · ~1 h","qr":"t7"}],"seguridad":"Leirhnjúkur/Hverir: NO salirse de senderos y pasarelas — el suelo es costra sobre barro a 80-100 °C, y los accidentes son quemaduras graves. Dettifoss: rocío + basalto = resbaladizo; hay tramos sin baranda, distancia al borde. Jökuldalsheiði sin señal: avisar el plan del día a alguien (o inReach) antes de salir de Egilsstaðir.","planb":"<b>Si la 862 está cerrada<\/b> (temporal temprano): saltar Dettifoss (matriz #11 — duele pero es el criterio) o SOLO si está abierta y decente la 864 con calma extrema — el Gravel insurance de TC cubre ripio [VERIFICAR contrato]; la recomendación es NO. <b>Si llueve todo el día:<\/b> Leirhnjúkur se acorta al sector de fumarolas (1 h), más tiempo en Earth Lagoon — bajo lluvia también es un plan."},{"n":11,"fecha":"Sábado 19 de septiembre","titulo":"Hverfjall al amanecer · Ballenas en Húsavík · Goðafoss · Akureyri","zona":"Mývatn › Húsavík › Goðafoss › Akureyri","km":"200 km","cond":"~3 h 15","luz":"07:02 / 19:39 (Mývatn: amanecer local ~06:42)","intensidad":"Alta (arranque 05:30)","aurora":"Ventana activa","crono":[["05:30","Despertar. Manejo corto a oscuras al parking norte de Hverfjall (acceso de ripio corto [VERIFICAR]).",0],["05:50–07:00","HVERFJALL: subida 15-20 min al borde del cráter de toba (1 km de diámetro) y AMANECER (06:42) con el lago Mývatn de fondo. Vuelta al motorhome.",1],["07:45","Salida a Húsavík por Rte 87 (50 min, paso suave).",1],["08:35","Llegada Húsavík. Desayuno con calma en el puerto.",0],["09:30","CHECK-IN North Sailing — Hafnarstétt 9, FRENTE A LA IGLESIA de madera. Reserva NOS-90813087 / ticket NOS-T129609121: figura \"awaiting payment\" y ES NORMAL — SE PAGA ALLÁ (27.980 ISK).",1],["10:00–13:00","AVISTAJE DE BALLENAS en velero de roble (jorobadas casi seguras a fin de temporada; overol térmico incluido).",1],["13:15","Almuerzo en el puerto: fish & chips o sopa de pescado.",0],["14:30","Rte 85/845 sur hacia la Ring Road (50 min).",0],["15:30","GOÐAFOSS (30 min): la \"cascada de los dioses\" — herradura perfecta, miradores por ambas márgenes.",1],["16:30","Rte 1 oeste a Akureyri (35 min). Bónus/Nettó para reponer.",0],["17:30","PISCINA SUNDLAUG AKUREYRI: hot pots + toboganes — el templo del norte (~1.900 ISK/pp aprox [VERIFICAR]).",0],["19:30","Camping Hamrar. Cena. Auroras: alejarse de las luces del camping hacia el bosque si hay KP.",0]],"ruta":"<b>Mývatn › Húsavík (50 min):<\/b> Rte 87, paso de montaña suave asfaltado [VERIFICAR estado matinal]. <b>Húsavík › Goðafoss (50 min):<\/b> Rte 85 sur + Rte 845 hasta empalmar la Rte 1 justo en Goðafoss (parking en ambas márgenes; el del este tiene café). <b>Goðafoss › Akureyri (35 min):<\/b> Rte 1 oeste bordeando el Eyjafjörður; entrada a la ciudad por el puente del fiordo. Akureyri: los semáforos tienen CORAZONES rojos — no es alucinación.","pueblos":"<b>Húsavík (~2.300 hab):<\/b> capital ballenera de Europa; súper Nettó/Krónan [VERIFICAR cuál opera], panadería Heimabakarí, Museo de la Ballena (plan B oficial), piscina con vista y GeoSea (baños de agua de mar, plan B). <b>Akureyri (~19.000 hab):<\/b> la \"capital del norte\" — Bónus, Nettó, Krónan, farmacias grandes, todo. Comer: Berlín (brunch), Bautinn; trampa: restoranes del muelle de cruceros con precios inflados.","camping":"<b>Camping Hamrar<\/b> — en el bosque de Kjarnaskógur, 5 min al sur del centro. Amplio, arbolado (raro en Islandia), servicios completos. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Abierto todo el año [VERIFICAR].","treks":[{"nombre":"Hverfjall — borde del cráter","parking":"Parking NORTE de Hverfjall (acceso ripio corto desde la zona del lago) — gratuito [VERIFICAR].","datos":"~3-4 km i/v con vuelta parcial al borde · +90 m · 1 h–1 h 15","qr":"t8"}],"seguridad":"Hverfjall a oscuras: frontales, sendero norte marcado — PROHIBIDO bajar por la ladera (erosión); mismo camino de vuelta. En el barco: overol que dan, gorro propio, pastilla de mareo 30 min antes si son sensibles (el swell de sept existe). Rte 87 al alba: hielo posible en el paso a fin de septiembre — puentes y sombras primero.","planb":"<b>Si cancelan la navegación por mar grueso<\/b> (deciden ellos): Museo de la Ballena + GeoSea (5.500 ISK/pp aprox) — plan B oficial; reintento imposible (el resto del viaje va al oeste). El pago allá significa que NO se pierde plata si cancelan ellos. <b>Si el amanecer está tapado:<\/b> Hverfjall se salta (matriz #9) y se duerme hasta 07:00 — el check-in 09:30 es lo intocable."},{"n":12,"fecha":"Domingo 20 de septiembre","titulo":"Travesía del noroeste (día de 370 km) · Noche clave de auroras","zona":"Akureyri › Blönduós › (Hvítserkur) › Borgarnes","km":"370 km","cond":"~5 h 30–6 h","luz":"~07:05 / 19:35 (aprox. interpolado)","intensidad":"Media (volante)","aurora":"NOCHE CLAVE — Borgarnes","crono":[["07:30","Desayuno. Chequeo OBLIGATORIO: vedur.is (viento en Öxnadalsheiði) + road.is. Con alerta amarilla de viento, replantear salida.",1],["08:00","Salida. Rte 1 oeste: paso de Öxnadalsheiði (540 m) — el tramo más alpino de la Ring Road del norte.",1],["09:30","Varmahlíð (parada técnica). Punto de decisión nº 1: si el clima está feo, acá se puede cortar el día (camping local).",0],["10:30","BLÖNDUÓS: café + estirar. Punto de gasolina N1.",0],["11:15","DESVÍO OPCIONAL Rte 711 (ripio): HVÍTSERKUR — el \"dragón que bebe\" — 1 h total de desvío. Marea baja = mejor foto [VERIFICAR tabla de mareas]. Si el día viene lento: matriz #5.",0],["13:00","Almuerzo en ruta. Rte 1 sur por Hrútafjörður.",0],["13:45","STAÐARSKÁLI: la parada de ruta más famosa de Islandia (N1) — combustible + soft ice de rigor.",0],["14:45","OPCIONAL MUY RECOMENDADO — GRÁBRÓK: cráter con escalera de madera JUSTO sobre la Rte 1 (junto a Bifröst). 15-30 min de subida por escalones, vuelta completa al borde con vista 360° a los campos de lava. Parking gratis. Es EL estirar-piernas con premio del día largo (30-45 min total).",0],["15:45","Llegada a BORGARNES. Check-in camping. Tarde libre: Settlement Center (saga de Egil) o piscina de Borgarnes (linda, con vista al fiordo).",0],["19:00","Cena. Preparar equipo de auroras: trípode, batería de repuesto EN EL BOLSILLO (el frío las mata), termo.",0],["21:30–01:00","NOCHE CLAVE DE AURORAS: Borgarnes tiene el fiordo Borgarfjörður hacia el norte con horizonte oscuro. Alejarse 5 min de las luces del pueblo (costanera oeste o el puente viejo).",1]],"ruta":"<b>Akureyri › Varmahlíð (1 h 15):<\/b> Rte 1 por Öxnadalsheiði: paredes de aguja (Hraundrangi), viento canalizado, primeras nieves posibles a fin de sept. <b>Varmahlíð › Blönduós (45 min):<\/b> valles ganaderos. <b>Desvío Hvítserkur:<\/b> Rte 711 ripio ~15 km por lado [VERIFICAR estado] — con lluvia fuerte, evaluar. <b>Blönduós › Staðarskáli (1 h):<\/b> Rte 1 bordea el Hrútafjörður. <b>Staðarskáli › Borgarnes (1 h 15):<\/b> Rte 1 por Norðurárdalur, bajando al Borgarfjörður. Todo asfaltado salvo el desvío 711.","pueblos":"<b>Blönduós (~950 hab):<\/b> súper Kjörbúðin/Samkaup [VERIFICAR], N1, panadería. <b>Borgarnes (~2.100 hab):<\/b> Bónus y Nettó, N1/Orkan, piscina municipal muy buena, Settlement Center (museo + restaurant sólido). Geirabakarí: panadería con la mejor vista de Islandia (salió en \"Walter Mitty\"). Trampa: ninguna seria; Borgarnes es pueblo de paso honesto.","camping":"<b>Camping Borgarnes<\/b> — sobre el fiordo, céntrico. Servicios completos. ~2.000–3.000 ISK/pax [VERIFICAR tjalda.is]. Posición estratégica: deja Snæfellsnes a 1 h para mañana.","treks":[{"nombre":"Grábrók — borde del cráter (OPCIONAL)","parking":"Parking Grábrók, sobre la Rte 1 junto a Bifröst — gratuito, señalizado.","datos":"~1,4 km circuito · +55-90 m (escalera de madera) · 30-45 min con vuelta al borde","qr":"t10"}],"seguridad":"En el borde de Grábrók el viento pega fuerte — si el día está ventoso, mirar desde la escalera y no dar la vuelta completa. El riesgo del día es el VIENTO en ruta abierta: con ráfagas >20 m/s (72 km/h) un motorhome es una vela — si vedur.is marca alerta, esperar o cortar en Varmahlíð (el plan lo prevé). Manos SIEMPRE en el volante al cruzar valles transversales y al pasar camiones. Ovejas en ruta todo el día. Fatiga: rotar/parar cada 1 h 30 — hoy es el día de más km del viaje.","planb":"<b>Clima muy malo:<\/b> cortar en Varmahlíð (camping [VERIFICAR]) y recalcular: mañana Borgarnes de un tirón + Snæfellsnes recortada (matriz #6/#5). <b>Cielo tapado a la noche:<\/b> no trasnochar — dormir y apostar a Snæfellsnes D13 (también spot top)."},{"n":13,"fecha":"Lunes 21 de septiembre","titulo":"Snæfellsnes: Kirkjufell · Vatnshellir · Djúpalónssandur · Arnarstapi","zona":"Borgarnes › Grundarfjörður › punta de Snæfellsnes › Arnarstapi","km":"170 km","cond":"~3 h","luz":"~07:08 / 19:32 (Arnarstapi: sunset ~19:38 según itinerario)","intensidad":"Media-alta","aurora":"Ventana activa","crono":[["09:00","Salida. Rte 54 noroeste hacia la península (\"Islandia en miniatura\").",1],["11:00–11:45","KIRKJUFELL + Kirkjufellsfoss: LA montaña más fotografiada del país. Composición clásica: cascada en primer plano, montaña-flecha detrás. Parking pago [VERIFICAR].",1],["12:00","Rte 54 oeste + costa norte › cruce a la cara sur.",0],["12:45","ALMUERZO EN HELLNAR: Fjöruhúsið — la sopa de pescado con vista a la caleta que justifica el viaje (efectivo/tarjeta [VERIFICAR], cierra temporada fin de sept [VERIFICAR]).",1],["13:50","Llegar al parking de VATNSHELLIR (10 min desde Hellnar).",1],["14:00–15:00","TOUR VATNSHELLIR (VHE-T129532012, operador Gufuskálar): tubo de lava de 8.000 años, 35 m bajo tierra, escaleras caracol. Abrigo: adentro hay 3-5 °C fijos.",1],["15:15","DJÚPALÓNSSANDUR (30 min): playa negra de guijarros, restos del naufragio del Epine (NO llevarse ni un fierrito), las 4 piedras de fuerza de los pescadores.",0],["16:30","ARNARSTAPI: paseo corto por los acantilados (Gatklettur, el arco) + el monumento a Bárður. El hike completo a Hellnar es MAÑANA a la mañana.",0],["19:38","Atardecer desde los acantilados. Cena. Auroras: la punta de la península es oscuridad pura.",0]],"ruta":"<b>Borgarnes › Grundarfjörður (1 h 45):<\/b> Rte 54 — primero llanura de Mýrar, después la costa norte con el fiordo Breiðafjörður y sus mil islas. Tramos de la 54 en la costa norte tienen sectores de ripio en obras [VERIFICAR road.is]. <b>Grundarfjörður › cara sur (45 min):<\/b> seguir la 54 al oeste y luego Rte 574 rodeando el glaciar-volcán Snæfellsjökull (el de Verne). <b>Hellnar › Vatnshellir (10 min) › Djúpalónssandur (10 min) › Arnarstapi (20 min):<\/b> todo sobre la 574.","pueblos":"<b>Grundarfjörður (~900 hab):<\/b> súper Kjörbúðin [VERIFICAR], gasolinera, panadería/café Láki. <b>Ólafsvík:<\/b> súper y gasolinera — última recarga cómoda antes de la punta. <b>Arnarstapi (aldea):<\/b> restaurant Samkomuhúsið + food trucks en temporada [VERIFICAR si siguen], sin súper. Hellnar: solo el café Fjöruhúsið y el hotel. Llegar con la heladera cargada desde Borgarnes.","camping":"<b>Camping Arnarstapi<\/b> — al pie del Stapafell, servicios buenos (duchas, electricidad) y restaurant al lado. ~2.000–3.000 ISK/pax. <b>[VERIFICAR apertura: cierra ~30 de septiembre según el plan — confirmar en tjalda.is].<\/b> <b>Plan B oficial:<\/b> campings de Hellissandur u Ólafsvík (20-30 min).","treks":[],"seguridad":"Acantilados de Arnarstapi: el pasto llega hasta el borde y el borde es cornisa socavada — no acercarse al filo ni con viento calmo. Djúpalónssandur: mismas olas traicioneras del sur — 30 m de la orilla. Vatnshellir: escaleras metálicas mojadas, guantes recomendados (baranda helada). La 574 al oeste del glaciar es solitaria: tanque y teléfono cargados.","planb":"<b>Si llueve fuerte:<\/b> Kirkjufell funciona con drama gris; Vatnshellir es EL plan de lluvia (subterráneo); se recorta Djúpalónssandur (matriz #6). <b>Si el camping de Arnarstapi ya cerró:<\/b> Hellissandur/Ólafsvík y mañana se arranca desde allí (suma 25 min al D14 — recalcular salida a 07:45)."},{"n":14,"fecha":"Martes 22 de septiembre","titulo":"Arnarstapi–Hellnar · Sky Lagoon · cena de cierre","zona":"Arnarstapi › Reikiavik › Sky Lagoon › Keflavík (Hotel Berg)","km":"250 km","cond":"~4 h","luz":"~07:10 / 19:28 (Sky Lagoon: sunset ~19:28 según itinerario)","intensidad":"Media","aurora":false,"crono":[["08:00–09:15","HIKE ARNARSTAPI–HELLNAR (5 km i/v por los acantilados): Gatklettur, colonias de aves, columnas de basalto, la costa masticada por el mar. Café en Hellnar si ya abrió [VERIFICAR].",1],["09:30","Rutina de salida COMPLETA del motorhome: vaciar químico y grises, llenar agua (último camping), ordenar para la devolución.",1],["11:30","Salida a Reikiavik: Rte 574/54 › Borgarnes › Rte 1 + túnel de Hvalfjörður (gratuito). 2 h 30.",0],["14:00","Reikiavik: almuerzo + SOUVENIRS (la ventana asignada del viaje): lana lopapeysa (Handknitting Association), sal, licorice, libros.",0],["16:30","Manejo a Kópavogur (15 min).",0],["17:00","SKY LAGOON (reserva 8052067): laguna infinita sobre el Atlántico + RITUAL de 7 pasos (hasta las 18:45). El sol se pone 19:28 EN el agua. Salida 20:00.",1],["20:30–22:15","CENA DE CIERRE: Grillmarkaðurinn (#9260784) — Lækjargata 2A, centro. El tasting de despedida.",1],["22:15","Manejo final Rte 41 a Keflavík (45 min).",0],["23:00","HOTEL BERG (Bakkavegur 17, Keflavík — Booking 6554950906, $123 — PAGADO). CAMA DE VERDAD. Dejar el motorhome cargado y listo para devolver.",1]],"ruta":"<b>Arnarstapi › Borgarnes (1 h 30):<\/b> Rte 574 este + Rte 54. <b>Borgarnes › Reikiavik (1 h):<\/b> Rte 1 sur con el túnel submarino de Hvalfjörður (5,7 km — gratuito desde 2018). <b>Reikiavik › Sky Lagoon (15 min):<\/b> está en Kársnes, Kópavogur — seguir señalización \"Sky Lagoon\" [estacionamiento del predio]. <b>Sky Lagoon › centro (15 min) › Keflavík (45 min):<\/b> Rte 41. Con la cena terminando 22:15, se llega ~23:00 — manejo nocturno corto y conocido (es la ruta del D1 al revés).","pueblos":"<b>Reikiavik (cierre):<\/b> souvenirs con criterio — lana auténtica en Handknitting Association of Iceland (Skólavörðustígur); evitar las tiendas \"puffin shop\" de made-in-china. Bónus para snacks del vuelo. <b>Keflavík:<\/b> todo cerca del hotel; desayuno del D15 incluido en Hotel Berg [VERIFICAR horario de inicio — necesario 07:30].","camping":"<b>HOY NO HAY CAMPING: Hotel Berg<\/b> (Bakkavegur 17, Keflavík) — $123 PAGADO, Booking 6554950906. Ducha larga, cama, y a 5 min del drop-off de mañana. El motorhome duerme en el parking del hotel [VERIFICAR que haya sitio para su tamaño].","treks":[{"nombre":"Arnarstapi › Hellnar (costero)","parking":"Parking Arnarstapi (junto al monumento a Bárður) — [VERIFICAR si cobran].","datos":"5 km i/v · llano · 1 h 15","qr":"t9"}],"seguridad":"Último día de volante largo: el cansancio acumulado de 14 días es real — parar en Borgarnes aunque no haga falta. Sky Lagoon: ducha desnudo antes (sí, también acá); el ritual incluye pileta fría — cardíacos moderar. No dejar NADA de valor a la vista en el motorhome en los estacionamientos de RVK/Sky Lagoon: recordar la letra chica del seguro (500 € máx. si queda dentro; de noche solo en parking cerrado/vigilado 22:00–06:00).","planb":"<b>Si el cuerpo dice basta a la mañana:<\/b> saltar el hike (matriz #10 — plan B oficial del día), salir 09:30 y ganar una tarde más lenta en RVK. <b>Si el tránsito complica la cena:<\/b> la reserva es 20:30; desde Sky Lagoon al centro son 15 min — el buffer de 30 min alcanza salvo desastre."},{"n":15,"fecha":"Miércoles 23 de septiembre","titulo":"Devolución y vuelo","zona":"Keflavík: Hotel Berg › Touring Cars › KEF","km":"5 km","cond":"~10 min","luz":"07:13 / 19:25","intensidad":"Baja (pero con reloj)","aurora":false,"crono":[["07:00","Despertar. Desayuno del hotel 07:30 [VERIFICAR horario].",0],["08:00","Check-out + última revisada al motorhome: nada olvidado en gavetas/heladera/baño; basura fuera; fotos del estado final POR DENTRO Y FUERA.",1],["08:30","DROP-OFF Touring Cars, Klettatröð 6 — HORARIO CONFIRMADO POR ESCRITO. Inspección conjunta 30–60 min: mostrar el video del D1 si discuten algo. Liquidar extras pendientes (garrafa de gas si no se recargó: 104 €/garrafa; química/linen ya contratados: 147 €).",1],["09:00–09:15","Shuttle de TC a la terminal [VERIFICAR — NO está confirmado; plan B: taxi local, ~3 km, minutos]. Check-in y equipaje.",1],["09:30–11:00","Seguridad + duty free (último skyr, chocolate Omnom, Brennivín si entra).",0],["11:30","DESPEGUE. Takk fyrir, Ísland.",1]],"ruta":"<b>Hotel Berg › Klettatröð 6 (5-8 min):<\/b> salir de Keflavík hacia Ásbrú. <b>ANTES del drop-off:<\/b> tanque LLENO — política full-to-full [VERIFICAR en contrato]; N1/Orkan de Njarðvík en el camino [VERIFICAR cuál abre antes de 08:30 — las automáticas con tarjeta funcionan 24 h]. <b>Gas:<\/b> si se pudo recargar la garrafa cerca de KEF (~8-10.000 ISK [VERIFICAR dónde]), entregarla llena; si no, se paga 104 €.","pueblos":"<b>Keflavík/Njarðvík:<\/b> gasolineras automáticas 24 h; panadería si sobra tiempo (no va a sobrar). En KEF: los precios del duty free de salida son de los pocos \"razonables\" del país para alcohol y dulces.","camping":"No aplica. La cadena de hoy: hotel (07:00) › tanque (08:10) › drop-off (08:30) › shuttle/taxi (09:15) › check-in (09:30) › vuelo (11:30). Cada eslabón tiene 15-30 min de colchón: no regalarlos.","treks":[],"seguridad":"El único riesgo de hoy es administrativo: la inspección. Armas: video del D1, fotos de hoy, y la carpeta de evidencia del seguro. Si aparece un cargo no esperado, pedir que lo detallen POR ESCRITO antes de firmar nada. Documentos a mano: pasaportes, reserva TC, vouchers, póliza Heymondo 2340350.","planb":"<b>Si la inspección se demora >60 min:<\/b> uno hace la inspección y el otro sale en taxi con las valijas al check-in. <b>Si el shuttle no aparece 09:15:<\/b> taxi sin dudar (son 3 km) — el vuelo no espera."}],"trek_urls":{"t1":["https://es.wikiloc.com/rutas-senderismo/valle-geotermal-de-reykjadalur-15849754","https://www.alltrails.com/trail/iceland/southern/reykjadalur-hot-spring-thermal-river"],"t2":["https://www.wikiloc.com/hiking-trails/fimmvorduhals-skogar-to const TRIP_START = new Date(2026, 8, 9); // 9 sept 2026 (local)
const N_DAYS = DATA.dias.length;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('is26:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('is26:' + k, JSON.stringify(v)); } catch (e) {} }
};
const WEEKD = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

// ---------- fecha ----------
function todayIndex() {
  const now = new Date();
  const d0 = new Date(TRIP_START.getFullYear(), TRIP_START.getMonth(), TRIP_START.getDate());
  const d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d1 - d0) / 86400000); // 0..14 durante el viaje
}
function dayDate(i) { return new Date(TRIP_START.getFullYear(), TRIP_START.getMonth(), TRIP_START.getDate() + i); }

// ---------- tema ----------
const THEMES = ['sol', 'noche', 'aurora'];
const THEME_LABEL = { sol: 'Modo sol', noche: 'Modo noche', aurora: 'Modo aurora' }; // muestra el modo actual; tocar = siguiente
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  $('#themeBtn').textContent = THEME_LABEL[t];
  $('meta[name=theme-color]').setAttribute('content', t === 'sol' ? '#E9EEF1' : t === 'noche' ? '#0B1721' : '#070000');
  store.set('theme', t);
}
let theme = store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'sol');
applyTheme(theme);
$('#themeBtn').onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); };

// ---------- navegación ----------
let cur = store.get('day', null);
const ti = todayIndex();
if (cur === null || ti >= 0 && ti < N_DAYS) cur = (ti >= 0 && ti < N_DAYS) ? ti : 0;
function showView(v) {
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#strip').style.display = v === 'hoy' ? 'flex' : 'none';
  window.scrollTo(0, 0);
  store.set('view', v);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { showView(b.dataset.v); if (b.dataset.v === 'hoy') renderDay(); });

// ---------- tira de días ----------
function renderStrip() {
  const s = $('#strip'); s.innerHTML = '';
  DATA.dias.forEach((d, i) => {
    const dt = dayDate(i);
    const b = document.createElement('button');
    b.className = 'dchip' + (i === cur ? ' sel' : '') + (i === ti ? ' hoy' : '') + (d.aurora ? ' au' : '');
    b.setAttribute('role', 'tab');
    b.innerHTML = `D${d.n}<small>${WEEKD[dt.getDay()]} ${dt.getDate()}</small>`;
    b.onclick = () => { cur = i; store.set('day', i); renderStrip(); renderDay(); };
    s.appendChild(b);
  });
  const sel = s.querySelector('.sel'); if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
}

// ---------- ficha del día ----------
function parseHM(s) { const m = /^(\d{1,2}):(\d{2})/.exec(s.replace('~', '').trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function luzParts(luz) { // "06:33 / 20:15 (nota)"
  const m = /(\d{1,2}:\d{2})\s*\/\s*(\d{1,2}:\d{2})/.exec(luz);
  return m ? [m[1], m[2]] : [null, null];
}
function renderDay() {
  if (document.activeElement && document.activeElement.id === 'nota') return; // no pisar notas mientras escriben
  const d = DATA.dias[cur], v = $('#v-hoy'), isToday = cur === ti;
  const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
  let banner = '';
  if (ti < 0) banner = `<div class="banner">Faltan ${-ti} días para Islandia. Mostrando el D${d.n}.</div>`;
  else if (ti >= N_DAYS) banner = `<div class="banner">El viaje terminó hace ${ti - N_DAYS + 1} día(s). Takk fyrir.</div>`;
  const [sr, ss] = luzParts(d.luz);
  let sunHtml = '';
  if (sr && ss) {
    const a = parseHM(sr), b = parseHM(ss), pct = m => (m / 1440 * 100).toFixed(1) + '%';
    let rest = '';
    if (isToday) rest = nowM < a ? `Amanece en ${fmtDur(a - nowM)}` : nowM < b ? `Quedan ${fmtDur(b - nowM)} de luz` : `Sin luz hasta ${sr} — hora de auroras`;
    sunHtml = `<div class="sun${isToday ? ' today' : ''}" style="--r:${pct(a)};--s:${pct(b)};--n:${pct(nowM)}">
      <div class="lbl"><span>Amanece ${sr}</span><span>${fmtDur(b - a)} de luz</span><span>Anochece ${ss}</span></div>
      <div class="bar"><div class="now"></div></div><div class="rest">${rest}${d.luz.includes('(') ? ' · ' + esc(d.luz.slice(d.luz.indexOf('(') + 1).replace(/\)$/, '')) : ''}</div></div>`;
  }
  const aur = d.aurora ? `<span class="chip au">Auroras: ${esc(d.aurora === true ? 'sí' : d.aurora)}</span>` : '';
  const ext = /EXTREM/i.test(d.intensidad);
  // crono: marcar pasado / ahora si es hoy
  let nowIdx = -1;
  if (isToday) d.crono.forEach((c, i) => { const m = parseHM(c[0]); if (m !== null && m <= nowM) nowIdx = i; });
  const crono = d.crono.map((c, i) => `<li class="${c[2] ? 'fix' : ''}${isToday && i < nowIdx ? ' past' : ''}${i === nowIdx ? ' now' : ''}"><div class="t">${esc(c[0])}</div><div class="x">${esc(c[1])}</div></li>`).join('');
  const treks = d.treks.length ? d.treks.map(t => {
    const u = DATA.trek_urls[t.qr] || [];
    const extra = t.qr === 'z1' ? `<a class="btn" href="https://megazipline.is" target="_blank" rel="noopener">megazipline.is</a><a class="btn o" href="tel:+3547823000">Llamar</a>` : '';
    return `<div class="trek"><div class="n">${esc(t.nombre)}</div><div class="d">${esc(t.datos)}</div><p class="small">${esc(t.parking)}</p>
      <div class="btns">${u[0] ? `<a class="btn" href="${u[0]}" target="_blank" rel="noopener">Wikiloc</a>` : ''}${u[1] ? `<a class="btn o" href="${u[1]}" target="_blank" rel="noopener">AllTrails</a>` : ''}${extra}${!u[0] && !u[1] && !extra ? '<span class="chip">[VERIFICAR] sin track</span>' : ''}</div></div>`;
  }).join('') : '<p class="mu">Sin trekking propio hoy (paseos cortos o tour guiado).</p>';
  const reservasHoy = DATA.reservas.filter(r => r.dia === d.n);
  const resHtml = reservasHoy.length ? `<div class="card fix"><b>Con reserva hoy</b>${reservasHoy.map(r => `<div style="margin-top:6px"><b>${esc(r.cuando.split('·').slice(-1)[0].trim())}</b> — ${esc(r.que)} <span class="mu">(${esc(r.ref)})</span></div>`).join('')}</div>` : '';
  const dt = dayDate(cur);
  v.innerHTML = `${banner}
    <p class="mu" style="margin:0">Día ${d.n} · ${esc(d.fecha)}${isToday ? ' · <b>HOY</b>' : ''}</p>
    <h1>${esc(d.titulo)}</h1>
    <div class="meta"><span class="chip">${esc(d.zona)}</span></div>
    <div class="meta"><span class="chip">${esc(d.km)}</span><span class="chip">${esc(d.cond)}</span><span class="chip${ext ? ' ext' : ''}">Intensidad: ${esc(d.intensidad)}</span>${aur}</div>
    ${sunHtml}
    ${resHtml}
    <details open><summary>Cronograma</summary><div class="body"><ul class="crono">${crono}</ul><p class="small mu" style="margin-top:8px">Rojo = horario fijo (reserva o luz). ${isToday ? 'Se atenúa lo ya pasado según la hora del teléfono.' : ''}</p></div></details>
    <details><summary>Ruta</summary><div class="body">${d.ruta}</div></details>
    <details><summary>Pueblos y servicios</summary><div class="body">${d.pueblos}</div></details>
    <details><summary>Camping</summary><div class="body">${d.camping}</div></details>
    <details><summary>Miradores y puntos en ruta</summary><div class="body">${(DATA.pois[String(d.n)] || []).map(p => `<div class="trek"><div class="n">${p[0] === '●' ? '<span style="color:var(--ac)">●</span>' : '<span class="mu">○</span>'} ${esc(p[1])}</div><p class="small" style="margin:2px 0 0">${esc(p[2])}</p></div>`).join('') || '<p class="mu">—</p>'}<p class="small mu" style="margin-top:8px">● está en el plan · ○ extra solo si sobra tiempo (no mueve el cronograma).</p></div></details>
    <details ${d.treks.length ? 'open' : ''}><summary>Treks y tracks GPS</summary><div class="body">${treks}<p class="small mu">Los links abren la web (o la app si está instalada). Los GPX ya deben estar cargados en el Garmin y en el teléfono antes de salir.</p></div></details>
    <details class="saf" open><summary>Seguridad del día</summary><div class="body">${d.seguridad}</div></details>
    <details class="pb" open><summary>Plan B</summary><div class="body">${d.planb}</div></details>
    <h2>Notas del día</h2>
    <textarea id="nota" placeholder="Lo que quieras recordar de hoy: gastos, cambios, dónde cargaron combustible…">${esc(store.get('nota' + d.n, ''))}</textarea>
    <div class="btns" style="margin-top:8px">${cur > 0 ? `<button class="btn o" id="prev">← D${cur}</button>` : ''}${cur < N_DAYS - 1 ? `<button class="btn o right" id="next">D${cur + 2} →</button>` : ''}</div>`;
  $('#nota').oninput = e => store.set('nota' + d.n, e.target.value);
  const p = $('#prev'), n = $('#next');
  if (p) p.onclick = () => { cur--; store.set('day', cur); renderStrip(); renderDay(); };
  if (n) n.onclick = () => { cur++; store.set('day', cur); renderStrip(); renderDay(); };
}
function fmtDur(m) { const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} h ${String(mm).padStart(2, '0')}` : `${mm} min`; }

// ---------- reservas ----------
const ST_LABEL = { pagado: 'Pagado', alla: 'Se paga allá', pendiente: 'Pendiente', verificar: '[VERIFICAR]' };
let rfilter = 'todas';
function renderReservas() {
  const v = $('#v-reservas');
  const list = DATA.reservas.filter(r => rfilter === 'todas' || r.estado === rfilter);
  v.innerHTML = `<h1>Reservas</h1><p class="mu small">Tabla maestra según contexto v15 (4/9). Tocar la referencia para copiarla.</p>
    <div class="filters">${['todas', 'pagado', 'alla', 'pendiente', 'verificar'].map(f => `<button class="chip${rfilter === f ? ' sel' : ''}" data-f="${f}">${f === 'todas' ? 'Todas' : ST_LABEL[f]}</button>`).join('')}</div>
    ${list.map(r => `<div class="card rv">
      <div class="top-l"><div><div class="q">${esc(r.que)}</div><div class="w">${esc(r.cuando)}${r.dia ? ' · D' + r.dia : ''}</div></div><span class="st ${r.estado}">${ST_LABEL[r.estado]}</span></div>
      <div class="ref" data-copy="${esc(r.ref)}"><span>${esc(r.ref)}</span><span class="small mu">${esc(r.monto)}</span></div>
      <p class="small">${esc(r.nota)}</p>
      <div class="btns">${r.url ? `<a class="btn sm" href="${r.url}" target="_blank" rel="noopener">${esc(r.prov)}</a>` : `<span class="chip">${esc(r.prov)}</span>`}${r.tel ? `<a class="btn sm o" href="tel:${r.tel.replace(/\s/g, '')}">Llamar</a>` : ''}${r.mail ? `<a class="btn sm o" href="mailto:${r.mail}">Mail</a>` : ''}</div>
    </div>`).join('')}
    ${rfilter === 'todas' ? `<div class="card ac"><b>${esc(DATA.cuentas.titulo)}</b><div style="font-size:1.15rem;font-weight:700;margin:6px 0">${esc(DATA.cuentas.saldo)}</div><p class="small">${esc(DATA.cuentas.detalle)}</p><p class="small"><b>Afuera del número:</b> ${DATA.cuentas.fuera.map(esc).join(' ')}</p><p class="small mu">${esc(DATA.cuentas.nota)}</p></div>` : ''}`;
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { rfilter = b.dataset.f; renderReservas(); });
  v.querySelectorAll('[data-copy]').forEach(el => el.onclick = () => {
    const t = el.dataset.copy; if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { el.firstElementChild.textContent = 'Copiado ✓'; setTimeout(() => el.firstElementChild.textContent = t, 1200); });
  });
}

  const M = DATA.matriz, v = $('#v-recorte');

    <h2>Reglas de disciplina y colapsos</h2><div class="card pb"><ul style="margin:0;padding-left:20px">${M.colapso.map(x => `<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul></div>`;

// ---------- checklists ----------
function ckGroup(title, key, items, opts = {}) {
  const st = store.get(key, {});
  const done = items.filter(i => st[i[0]]).length;
  return `<h2>${title}${opts.reset ? `<button class="btn sm o right" data-reset="${key}" style="float:right">Reiniciar</button>` : ''}</h2>
    <div class="prog">${done}/${items.length}${opts.sub ? ' · ' + opts.sub : ''}</div>
    <div class="card">${items.map(i => `<label class="ck${st[i[0]] ? ' done' : ''}"><input type="checkbox" data-g="${key}" data-k="${i[0]}" ${st[i[0]] ? 'checked' : ''}><span>${esc(i[1])}</span></label>`).join('')}</div>`;
}
function renderCheck() {
  const v = $('#v-check');
  const hoy = new Date(), dk = 'rut:' + hoy.getFullYear() + '-' + (hoy.getMonth() + 1) + '-' + hoy.getDate();
  v.innerHTML = `<h1>Checklist</h1>
    ${ckGroup('Rutina matinal (10 min)', dk, DATA.rutina, { sub: 'se reinicia sola cada día', reset: true })}
    ${ckGroup('Semana previa', 'pre', DATA.check_previaje, { reset: true })}
    ${ckGroup('Devolución D15', 'dev', DATA.check_devolucion, { reset: true })}`;
  v.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    const st = store.get(c.dataset.g, {}); st[c.dataset.k] = c.checked; store.set(c.dataset.g, st); renderCheck();
  });
  v.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { if (confirm('¿Desmarcar toda esta lista?')) { store.set(b.dataset.reset, {}); renderCheck(); } });
}

// ---------- links ----------
function renderLinks() {
  $('#v-links').innerHTML = `<h1>Links rápidos</h1><p class="mu small">Necesitan señal. En ruta: mirar vedur + road ANTES de salir del camping, cuando hay wifi.</p>
    ${DATA.links.map(l => `<a class="lk" href="${l[1]}" target="_blank" rel="noopener"><b>${esc(l[0])}</b><small>${esc(l[2])}</small></a>`).join('')}
    <p class="small mu" style="margin-top:16px">Datos: ${esc(DATA.meta.version_fuente)} · ${DATA.meta.km_total.toLocaleString('es')} km · presupuesto $${esc(DATA.meta.presupuesto_usd)}. App v${DATA.meta.app_version}.</p>`;
}

// ---------- arranque ----------
renderStrip(); renderDay(); renderReservas(); renderSOS(); renderRecorte(); renderCheck(); renderLinks();
showView(store.get('view', 'hoy'));
if (store.get('view', 'hoy') !== 'hoy') { /* si abren en otra pestaña, igual actualizamos el día actual al volver */ }
function setOnline() { document.body.classList.toggle('offline', !navigator.onLine); }
addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderDay(); renderCheck(); } });
setInterval(() => { if ($('#v-hoy').classList.contains('on')) renderDay(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
